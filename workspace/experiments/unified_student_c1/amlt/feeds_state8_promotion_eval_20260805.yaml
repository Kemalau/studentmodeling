      export C4_PROGRESS_DIR="/mnt/amulet/studentmodeling/eval_progress/state8_qualified_teacher_$${PROMOTION_VARIANT}_v1/c4_seed$${PAIR_SEED}_v1"
      mkdir -p "$$HF_HUB_CACHE" "$$AMLT_OUTPUT_DIR/eval/c4" "$$C4_PROGRESS_DIR"
      test -f "$$CHECKPOINT/adapter_model.safetensors"
      test -f "$$CHECKPOINT/recurrent_state.pt"
      test -f "$$COMPLETION"
      test -f "$$IMMUTABLE_RECEIPT"
