# Generated from the Feeds Singularity template for the immutable qualified state8
# checkpoint. Four disjoint T3 shards and three C4 pair seeds run independently.
description: Qualified-teacher State8 full T3 and multiseed C4 promotion evaluation

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-promotion-eval-venv
    - /tmp/studentmodeling-state8-promotion-eval-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-promotion-eval-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-promotion-t3-shard0
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &t3_command |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      export PATH="/tmp/studentmodeling-state8-promotion-eval-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export RAW_EVAL=/mnt/amulet/studentmodeling/formal_evaluation_v1/test.jsonl
      export RECURRENT_EVAL=/tmp/recurrent_formal_evaluation_fixedu4_v2/test.jsonl
      : "$${PROMOTION_VARIANT:?PROMOTION_VARIANT is required}"
      case "$$PROMOTION_VARIANT" in
        t3_heavy)
          export RESULT_ROOT=/mnt/amulet/studentmodeling/diagnostics/state8_qualified_teacher_curriculum_v1_immutable
          export EXPECTED_IMMUTABLE_STAGE=state8_qualified_teacher_curriculum_immutable_v1 ;;
        balanced)
          export RESULT_ROOT=/mnt/amulet/studentmodeling/diagnostics/state8_qualified_teacher_balanced_curriculum_v1_immutable
          export EXPECTED_IMMUTABLE_STAGE=state8_qualified_teacher_balanced_curriculum_immutable_v1 ;;
        highkd)
          export RESULT_ROOT=/mnt/amulet/studentmodeling/diagnostics/state8_qualified_teacher_curriculum_highkd_v1_immutable
          export EXPECTED_IMMUTABLE_STAGE=state8_qualified_teacher_curriculum_highkd_immutable_v1 ;;
        *) exit 2 ;;
      esac
      export CHECKPOINT="$$RESULT_ROOT/model"
      export COMPLETION="$$RESULT_ROOT/metrics/completion.json"
      export IMMUTABLE_RECEIPT="$$RESULT_ROOT/metrics/immutable_receipt.json"
      export QUALIFIED_RECEIPT="$$RESULT_ROOT/metrics/qualified_teacher_receipt.json"
      export T3_PROGRESS_DIR="/mnt/amulet/studentmodeling/eval_progress/state8_qualified_teacher_$${PROMOTION_VARIANT}_v1/t3_shard$${SHARD_INDEX}_v1"
      mkdir -p "$$HF_HUB_CACHE" "$$(dirname "$$RECURRENT_EVAL")" "$$AMLT_OUTPUT_DIR/eval/t3" "$$T3_PROGRESS_DIR"
      test -f "$$CHECKPOINT/adapter_model.safetensors"
      test -f "$$CHECKPOINT/recurrent_state.pt"
      test -f "$$COMPLETION"
      test -f "$$IMMUTABLE_RECEIPT"
      test -f "$$QUALIFIED_RECEIPT"
      python - "$$CHECKPOINT" "$$COMPLETION" "$$IMMUTABLE_RECEIPT" "$$QUALIFIED_RECEIPT" "$$PROMOTION_VARIANT" "$$EXPECTED_IMMUTABLE_STAGE" <<'PY'
      import hashlib,json,pathlib,sys
      root=pathlib.Path(sys.argv[1]); receipt=json.load(open(sys.argv[2])); immutable=json.load(open(sys.argv[3])); qualified=json.load(open(sys.argv[4])); variant=sys.argv[5]; expected_stage=sys.argv[6]
      replay_variant='t3_heavy' if variant=='highkd' else variant
      def digest(path):
          h=hashlib.sha256()
          with open(path,'rb') as f:
              for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
          return h.hexdigest()
      observed={'adapter_model':digest(root/'adapter_model.safetensors'),
                'recurrent_state':digest(root/'recurrent_state.pt')}
      assert receipt['status']=='complete' and receipt['diagnostic'] is False,receipt
      assert receipt['micro_steps']==5000 and receipt['real_examples_seen_once'] is True,receipt
      assert {k:receipt['sha256'][k] for k in observed}==observed,(receipt,observed)
      assert immutable['stage']==expected_stage and immutable['replay_variant']==replay_variant,immutable
      assert float(qualified['online_kd_weight'])==(1.0 if variant=='highkd' else 0.5),qualified
      assert immutable['teacher_adapter_sha256'] and immutable['sha256']==observed,immutable
      PY
      test -f "$$RAW_EVAL"
      test "$$(df --output=avail /tmp | tail -1)" -ge 83886080
      test "$$(sha256sum "$$RAW_EVAL" | cut -d' ' -f1)" = bff7726953ae048bedf6dacdbb7500a54cb8de305e406f2497ef1f11c04167f8
      test "$$(sha256sum scripts/evaluate_recurrent_formal_protocols.py | cut -d' ' -f1)" = 262370592e018641b99d6282858d8990b38314c05bb6e3bbc645823834cf73ed
      test "$$(sha256sum scripts/state8_natural_curriculum_view.py | cut -d' ' -f1)" = 98c961180d2428b2c68ef9399996ed991d5bd34120a3046b4f56fb9ba4e09682
      test "$$(sha256sum scripts/build_recurrent_evaluation_manifest.py | cut -d' ' -f1)" = d335b0b97471683eb1f317f21af6f0dd36ccca0fe6a8e495838112785ea85a8e
      python -m pytest -q tests/test_evaluate_recurrent_formal_protocols.py tests/test_state8_natural_curriculum_view.py
      python scripts/build_recurrent_evaluation_manifest.py \
        --input-jsonl "$$RAW_EVAL" --output-jsonl "$$RECURRENT_EVAL" \
        --audit-json /tmp/recurrent_formal_evaluation_fixedu4_v2/audit.json \
        --max-updates 4 --seed 20260730
      test "$$(sha256sum "$$RECURRENT_EVAL" | cut -d' ' -f1)" = a368cefb0c49cb6a305ad1a892808361fba2d44d555a0a28ea64e56babe32525
      export T3_PROGRESS_KEY="$$(sha256sum "$$CHECKPOINT/adapter_model.safetensors" "$$CHECKPOINT/recurrent_state.pt" "$$RECURRENT_EVAL" scripts/evaluate_recurrent_formal_protocols.py scripts/evaluate_state8_t3_resumable.py scripts/t3_resumable_progress.py scripts/state8_natural_curriculum_view.py | cut -d' ' -f1 | tr '\n' ':'):$${SHARD_INDEX}:4"
      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
      python -u scripts/evaluate_state8_t3_resumable.py \
        --model "$$LOCAL_MODEL" --adapter "$$CHECKPOINT" \
        --recurrent-state "$$CHECKPOINT/recurrent_state.pt" \
        --state-architecture layerwise --eval-jsonl "$$RECURRENT_EVAL" \
        --output-dir "$$AMLT_OUTPUT_DIR/eval/t3" \
        --state-token-alias '<|vision_pad|>' --max-length 1536 --max-new-tokens 128 \
        --state-batch-size 2 --candidate-row-batch-size 2 \
        --tasks diagnose_misconception --sources eedi_mining malrule \
        --shard-index "$$SHARD_INDEX" --num-shards 4 --seed 42 \
        --generation-progress-dir "$$T3_PROGRESS_DIR" --generation-progress-key "$$T3_PROGRESS_KEY" \
        --save-unredacted-predictions --t3-natural-schema
      python - "$$AMLT_OUTPUT_DIR/eval/t3/metrics.json" "$$SHARD_INDEX" <<'PY'
      import json,sys
      x=json.load(open(sys.argv[1],encoding='utf-8')); index=int(sys.argv[2])
      assert x['state_architecture']=='layerwise' and x['state_shape']==[64,8,5120],x
      assert x['raw_history_visible_to_decoder'] is False,x
      assert x['persistent_history_kv_cache'] is False,x
      assert x['unsharded_filtered_rows']==1494,x
      assert x['evaluation_shard']=={'index':index,'count':4},x
      assert x['sampled_rows'] in {373,374},x
      assert len(x['artifact_sha256']['adapter_model'])==64,x
      assert len(x['artifact_sha256']['recurrent_state'])==64,x
      PY
      cp /tmp/recurrent_formal_evaluation_fixedu4_v2/audit.json "$$AMLT_OUTPUT_DIR/eval/t3/manifest_audit.json"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 43200
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        PROMOTION_VARIANT: t3_heavy
        SHARD_INDEX: '0'

