# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
description: Seven-job state-alias factorial for curriculum attribution, seed replication, and pretrained-token specificity

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state-factorial-venv
    - /tmp/studentmodeling-state-factorial-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state-factorial-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state-cf1-visionpad-seed13
    sku: 80G1-A100
    sla_tier: Standard
    command: &factorial_command |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-state-factorial-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export C4_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean
      export PAIR_MANIFEST="$$AMLT_CODE_DIR/manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json"

      case "$$CONDITION" in
        cf1)
          export TRAIN_DATA=/mnt/amulet/studentmodeling/state_curriculum_stage_a_v1/train.jsonl
          export VALID_DATA=/mnt/amulet/studentmodeling/state_curriculum_stage_a_v1/valid.jsonl
          expected_train=929487329576607572aa49b8e2daba53605b3c733749e7e631baa376a9df65f9
          expected_valid=4bf7117db760bcaba9790b8f7901ae89428911359f2b483f08aef39dc1fe6a36
          max_train=6000
          max_valid=600
          task_args=()
          ;;
        original)
          export TRAIN_DATA="$$C4_DATA/train.jsonl"
          export VALID_DATA="$$C4_DATA/val.jsonl"
          expected_train=6fa5f4160e4a096db6228eb165136d927d0a72bae5a8e5dce9df5bda71a73dae
          expected_valid=e928dbe191cf85a00b12a78b5b1e4bb8bd8800bd31a19d5310c4e263e3355d25
          max_train=3000
          max_valid=300
          task_args=(--task-filter malrule_next_response)
          ;;
        *)
          echo "Unknown CONDITION=$$CONDITION" >&2
          exit 2
          ;;
      esac

      export RUN_DIR="/mnt/amulet/studentmodeling/checkpoints/state_alias_factorial_$${CONDITION}_$${TOKEN_NAME}_seed$${TRAIN_SEED}_20260729"
      mkdir -p "$$HF_HUB_CACHE" "$$AMLT_OUTPUT_DIR/model" "$$AMLT_OUTPUT_DIR/gate" "$$RUN_DIR"
      available_kb=$$(df --output=avail /tmp | tail -1)
      test "$$available_kb" -ge 125829120
      test -f "$$TRAIN_DATA"
      test -f "$$VALID_DATA"
      test -f "$$C4_DATA/test_same_template.jsonl"
      test -f "$$C4_DATA/test_cross_template.jsonl"
      test -f "$$PAIR_MANIFEST"
      test "$$(sha256sum "$$TRAIN_DATA" | cut -d' ' -f1)" = "$$expected_train"
      test "$$(sha256sum "$$VALID_DATA" | cut -d' ' -f1)" = "$$expected_valid"
      test "$$(sha256sum "$$C4_DATA/test_same_template.jsonl" | cut -d' ' -f1)" = 079f7634cc54dfd55dfc234503bb5925ab734b1ca74aa2f2a9a17cc4375a2c2f
      test "$$(sha256sum "$$C4_DATA/test_cross_template.jsonl" | cut -d' ' -f1)" = 405446c371185d23f06b4a0530c8ef4da4d1ac9addb696180f83bdf092402779
      test "$$(sha256sum "$$PAIR_MANIFEST" | cut -d' ' -f1)" = edcdb934a65252557f6c569eea9ef7a85e5445549deac9fb4829c3f579e1a9b8
      {
        echo "condition=$$CONDITION"
        echo "token_name=$$TOKEN_NAME"
        echo "state_token_alias=$$STATE_TOKEN_ALIAS"
        echo "train_seed=$$TRAIN_SEED"
        sha256sum "$$TRAIN_DATA" "$$VALID_DATA" "$$C4_DATA/test_same_template.jsonl" \
          "$$C4_DATA/test_cross_template.jsonl" "$$PAIR_MANIFEST"
      } | tee "$$AMLT_OUTPUT_DIR/input_manifest.txt"

      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" \
        --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader

      if [[ ! -f "$$RUN_DIR/final_adapter/adapter_model.safetensors" ]]; then
        latest=""
        mapfile -t checkpoints < <(find "$$RUN_DIR" -mindepth 1 -maxdepth 1 -type d -name 'checkpoint-*' | sort -V)
        for ((i=$${#checkpoints[@]}-1; i>=0; i--)); do
          candidate="$${checkpoints[$$i]}"
          if [[ -f "$$candidate/adapter_model.safetensors" \
                && -f "$$candidate/optimizer.pt" \
                && -f "$$candidate/scheduler.pt" \
                && -f "$$candidate/trainer_state.json" ]]; then
            latest="$$candidate"
            break
          fi
        done
        resume_args=()
        if [[ -n "$$latest" ]]; then
          echo "[resume] checkpoint=$$latest"
          resume_args=(--resume-from-checkpoint "$$latest")
        else
          echo "[resume] no complete checkpoint; starting from step 0"
        fi

        python -u scripts/train_c1_lora.py \
          --model "$$LOCAL_MODEL" \
          --train-jsonl "$$TRAIN_DATA" \
          --valid-jsonl "$$VALID_DATA" \
          --output-dir "$$RUN_DIR" \
          --max-length 1536 \
          --max-train-samples "$$max_train" \
          --max-valid-samples "$$max_valid" \
          --max-steps 1500 \
          --per-device-train-batch-size 1 \
          --per-device-eval-batch-size 1 \
          --gradient-accumulation-steps 4 \
          --learning-rate 1e-4 \
          --lora-rank 8 \
          --lora-alpha 16 \
          --load-4bit \
          --state-token-alias "$$STATE_TOKEN_ALIAS" \
          --bottleneck-mask \
          --bottleneck-style late_fusion \
          --supervise-eos \
          --logging-steps 20 \
          --eval-steps 750 \
          --save-steps 250 \
          --seed "$$TRAIN_SEED" \
          "$${task_args[@]}" \
          "$${resume_args[@]}"
      fi
      test -f "$$RUN_DIR/final_adapter/adapter_model.safetensors"
      cp -r "$$RUN_DIR/final_adapter/." "$$AMLT_OUTPUT_DIR/model/"
      cp "$$RUN_DIR/run_config.json" "$$AMLT_OUTPUT_DIR/model/run_config.json"

      python -u scripts/evaluate_c1.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --train-jsonl "$$C4_DATA/train.jsonl" \
        --eval-jsonl "$$C4_DATA/test_same_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/response_same_masked.json" \
        --tasks malrule_next_response \
        --max-samples-per-task 300 \
        --max-length 1536 \
        --batch-size 2 \
        --bottleneck-mask \
        --bottleneck-style late_fusion \
        --state-token-alias "$$STATE_TOKEN_ALIAS" \
        --load-4bit \
        --progress-every 50

      python -u scripts/evaluate_c1.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --train-jsonl "$$C4_DATA/train.jsonl" \
        --eval-jsonl "$$C4_DATA/test_cross_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/response_cross_masked.json" \
        --tasks malrule_next_response \
        --max-samples-per-task 300 \
        --max-length 1536 \
        --batch-size 2 \
        --bottleneck-mask \
        --bottleneck-style late_fusion \
        --state-token-alias "$$STATE_TOKEN_ALIAS" \
        --load-4bit \
        --progress-every 50

      python -u scripts/probe_student_state_smoke.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --train-jsonl "$$C4_DATA/train.jsonl" \
        --same-jsonl "$$C4_DATA/test_same_template.jsonl" \
        --cross-jsonl "$$C4_DATA/test_cross_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/state_probe_masked.json" \
        --task malrule_next_response \
        --layers 0,8,16,24,32,40,48,56,63 \
        --train-per-label 50 \
        --eval-per-label 15 \
        --max-length 1536 \
        --batch-size 2 \
        --epochs 250 \
        --lr 0.1 \
        --weight-decay 1e-4 \
        --seed 42 \
        --state-token-alias "$$STATE_TOKEN_ALIAS" \
        --bottleneck-mask \
        --bottleneck-style late_fusion

      python -u scripts/state_swap_misconception_smoke.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --jsonl "$$C4_DATA/test_same_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/state_swap_masked.json" \
        --task malrule_next_response \
        --swap-target response \
        --layers all \
        --num-pairs 150 \
        --pair-manifest "$$PAIR_MANIFEST" \
        --max-length 1536 \
        --seed 42 \
        --state-token-alias "$$STATE_TOKEN_ALIAS" \
        --bottleneck-mask \
        --bottleneck-style late_fusion

      python -u scripts/summarize_stage_a_gate.py \
        --gate-dir "$$AMLT_OUTPUT_DIR/gate" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/gate_summary.json"
    submit_args: &cf1_visionpad_seed13_submit
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        CONDITION: cf1
        TOKEN_NAME: visionpad
        STATE_TOKEN_ALIAS: '<|vision_pad|>'
        TRAIN_SEED: '13'

  - name: state-cf1-visionpad-seed97
    sku: 80G1-A100
    sla_tier: Standard
    command: *factorial_command
    submit_args:
      max_attempts: 2
