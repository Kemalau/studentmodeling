# Reuses the approved template-derived State8 bridge evaluator as a one-job
# config for the immutable one-A100 GA4 fallback artifact.
description: Strict State8 evaluation for the strong1-to-State8 one-A100 fallback

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-strong1-widen8-single-eval-venv
    - /tmp/studentmodeling-state8-strong1-widen8-single-eval-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-strong1-widen8-single-eval-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-strong1-widen8-single-eval-lr5e7-seed60
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      bash scripts/run_state8_strong1_widen8_eval.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-strong1-widen8-single-eval-venv
        CANDIDATE_SLUG: single_lr5e7_seed60
        STATE8_EVAL_ROOT: /mnt/amulet/studentmodeling/diagnostics/state8_qualified_teacher_curriculum_highkd_v1_immutable_taxonomy_semantic_v1_strong1_widen8_single_lr5e7_seed60_single_ga4
