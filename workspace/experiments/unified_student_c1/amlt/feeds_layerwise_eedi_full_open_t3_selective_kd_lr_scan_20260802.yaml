# Generated from `amlt template -t Feeds -n 2`, then filled with the approved
# image, UAI, remote storage, and the selective-KD open-T3 diagnostic recipe.
# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
description: Full-support Eedi open-T3 selective-KD learning-rate scan from immutable layerwise round-750

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-layerwise-eedi-full-open-t3-selective-kd-lr-venv
    - /tmp/studentmodeling-layerwise-eedi-full-open-t3-selective-kd-lr-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-layerwise-eedi-full-open-t3-selective-kd-lr-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: layerwise-eedi-full-open-t3-selective-kd-lr2e6-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: &command |
      set -euo pipefail
      bash scripts/run_layerwise_task_retention_rehearsal.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-layerwise-eedi-full-open-t3-selective-kd-lr-venv
        BRANCH: eedi_full_open_t3
        LOSS_PROFILE: state_kd
        TRAIN_ENTRYPOINT: scripts/train_recurrent_student_m4_open_t3_selective_kd.py
        SEGMENT_ROWS: '5000'
        LEARNING_RATE: '2e-6'
        EXPECTED_CAUSAL_PAIRS: '250'
        DIAGNOSTIC_STOP_AFTER_ROUND: '4250'
        MANIFEST: /tmp/layerwise_extended_manifests/layerwise_task_retention_eedi_full_seed42_v1.json
        MANIFEST_SHA256: 97bef6748b1fa8d75809e9e01c9b76d57b6534d336b7037217289932a31df393

  - name: layerwise-eedi-full-open-t3-selective-kd-lr5e6-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-layerwise-eedi-full-open-t3-selective-kd-lr-venv
        BRANCH: eedi_full_open_t3
        LOSS_PROFILE: state_kd
        TRAIN_ENTRYPOINT: scripts/train_recurrent_student_m4_open_t3_selective_kd.py
        SEGMENT_ROWS: '5000'
        LEARNING_RATE: '5e-6'
