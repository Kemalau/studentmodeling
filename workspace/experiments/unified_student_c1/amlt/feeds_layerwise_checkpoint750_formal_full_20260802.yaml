description: Read-only full-support strict-history-free T2/T3/T5 evaluation of the
  immutable layerwise round-750 checkpoint
target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
  - python -m venv --system-site-packages /tmp/studentmodeling-layerwise-final-eval-venv
  - /tmp/studentmodeling-layerwise-final-eval-venv/bin/python -m pip install --upgrade
    pip
  - /tmp/studentmodeling-layerwise-final-eval-venv/bin/python -m pip install -r requirements-feeds.txt
code:
  local_dir: $CONFIG_DIR/..
  ignore:
  - .git/
  - .vscode/
  - amlt/
  - data/
  - results/
  - __pycache__/
  - '*.pyc'
storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true
jobs:
- name: layerwise-checkpoint750-full-t2-seed42
  sku: 80G1-A100
  process_count_per_node: 1
  mpi: false
  sla_tier: Standard
  command: "set -euo pipefail\nexport PATH=\"/tmp/studentmodeling-layerwise-final-eval-venv/bin:$$PATH\"\
    \nexport PYTHONPATH=\"$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}\"\n\
    export HF_HOME=/tmp/hf_cache\nexport HF_HUB_CACHE=/tmp/hf_cache/hub\nexport HF_HUB_DISABLE_XET=1\n\
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True\nexport TRANSFORMERS_VERBOSITY=error\n\
    export LOCAL_MODEL=/tmp/Qwen3-32B\nexport RAW_EVAL=/mnt/amulet/studentmodeling/formal_evaluation_v1/test.jsonl\n\
    export RECURRENT_EVAL=/tmp/layerwise_final_formal_eval_u4_v1/test.jsonl\nexport\
    \ RUN_DIR=/mnt/amulet/studentmodeling/diagnostics/layerwise_unified_finalfit_seed42_20260801_snapshot\n\
    export CHECKPOINT=\"$$RUN_DIR/checkpoint-round-750\"\nmkdir -p \"$$HF_HUB_CACHE\"\
    \ \"$$(dirname \"$$RECURRENT_EVAL\")\" \"$$AMLT_OUTPUT_DIR/eval/$$EVAL_GROUP\"\
    \ntest -f \"$$RAW_EVAL\"\ntest -f \"$$CHECKPOINT/adapter/adapter_config.json\"\
    \ntest -f \"$$CHECKPOINT/adapter/adapter_model.safetensors\"\ntest -f \"$$CHECKPOINT/recurrent_state.pt\"\
    \ntest -f \"$$CHECKPOINT/checkpoint_completion.json\"\npython - \"$$CHECKPOINT\"\
    \ <<'PY'\nimport hashlib,json,pathlib,sys\nroot=pathlib.Path(sys.argv[1]); receipt=json.load(open(root/'checkpoint_completion.json',encoding='utf-8'))\n\
    def digest(path):\n    value=hashlib.sha256()\n    with path.open('rb') as handle:\n\
    \        for chunk in iter(lambda:handle.read(1024*1024),b''): value.update(chunk)\n\
    \    return value.hexdigest()\nassert receipt.get('status')=='complete' and receipt.get('round')==750,receipt\n\
    assert receipt.get('world_size')==16,receipt\nassert receipt['sha256']['adapter_model']==digest(root/'adapter/adapter_model.safetensors')\n\
    assert receipt['sha256']['recurrent_state']==digest(root/'recurrent_state.pt')\n\
    PY\ntest \"$$(df --output=avail /tmp | tail -1)\" -ge 83886080\ntest \"$$(sha256sum\
    \ \"$$RAW_EVAL\" | cut -d' ' -f1)\" = bff7726953ae048bedf6dacdbb7500a54cb8de305e406f2497ef1f11c04167f8\n\
    test \"$$(sha256sum scripts/evaluate_recurrent_formal_protocols.py | cut -d' '\
    \ -f1)\" = 7bdb9b7b6e9f4c37db4c8551bba8eb9260a989e707fe535ff6922d03fe082cd2\n\
    test \"$$(sha256sum scripts/frozen_layerwise_finalfit/layerwise_recurrent_student_model.py\
    \ | cut -d' ' -f1)\" = c80357282e600b31f68f55d8ab434ad349c0e9eeeeb222b52dbadae7caea11ca\n\
    test \"$$(sha256sum tests/frozen_layerwise_finalfit/test_layerwise_recurrent_student_model.py\
    \ | cut -d' ' -f1)\" = a995f82f364eb3247ff3e17873cc720bbce7a2a8f52813c9369421fa61d3c274\n\
    cp scripts/frozen_layerwise_finalfit/layerwise_recurrent_student_model.py scripts/layerwise_recurrent_student_model.py\n\
    cp tests/frozen_layerwise_finalfit/test_layerwise_recurrent_student_model.py tests/test_layerwise_recurrent_student_model.py\n\
    test \"$$(sha256sum scripts/layerwise_recurrent_student_model.py | cut -d' ' -f1)\"\
    \ = c80357282e600b31f68f55d8ab434ad349c0e9eeeeb222b52dbadae7caea11ca\ntest \"\
    $$(sha256sum scripts/build_recurrent_evaluation_manifest.py | cut -d' ' -f1)\"\
    \ = d335b0b97471683eb1f317f21af6f0dd36ccca0fe6a8e495838112785ea85a8e\npython -m\
    \ unittest discover -s tests -p 'test_evaluate_recurrent_formal_protocols.py'\
    \ -v\npython -m unittest discover -s tests -p 'test_layerwise_recurrent_student_model.py'\
    \ -v\npython scripts/build_recurrent_evaluation_manifest.py \\\n  --input-jsonl\
    \ \"$$RAW_EVAL\" --output-jsonl \"$$RECURRENT_EVAL\" \\\n  --audit-json /tmp/layerwise_final_formal_eval_u4_v1/audit.json\
    \ \\\n  --max-updates 4 --seed 20260730\ntest \"$$(sha256sum \"$$RECURRENT_EVAL\"\
    \ | cut -d' ' -f1)\" = a368cefb0c49cb6a305ad1a892808361fba2d44d555a0a28ea64e56babe32525\n\
    rm -rf \"$$LOCAL_MODEL\"; mkdir -p \"$$LOCAL_MODEL\"\npython scripts/copy_model_parallel.py\
    \ --source /mnt/amulet/studentmodeling/models/Qwen3-32B --destination \"$$LOCAL_MODEL\"\
    \ --workers 16\ntest -f \"$$LOCAL_MODEL/model.safetensors.index.json\"\nnvidia-smi\
    \ --query-gpu=index,name,memory.total --format=csv,noheader\npython -u scripts/evaluate_recurrent_formal_protocols.py\
    \ \\\n  --model \"$$LOCAL_MODEL\" --adapter \"$$CHECKPOINT/adapter\" \\\n  --recurrent-state\
    \ \"$$CHECKPOINT/recurrent_state.pt\" \\\n  --state-architecture layerwise --eval-jsonl\
    \ \"$$RECURRENT_EVAL\" \\\n  --output-dir \"$$AMLT_OUTPUT_DIR/eval/$$EVAL_GROUP\"\
    \ \\\n  --state-token-alias '<|vision_pad|>' --max-length 1536 --max-new-tokens\
    \ 128 \\\n  --state-batch-size 2 --candidate-row-batch-size 2 \\\n  --tasks $$TASKS\
    \ --seed 42 --save-unredacted-predictions\ncp /tmp/layerwise_final_formal_eval_u4_v1/audit.json\
    \ \"$$AMLT_OUTPUT_DIR/eval/$$EVAL_GROUP/manifest_audit.json\"\nprintf '%s\\n'\
    \ 'stage=layerwise_finalfit_checkpoint750_formal_full' 'state_architecture=layerwise'\
    \ \\\n  'raw_history_visible_to_decoder=false' 'persistent_history_kv_cache=false'\
    \ \\\n  > \"$$AMLT_OUTPUT_DIR/eval/$$EVAL_GROUP/scope.txt\"\n"
  submit_args:
    max_attempts: 2
    max_run_duration_seconds: 259200
    env:
      _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
      EVAL_GROUP: t2
      TASKS: predict_response
