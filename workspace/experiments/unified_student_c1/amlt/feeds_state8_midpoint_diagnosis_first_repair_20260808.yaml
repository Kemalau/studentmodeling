# Generated with `amlt template -t Feeds -y`, then specialized for a
# hash-bound diagnosis-first repair from the atomic State8 step-2000 checkpoint.
description: State8 midpoint diagnosis-first semantic and causal repair screen

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-midpoint-diagnosis-first-venv
    - /tmp/studentmodeling-state8-midpoint-diagnosis-first-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-midpoint-diagnosis-first-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/../state8_midpoint_diagnosis_first_bundle_20260808
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-midpoint-diagnosis-first-seed63
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
