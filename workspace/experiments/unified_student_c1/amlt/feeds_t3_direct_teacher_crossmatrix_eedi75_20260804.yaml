# Generated from `amlt template -t Feeds -f amlt/feeds_t3_direct_teacher_crossmatrix_eedi75_20260804.yaml -y`.
description: Direct-teacher Eedi-75 T3 cross-matrix for state/readout attribution

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-t3-teacher-crossmatrix-venv
    - /tmp/studentmodeling-t3-teacher-crossmatrix-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-t3-teacher-crossmatrix-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: current-teacher-full-decoder-eedi75-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &teacher_command |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      export PATH="/tmp/studentmodeling-t3-teacher-crossmatrix-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts/frozen_layerwise_finalfit:$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export RAW_EVAL=/mnt/amulet/studentmodeling/formal_evaluation_v1/test.jsonl
      export RECURRENT_EVAL=/tmp/recurrent_formal_evaluation_fixedu4_v2/test.jsonl
      mkdir -p "$$HF_HUB_CACHE" "$$(dirname "$$RECURRENT_EVAL")" "$$AMLT_OUTPUT_DIR/eval/t3"
      test -f "$$RAW_EVAL"
      test -f "$$CAPTURE_ADAPTER/adapter_model.safetensors"
      test -f "$$DECODE_ADAPTER/adapter_model.safetensors"
      test "$$(df --output=avail /tmp | tail -1)" -ge 83886080
      test "$$(sha256sum "$$RAW_EVAL" | cut -d' ' -f1)" = bff7726953ae048bedf6dacdbb7500a54cb8de305e406f2497ef1f11c04167f8
      test "$$(sha256sum "$$CAPTURE_ADAPTER/adapter_model.safetensors" | cut -d' ' -f1)" = "$$CAPTURE_SHA256"
      test "$$(sha256sum "$$DECODE_ADAPTER/adapter_model.safetensors" | cut -d' ' -f1)" = 31db2cbe6163e2a32ffe71688803d75b707b7624f79af4a6a1f4a6892138835a
      if [[ "$$RECURRENT_STATE" != none ]]; then
        test -f "$$RECURRENT_STATE"
        test "$$(sha256sum "$$RECURRENT_STATE" | cut -d' ' -f1)" = "$$RECURRENT_STATE_SHA256"
        RECURRENT_STATE_ARGS=(--recurrent-state "$$RECURRENT_STATE")
      else
        test "$$RECURRENT_STATE_SHA256" = none
        RECURRENT_STATE_ARGS=()
      fi
      test "$$(sha256sum scripts/evaluate_recurrent_formal_protocols.py | cut -d' ' -f1)" = 7bdb9b7b6e9f4c37db4c8551bba8eb9260a989e707fe535ff6922d03fe082cd2
      test "$$(sha256sum scripts/evaluate_direct_teacher_t3.py | cut -d' ' -f1)" = 42bb943076e0d8a6a392db447021662b32ecd3c1691c7994a32788d8c7b2bb33
      test "$$(sha256sum scripts/build_recurrent_evaluation_manifest.py | cut -d' ' -f1)" = d335b0b97471683eb1f317f21af6f0dd36ccca0fe6a8e495838112785ea85a8e
      test "$$(sha256sum scripts/frozen_layerwise_finalfit/layerwise_recurrent_student_model.py | cut -d' ' -f1)" = c80357282e600b31f68f55d8ab434ad349c0e9eeeeb222b52dbadae7caea11ca
      test "$$(sha256sum tests/frozen_layerwise_finalfit/test_layerwise_recurrent_student_model.py | cut -d' ' -f1)" = a995f82f364eb3247ff3e17873cc720bbce7a2a8f52813c9369421fa61d3c274
      python -m unittest discover -s tests -p 'test_evaluate_recurrent_formal_protocols.py' -v
      python -m unittest discover -s tests -p 'test_layerwise_recurrent_student_model.py' -v
      python scripts/build_recurrent_evaluation_manifest.py \
        --input-jsonl "$$RAW_EVAL" --output-jsonl "$$RECURRENT_EVAL" \
        --audit-json /tmp/recurrent_formal_evaluation_fixedu4_v2/audit.json \
        --max-updates 4 --seed 20260730
      test "$$(sha256sum "$$RECURRENT_EVAL" | cut -d' ' -f1)" = a368cefb0c49cb6a305ad1a892808361fba2d44d555a0a28ea64e56babe32525
      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
      python -u scripts/evaluate_direct_teacher_t3.py \
        --model "$$LOCAL_MODEL" --adapter "$$CAPTURE_ADAPTER" \
        "$${RECURRENT_STATE_ARGS[@]}" \
        --decode-adapter "$$DECODE_ADAPTER" --state-architecture layerwise \
        --eval-jsonl "$$RECURRENT_EVAL" --output-dir "$$AMLT_OUTPUT_DIR/eval/t3" \
        --state-token-alias '<|vision_pad|>' --max-length 1536 --max-new-tokens 128 \
        --state-batch-size 1 --candidate-row-batch-size 2 \
        --tasks diagnose_misconception --sources eedi_mining \
        --max-samples-per-group 75 --seed 42 --save-unredacted-predictions
      python - "$$AMLT_OUTPUT_DIR/eval/t3/metrics.json" "$$CAPTURE_ADAPTER" "$$DECODE_ADAPTER" "$$CONDITION" <<'PY'
      import json,sys
      payload=json.load(open(sys.argv[1],encoding='utf-8'))
      assert payload['adapter']==sys.argv[2] and payload['decode_adapter']==sys.argv[3],payload
      assert payload['state_source']=='direct_teacher',payload
      assert payload['state_architecture']=='layerwise' and payload['state_shape']==[64,5120],payload
      assert payload['diagnostic_only'] is True and payload['eligible_for_final_gate'] is False,payload
      assert payload['raw_history_visible_to_state_encoder'] is True,payload
      assert payload['raw_history_visible_to_decoder'] is False,payload
      assert payload['persistent_history_kv_cache'] is False,payload
      assert payload['sampled_rows']==75,payload
      groups=payload['metrics_by_group']; expected='diagnose_misconception/eedi_mining/open_taxonomy_generation'
      assert set(groups)=={expected} and groups[expected]['n']==75,groups
      payload['crossmatrix_condition']=sys.argv[4]
      open(sys.argv[1],'w',encoding='utf-8').write(json.dumps(payload,indent=2,sort_keys=True)+'\n')
      PY
      cp /tmp/recurrent_formal_evaluation_fixedu4_v2/audit.json "$$AMLT_OUTPUT_DIR/eval/t3/manifest_audit.json"
      printf '%s\n' \
        'stage=t3_direct_teacher_crossmatrix_eedi75' \
        "condition=$$CONDITION" \
        'diagnostic_only=true' \
        'eligible_for_final_gate=false' \
        'state_source=direct_teacher' \
        'raw_history_visible_to_state_encoder=true' \
        'raw_history_visible_to_decoder=false' \
        'optimizer_steps=0' \
        > "$$AMLT_OUTPUT_DIR/eval/t3/scope.txt"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        CONDITION: current_teacher_full_decoder
        CAPTURE_ADAPTER: /mnt/amulet/projects/v-yuejiali/amlt-results/7214304189.17136-ef894bfd-a1be/model
        CAPTURE_SHA256: 41c68adcf291c06cf4c1f776ff3b681e89421504aff437bd20b149393062c54e
        RECURRENT_STATE: /mnt/amulet/projects/v-yuejiali/amlt-results/7214304189.17136-ef894bfd-a1be/model/recurrent_state.pt
        RECURRENT_STATE_SHA256: 070c7e487cf721647278382c761d5eaa7861e2be72084d94db0a87f9a88220b7
        DECODE_ADAPTER: /mnt/amulet/studentmodeling/adapters/qwen3_32b_full_trainvalid_no_t4_strictt6_1ep/final_adapter

  - name: fulltask-teacher-full-decoder-eedi75-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: *teacher_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        CONDITION: fulltask_teacher_full_decoder
        CAPTURE_ADAPTER: /mnt/amulet/studentmodeling/adapters/qwen3_32b_full_trainvalid_no_t4_strictt6_1ep/final_adapter
        CAPTURE_SHA256: 31db2cbe6163e2a32ffe71688803d75b707b7624f79af4a6a1f4a6892138835a
        RECURRENT_STATE: none
        RECURRENT_STATE_SHA256: none
        DECODE_ADAPTER: /mnt/amulet/studentmodeling/adapters/qwen3_32b_full_trainvalid_no_t4_strictt6_1ep/final_adapter
