    \n  --jsonl \"$$BASE_DATA/test_same_template.jsonl\" \\\n  --pair-manifest manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json\
    \ \\\n  --output-json \"$$AMLT_OUTPUT_DIR/eval/c4/recurrent_causal_gate.json\"\
    \ \\\n  --state-token-alias '<|vision_pad|>' \\\n  --max-length 1536 \\\n  --num-pairs\
    \ 150 \\\n  --seed 42\nprintf '%s\\n' \"condition=$$CONDITION\" \"adapter=$$ADAPTER_DIR\"\
    \ \"state=$$STATE_PATH\" > \"$$AMLT_OUTPUT_DIR/eval/c4/transition_provenance.txt\"\
    \n"
  submit_args:
    max_attempts: 2
    max_run_duration_seconds: 172800
    env:
      _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
      CONDITION: m2_state_full_adapter
      ADAPTER_DIR_REMOTE: /mnt/amulet/studentmodeling/adapters/qwen3_32b_full_trainvalid_no_t4_strictt6_1ep/final_adapter
      STATE_PATH_REMOTE: /mnt/amulet/studentmodeling/checkpoints/recurrent_malrule_cf1_u4_trainable_seed42_v4_20260730/recurrent_state.pt
      SOURCE_COMPLETION_REMOTE: /mnt/amulet/studentmodeling/checkpoints/recurrent_malrule_cf1_u4_trainable_seed42_v4_20260730/completion.json
  mpi: false
  process_count_per_node: 1
