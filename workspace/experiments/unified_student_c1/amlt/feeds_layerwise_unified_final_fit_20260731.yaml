      test -f "$$SELECTED_RUN_DIR/final_adapter/adapter_model.safetensors"
      python - "$$SELECTED_RUN_DIR" <<'PY'
      import hashlib, json, pathlib, sys
      root = pathlib.Path(sys.argv[1])
      completion = json.load(open(root / 'completion.json', encoding='utf-8'))
      assert completion['status'] == 'diagnostic_complete', completion
      assert completion['micro_steps'] == 200, completion
      assert completion['causal_pairs_seen'] == 200, completion
      assert completion['optimizer_steps'] == 50, completion
      adapter = root / 'final_adapter' / 'adapter_model.safetensors'
      digest = hashlib.sha256()
      with adapter.open('rb') as handle:
          for chunk in iter(lambda: handle.read(1024 * 1024), b''):
              digest.update(chunk)
      assert digest.hexdigest() == completion['sha256']['adapter_model'], completion
      PY

