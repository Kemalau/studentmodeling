      value = json.load(open(sys.argv[1], encoding='utf-8'))
      assert value['stage'] == 'layerwise_trajectory_curriculum_selection', value
      assert value['scientific_gate_pass'] is True, value
      rows = {x['branch']: x for x in value['candidates']}
      row = rows[value['selected_branch']]
      assert row['pass'] is True, row
      policy = row['final_fit_policy']
      print(policy['learning_rate'])
      print(policy['causal_weight'])
      print(policy['causal_objective_mode'])
      print(row['branch'])
      print(row['receipt']['transition_rank'])
