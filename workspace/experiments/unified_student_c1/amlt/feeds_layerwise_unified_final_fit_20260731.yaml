          --layerwise-operation-checkpointing \
          --layerwise-transition-rank "$$SELECTED_TRANSITION_RANK" \
          --train-jsonl "$$FINAL_JSONL" --valid-jsonl "$$RECURRENT_SPLIT/valid.jsonl" \
          --causal-train-jsonl "$$CAUSAL_DATA/train.jsonl" \
          --causal-valid-jsonl "$$CAUSAL_DATA/valid.jsonl" \
          --teacher-cache "$$CACHE_ROOT" --behavior-kd-weight 0.5 --behavior-kd-temperature 1.0 \
          --output-dir "$$RUN_DIR" --state-token-alias '<|vision_pad|>' \
          --max-length 1536 --learning-rate "$$SELECTED_LR" \
          --lr-scheduler cosine --warmup-ratio 0.03 \
          --generation-weight 1.0 --consistency-weight 0.25 --direct-replay-weight 0.25 \
          --causal-weight "$$SELECTED_CAUSAL_WEIGHT" --causal-margin 0.5 \
          --causal-preference-reduction sum --causal-objective-mode "$$SELECTED_OBJECTIVE" \
          --causal-repeat-fraction 0.05 --normalize-causal-exposure \
          --gradient-accumulation-steps 1 --eval-limit 300 --causal-eval-limit 165 \
          --save-steps 250 --checkpoint-retention 2 \
          --distributed-mpi --distributed-world-size 16 --seed 42 \
          "$${resume_args[@]}"
      fi
