      import json, pathlib, sys
      root = pathlib.Path(sys.argv[1])
      completion = json.load(open(root / 'completion.json', encoding='utf-8'))
      config = json.load(open(root / 'run_config.json', encoding='utf-8'))
      assert completion['status'] == 'complete' and completion['diagnostic'] is False, completion
      assert completion['micro_steps'] == 259845, completion
      assert completion['real_examples_seen'] == 259845, completion
      assert completion['real_examples_seen_once'] is True, completion
      assert completion['causal_exposure_count_matches_plan'] is True, completion
      assert completion['all_causal_pairs_covered'] is True, completion
      assert config['state_architecture'] == 'layerwise', config
      assert config['layerwise_operation_checkpointing'] is True, config
      assert config['layerwise_transition_rank'] > 0, config
      assert config['init_run_dir'] == sys.argv[3], config
      assert config['causal_branch_dropout_mode'] == 'eval_deterministic', config
      assert config['distributed_world_size'] == 16, config
      assert config['planned_optimizer_steps'] == 16241, config
      assert config['real_train_rows'] == 259845, config
      receipt = {
          'status': 'final_fit_complete', 'stage': 'layerwise_unified_final_fit',
          'selected_branch': sys.argv[2], 'run_dir': str(root),
          'state_architecture': 'layerwise', 'state_shape': [64, 5120],
          'real_examples': 259845, 'one_epoch_exact': True,
          'optimizer_steps': completion['optimizer_steps'],
          'raw_history_visible_to_decoder': False,
          'persistent_history_kv_cache': False,
      }
      open(root / 'final_fit_receipt.json', 'w', encoding='utf-8').write(
          json.dumps(receipt, indent=2, sort_keys=True) + '\n'
      )
      print(json.dumps(receipt, indent=2, sort_keys=True))
      PY
      cp -r "$$RUN_DIR/final_adapter/." "$$AMLT_OUTPUT_DIR/model/"
      cp "$$RUN_DIR/recurrent_state.pt" "$$AMLT_OUTPUT_DIR/model/recurrent_state.pt"
      cp "$$RUN_DIR/completion.json" "$$AMLT_OUTPUT_DIR/metrics/completion.json"
      cp "$$RUN_DIR/final_fit_receipt.json" "$$AMLT_OUTPUT_DIR/metrics/final_fit_receipt.json"
