# Generated from `amlt template -t Feeds -n 4 -y`.
# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
description: Formal T1 T2 T3 T5 T6 and frozen C4 evaluation of the final layerwise recurrent unified model

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-layerwise-final-eval-venv
    - /tmp/studentmodeling-layerwise-final-eval-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-layerwise-final-eval-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: layerwise-final-eval-t1-t6-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &formal_command |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-layerwise-final-eval-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export RAW_EVAL=/mnt/amulet/studentmodeling/formal_evaluation_v1/test.jsonl
      export RECURRENT_EVAL=/tmp/layerwise_final_formal_eval_u4_v1/test.jsonl
      export RECEIPT=/mnt/amulet/studentmodeling/layerwise_world_model_v1/final_fit/seed42.json
      mkdir -p "$$HF_HUB_CACHE" "$$(dirname "$$RECURRENT_EVAL")" "$$AMLT_OUTPUT_DIR/eval/$$EVAL_GROUP"
      test -f "$$RAW_EVAL"; test -f "$$RECEIPT"
      export RUN_DIR="$$(python - "$$RECEIPT" <<'PY'
      import json,sys
      x=json.load(open(sys.argv[1],encoding='utf-8'))
      assert x['status']=='final_fit_complete' and x['stage']=='layerwise_unified_final_fit',x
      assert x['state_architecture']=='layerwise' and x['state_shape']==[64,5120],x
      assert x['real_examples']==259845 and x['one_epoch_exact'] is True,x
      print(x['run_dir'])
      PY
      )"
      test -f "$$RUN_DIR/final_adapter/adapter_model.safetensors"
      test -f "$$RUN_DIR/recurrent_state.pt"
      test "$$(df --output=avail /tmp | tail -1)" -ge 83886080
      test "$$(sha256sum "$$RAW_EVAL" | cut -d' ' -f1)" = bff7726953ae048bedf6dacdbb7500a54cb8de305e406f2497ef1f11c04167f8
      test "$$(sha256sum scripts/evaluate_recurrent_formal_protocols.py | cut -d' ' -f1)" = 7bdb9b7b6e9f4c37db4c8551bba8eb9260a989e707fe535ff6922d03fe082cd2
      test "$$(sha256sum scripts/frozen_layerwise_finalfit/layerwise_recurrent_student_model.py | cut -d' ' -f1)" = c80357282e600b31f68f55d8ab434ad349c0e9eeeeb222b52dbadae7caea11ca
      test "$$(sha256sum tests/frozen_layerwise_finalfit/test_layerwise_recurrent_student_model.py | cut -d' ' -f1)" = a995f82f364eb3247ff3e17873cc720bbce7a2a8f52813c9369421fa61d3c274
      cp scripts/frozen_layerwise_finalfit/layerwise_recurrent_student_model.py scripts/layerwise_recurrent_student_model.py
      cp tests/frozen_layerwise_finalfit/test_layerwise_recurrent_student_model.py tests/test_layerwise_recurrent_student_model.py
      test "$$(sha256sum scripts/layerwise_recurrent_student_model.py | cut -d' ' -f1)" = c80357282e600b31f68f55d8ab434ad349c0e9eeeeb222b52dbadae7caea11ca
      test "$$(sha256sum scripts/build_recurrent_evaluation_manifest.py | cut -d' ' -f1)" = d335b0b97471683eb1f317f21af6f0dd36ccca0fe6a8e495838112785ea85a8e
      python -m unittest discover -s tests -p 'test_evaluate_recurrent_formal_protocols.py' -v
      python -m unittest discover -s tests -p 'test_layerwise_recurrent_student_model.py' -v
      python scripts/build_recurrent_evaluation_manifest.py \
        --input-jsonl "$$RAW_EVAL" --output-jsonl "$$RECURRENT_EVAL" \
        --audit-json /tmp/layerwise_final_formal_eval_u4_v1/audit.json \
        --max-updates 4 --seed 20260730
      test "$$(sha256sum "$$RECURRENT_EVAL" | cut -d' ' -f1)" = a368cefb0c49cb6a305ad1a892808361fba2d44d555a0a28ea64e56babe32525
      rm -rf "$$LOCAL_MODEL"; mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py --source /mnt/amulet/studentmodeling/models/Qwen3-32B --destination "$$LOCAL_MODEL" --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
      python -u scripts/evaluate_recurrent_formal_protocols.py \
        --model "$$LOCAL_MODEL" --adapter "$$RUN_DIR/final_adapter" \
        --recurrent-state "$$RUN_DIR/recurrent_state.pt" \
        --state-architecture layerwise --eval-jsonl "$$RECURRENT_EVAL" \
        --output-dir "$$AMLT_OUTPUT_DIR/eval/$$EVAL_GROUP" \
        --state-token-alias '<|vision_pad|>' --max-length 1536 --max-new-tokens 128 \
        --state-batch-size 2 --candidate-row-batch-size 2 \
        --tasks $$TASKS --seed 42 --save-unredacted-predictions
      cp /tmp/layerwise_final_formal_eval_u4_v1/audit.json "$$AMLT_OUTPUT_DIR/eval/$$EVAL_GROUP/manifest_audit.json"
      printf '%s\n' 'stage=layerwise_unified_final_eval' 'state_architecture=layerwise' \
        'raw_history_visible_to_decoder=false' 'persistent_history_kv_cache=false' \
        > "$$AMLT_OUTPUT_DIR/eval/$$EVAL_GROUP/scope.txt"
    submit_args: &formal_submit
      max_attempts: 2
      max_run_duration_seconds: 259200
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        EVAL_GROUP: t1_t6
        TASKS: predict_correctness predict_error_persistence

  - name: layerwise-final-eval-t2-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: *formal_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 259200
      env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, EVAL_GROUP: t2, TASKS: predict_response}

  - name: layerwise-final-eval-t3-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: *formal_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 259200
      env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, EVAL_GROUP: t3, TASKS: diagnose_misconception}

  - name: layerwise-final-eval-t5-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: *formal_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 259200
      env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, EVAL_GROUP: t5, TASKS: predict_prospective_error}

  - name: layerwise-final-eval-c4-seed13
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &c4_command |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-layerwise-final-eval-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export RECEIPT=/mnt/amulet/studentmodeling/layerwise_world_model_v1/final_fit/seed42.json
      export C4_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean
      : "$${C4_PAIR_SEED:?C4_PAIR_SEED is required}"
      export C4_GROUP="c4_seed$${C4_PAIR_SEED}"
      export PAIR_MANIFEST="manifests/c4_stage_a_gate_pairs_seed$${C4_PAIR_SEED}_n150_v1.json"
      mkdir -p "$$HF_HUB_CACHE" "$$AMLT_OUTPUT_DIR/eval/$$C4_GROUP"
      export RUN_DIR="$$(python - "$$RECEIPT" <<'PY'
      import json,sys
      x=json.load(open(sys.argv[1],encoding='utf-8'))
      assert x['status']=='final_fit_complete' and x['state_architecture']=='layerwise',x
      assert x['real_examples']==259845 and x['one_epoch_exact'] is True,x
      print(x['run_dir'])
      PY
      )"
      test -f "$$RUN_DIR/final_adapter/adapter_model.safetensors"; test -f "$$RUN_DIR/recurrent_state.pt"
      test "$$(df --output=avail /tmp | tail -1)" -ge 83886080
      test "$$(sha256sum scripts/evaluate_recurrent_causal_gate.py | cut -d' ' -f1)" = fd6510465abafbd897ac4acbf27dd0da14b179637ba9a632f4c5cb539214c5ad
      test "$$(sha256sum scripts/frozen_layerwise_finalfit/layerwise_recurrent_student_model.py | cut -d' ' -f1)" = c80357282e600b31f68f55d8ab434ad349c0e9eeeeb222b52dbadae7caea11ca
      test "$$(sha256sum tests/frozen_layerwise_finalfit/test_layerwise_recurrent_student_model.py | cut -d' ' -f1)" = a995f82f364eb3247ff3e17873cc720bbce7a2a8f52813c9369421fa61d3c274
      cp scripts/frozen_layerwise_finalfit/layerwise_recurrent_student_model.py scripts/layerwise_recurrent_student_model.py
      cp tests/frozen_layerwise_finalfit/test_layerwise_recurrent_student_model.py tests/test_layerwise_recurrent_student_model.py
      test "$$(sha256sum scripts/layerwise_recurrent_student_model.py | cut -d' ' -f1)" = c80357282e600b31f68f55d8ab434ad349c0e9eeeeb222b52dbadae7caea11ca
      case "$$C4_PAIR_SEED" in
        13) expected_pair_sha=9856e643848d11a834761e3d28fb078f6eb70fa6c42fc468c3eb1b3a1aafd693 ;;
        42) expected_pair_sha=edcdb934a65252557f6c569eea9ef7a85e5445549deac9fb4829c3f579e1a9b8 ;;
        97) expected_pair_sha=15ed710992abd71c37bdfa2246a5a38b5eb422e70ecbfb6da933be013d6d9118 ;;
        *) exit 2 ;;
      esac
      test "$$(sha256sum "$$PAIR_MANIFEST" | cut -d' ' -f1)" = "$$expected_pair_sha"
      python -m unittest discover -s tests -p 'test_evaluate_recurrent_causal_gate.py' -v
      export C4_PROGRESS_DIR="$$RUN_DIR/c4_eval_progress_seed$${C4_PAIR_SEED}_v1"
      export C4_PROGRESS_KEY="$$(python - "$$RUN_DIR/completion.json" <<'PY'
      import json,sys
      x=json.load(open(sys.argv[1],encoding='utf-8'))
      print(f"adapter={x['sha256']['adapter_model']}:state={x['sha256']['recurrent_state']}")
      PY
      )"
      mkdir -p "$$C4_PROGRESS_DIR"
      rm -rf "$$LOCAL_MODEL"; mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py --source /mnt/amulet/studentmodeling/models/Qwen3-32B --destination "$$LOCAL_MODEL" --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      python -u scripts/evaluate_recurrent_causal_gate.py \
        --model "$$LOCAL_MODEL" --adapter "$$RUN_DIR/final_adapter" \
        --recurrent-state "$$RUN_DIR/recurrent_state.pt" --state-architecture layerwise \
        --jsonl "$$C4_DATA/test_same_template.jsonl" \
        --pair-manifest "$$PAIR_MANIFEST" \
        --output-json "$$AMLT_OUTPUT_DIR/eval/$$C4_GROUP/recurrent_causal_gate.json" \
        --state-token-alias '<|vision_pad|>' --max-length 1536 --num-pairs 150 --seed "$$C4_PAIR_SEED" \
        --progress-dir "$$C4_PROGRESS_DIR" --progress-key "$$C4_PROGRESS_KEY"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 259200
      env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, C4_PAIR_SEED: '13'}

  - name: layerwise-final-eval-c4-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
