# Generated with `amlt template -t Feeds -y`, then specialized for a frozen
# checkpoint-200 diagnosis-first Teacher screen.
description: Diagnostic 75-row semantic screen of diagnosis-first Teacher checkpoint 200

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-df-teacher-cp200-screen-venv
    - /tmp/studentmodeling-df-teacher-cp200-screen-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-df-teacher-cp200-screen-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-diagnosis-first-teacher-checkpoint200-screen
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      export PATH="/tmp/studentmodeling-df-teacher-cp200-screen-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export TEACHER_RUN=/mnt/amulet/studentmodeling/checkpoints/state8_diagnosis_first_full_history_teacher_seed66_v1_20260810
      export ADAPTER="$$TEACHER_RUN/checkpoint-200"
      export RAW_EVAL=/mnt/amulet/studentmodeling/formal_evaluation_v1/test.jsonl
      export RECURRENT_EVAL=/tmp/state8_df_teacher_cp200_recurrent/test.jsonl
      export EVAL=/tmp/state8_df_teacher_cp200_view.jsonl
      export EXACT_EVAL=/tmp/state8_df_teacher_cp200_exact.jsonl
      export OUT="$$AMLT_OUTPUT_DIR/eval/t3"
      mkdir -p "$$HF_HUB_CACHE" "$$OUT"
      test -f "$$ADAPTER/adapter_model.safetensors"
      test -f "$$ADAPTER/adapter_config.json"
      test -f "$$ADAPTER/trainer_state.json"
      test -f "$$ADAPTER/optimizer.pt"
      test -f "$$ADAPTER/scheduler.pt"
      test -f "$$RAW_EVAL"
      test "$$(sha256sum "$$RAW_EVAL" | cut -d' ' -f1)" = bff7726953ae048bedf6dacdbb7500a54cb8de305e406f2497ef1f11c04167f8
      test "$$(sha256sum scripts/evaluate_formal_protocols.py | cut -d' ' -f1)" = b347ed4d2228725a325975c0ffab162ca32a2e0252583de841c00b3ab1e196de
      test "$$(sha256sum scripts/add_state8_teacher_markers.py | cut -d' ' -f1)" = 15b418c5a34058658c25ec1083da04801cc906cd577541cfb59f01e2bc343f51
      python - "$$ADAPTER/trainer_state.json" <<'PY'
      import json,sys
      x=json.load(open(sys.argv[1])); assert x['global_step']==200,x
      PY
      export ADAPTER_SHA256="$$(sha256sum "$$ADAPTER/adapter_model.safetensors" | cut -d' ' -f1)"
      test "$${#ADAPTER_SHA256}" = 64
      mkdir -p "$$(dirname "$$RECURRENT_EVAL")"
      python scripts/build_recurrent_evaluation_manifest.py \
        --input-jsonl "$$RAW_EVAL" --output-jsonl "$$RECURRENT_EVAL" \
        --audit-json /tmp/state8_df_teacher_cp200_recurrent/audit.json \
        --max-updates 4 --seed 20260730
      test "$$(sha256sum "$$RECURRENT_EVAL" | cut -d' ' -f1)" = a368cefb0c49cb6a305ad1a892808361fba2d44d555a0a28ea64e56babe32525
      python - "$$RECURRENT_EVAL" "$$EVAL" <<'PY'
      import json,sys
      from pathlib import Path
      from build_state8_diagnosis_first_teacher_views import write_view
      receipt=write_view(Path(sys.argv[1]),Path(sys.argv[2]))
      assert receipt['rows']==1494 and receipt['source_counts']=={'eedi_mining':894,'malrule':600},receipt
      PY
      rm -rf "$$LOCAL_MODEL"; mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" --workers 16
      python scripts/add_state8_teacher_markers.py \
        --input-jsonl "$$EVAL" --output-jsonl "$$EXACT_EVAL"
      nvidia-smi --query-gpu=index,name,memory.total,memory.used --format=csv,noheader
      python -u scripts/evaluate_formal_protocols.py \
        --model "$$LOCAL_MODEL" --adapter "$$ADAPTER" \
        --eval-jsonl "$$EXACT_EVAL" --output-dir "$$OUT" \
        --max-length 1536 --max-new-tokens 256 --generation-batch-size 1 \
        --tasks diagnose_misconception --sources eedi_mining malrule \
        --max-samples-per-group 25 --seed 66 --save-unredacted-predictions
      python - "$$OUT/metrics.json" <<'PY'
      import json,os,sys
      x=json.load(open(sys.argv[1])); assert x['sampled_rows']==75 and x['generation_rows']==75,x
      assert x['artifact_sha256']['adapter_model']==os.environ['ADAPTER_SHA256'],x
      PY
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 43200
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
