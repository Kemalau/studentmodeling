# Generated with `amlt template -t Feeds -d`, then filled from the validated
# equal-T3/T6 state-KD diagnostic.  The single scientific change is a train-only
# open Malrule-T3 prompt; KD remains enabled for every compatible non-rewritten
# task row and direct replay remains disabled.
# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
description: Equal-T3/T6 closed-state selective-KD diagnostic with train-only open Malrule T3

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-layerwise-equal-open-statekd-venv
    - /tmp/studentmodeling-layerwise-equal-open-statekd-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-layerwise-equal-open-statekd-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: layerwise-equal-t3-t6-open-t3-state-kd-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: |
      set -euo pipefail
      bash scripts/run_layerwise_task_retention_rehearsal.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-layerwise-equal-open-statekd-venv
        BRANCH: equal_t3_t6_open_t3
        LOSS_PROFILE: state_kd
        TRAIN_ENTRYPOINT: scripts/train_recurrent_student_m4_open_t3_selective_kd.py
        MANIFEST: manifests/layerwise_task_retention_equal_t3_t6_seed42_v1.json
        MANIFEST_SHA256: 32adfcc7bd1d78f541ec8685ec8f96f9934b35471011bb896c402b1e77a7bf6f
