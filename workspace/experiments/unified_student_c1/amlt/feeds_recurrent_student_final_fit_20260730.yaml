      export CACHE_V2_ROOT=/mnt/amulet/studentmodeling/world_model_v1/final_fit/cache_full259845_top256_seed42_v2_16way
      if [[ -f "$$CACHE_V2_ROOT/integrity.json" ]]; then
        export CACHE_ROOT="$$CACHE_V2_ROOT"
      fi
      export PILOT_RECEIPT=/mnt/amulet/studentmodeling/world_model_v1/m4/selected_seed42.json
