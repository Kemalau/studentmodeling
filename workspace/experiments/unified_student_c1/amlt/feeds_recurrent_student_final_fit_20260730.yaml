          'cf4_bootstrap_symmetric_w1': (1.0, False, 1.0),
          'cf4_donor_directional_w1': (1.0, False, 1.0),
      }
      assert branch in policies, value
      expected_weight, expected_normalize, expected_repeat = policies[branch]
      weight = float(value.get('causal_weight', expected_weight))
      normalize = bool(value.get('normalize_causal_exposure', expected_normalize))
      repeat = float(value.get('causal_repeat_fraction', expected_repeat))
      assert (weight, normalize, repeat) == (
          expected_weight, expected_normalize, expected_repeat
      ), value
      if branch is not None:
          assert float(value.get('C4_D_specific', -1.0)) >= 0.15, value
      final_weight = float(value.get('final_fit_causal_weight', weight))
      final_normalize = bool(value.get('final_fit_normalize_causal_exposure', normalize))
      final_repeat = float(value.get('final_fit_causal_repeat_fraction', 0.05))
      final_preference_reduction = value.get(
          'final_fit_causal_preference_reduction',
          value.get('causal_preference_reduction', 'mean'),
      )
      final_objective_mode = value.get(
          'final_fit_causal_objective_mode',
          value.get('causal_objective_mode', 'symmetric'),
      )
      assert 0 < final_repeat <= 1.0, value
      assert final_preference_reduction in {'mean', 'sum'}, value
      assert final_objective_mode in {'symmetric', 'directional', 'donor_directional'}, value
      print(value['run_dir'])
      print(final_weight)
      print(1 if final_normalize else 0)
      print(final_repeat)
      print(final_preference_reduction)
      print(final_objective_mode)
      print(value.get('causal_data_mode', 'cf1_single_query'))
      PY
      )
      export PILOT_DIR="$${selected[0]}"
