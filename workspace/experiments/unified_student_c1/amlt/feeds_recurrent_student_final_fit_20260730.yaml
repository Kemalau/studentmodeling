      test "$$(sha256sum scripts/teacher_cache.py | cut -d' ' -f1)" = 04f057df2ccdc174e3094bab1c79d9bdbee4c9c67657615f1e49c3e68903cc4b
      test "$$(sha256sum scripts/merge_teacher_cache_partitions.py | cut -d' ' -f1)" = 8bd00421608fe2c31df67ce624d2452183461877f9aa07a1e85d8552bd72c468
      test "$$(sha256sum scripts/build_recurrent_causal_pairs.py | cut -d' ' -f1)" = 2daed709603a63a487705bce87539b58c7e01d239397758305d3b023f5eb26b7
      python -m unittest discover -s tests -p 'test_recurrent_student_model.py' -v
      python -m unittest discover -s tests -p 'test_train_recurrent_student_m4.py' -v
      python -m unittest discover -s tests -p 'test_distributed_epoch.py' -v
      python -m unittest discover -s tests -p 'test_teacher_cache.py' -v

      readarray -t selected < <(python - "$$PILOT_RECEIPT" "$$ARM" "$$PROJECTION_MODE" <<'PY'
      import json, sys
      value = json.load(open(sys.argv[1], encoding='utf-8'))
      assert value.get('status') == 'candidate_complete', value
      assert value.get('mask_protocol') == 'answer_anchor_visible_v2', value
      assert value.get('arm') == sys.argv[2] and value.get('projection_mode') == sys.argv[3], value
      branch = value.get('causal_rescue_branch')
      policies = {
          None: (1.0, False, 0.0),
          'raw4': (4.0, False, 0.0),
          'mean_normalized': (1.0, True, 0.0),
          'raw8': (8.0, False, 0.0),
          'mean2_normalized': (2.0, True, 0.0),
          'repeat100_w1': (1.0, False, 1.0),
          'repeat100_w4': (4.0, False, 1.0),
          'repeat100_sum_w1': (1.0, False, 1.0),
          'repeat100_sum_w4': (4.0, False, 1.0),
          'bootstrap_sum_w1': (1.0, False, 1.0),
          'bootstrap_sum_w4': (4.0, False, 1.0),
          'bootstrap_native25_sum_w1': (1.0, False, 1.0),
