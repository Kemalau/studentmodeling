      test -f "$$BASE_DATA/train.jsonl"
      test -f "$$BASE_DATA/val.jsonl"
      test "$$(sha256sum "$$RAW_FULL" | cut -d' ' -f1)" = aeabd3b4dfef3c4d92ac68583879c91448ef90f58304cedf32e470b586ca4542
      test "$$(sha256sum scripts/train_recurrent_student_m4.py | cut -d' ' -f1)" = 865c12219deb23cf9db145c797244969721fce80323050dcd987b33d96cbfb1b
      test "$$(sha256sum scripts/distributed_epoch.py | cut -d' ' -f1)" = 4b825fa7e7f03de5ceb60e3a812eafab79ba47b07bc9ca8c11274c45f24cd178
