# Generated from the existing approved Feeds Singularity project template.
description: Strict State8 readable student-profile continuation and fixed-query transport evaluation

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-profile-readout-venv
    - /tmp/studentmodeling-state8-profile-readout-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-profile-readout-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-student-profile-readout-seed8601
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_student_profile_readout.sh | cut -d' ' -f1)" = 67fce994d24f43037321f50d5a6d1122803c6b0591546d16193b315d938ffaca
      bash scripts/run_state8_student_profile_readout.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-profile-readout-venv
