# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
# ^ Update with: amlt schema add <file>  |  VS Code: Run Task > amlt
# Amulet config file. Docs: https://amulet-docs.azurewebsites.net/config_file.html
# Fill in all <placeholder> values before submitting.
description: Conditional hash-bound scientific rescue for the exact diagnosis-first State8 unified model

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

# REQUIRED: Docker environment
# Manifold jobs authenticate to Azure (storage, ACR) via a User-Assigned
# Managed Identity, auto-detected from the workspace in most cases. Only set
# _AZUREML_SINGULARITY_JOB_UAI in 'env' below if auto-detection is ambiguous
# (multiple non-primary identities); run 'amlt run' to see the available list.
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-exact-rescue-venv
    - /tmp/studentmodeling-state8-exact-rescue-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-exact-rescue-venv/bin/python -m pip install -r requirements-feeds.txt

# REQUIRED: code to run. Set local_dir to your code directory — it must
# exist and be non-empty. $CONFIG_DIR = directory of this file; the default
# $CONFIG_DIR/src means: put your code in a 'src' folder next to this file.
code:
  local_dir: $CONFIG_DIR/../state8_exact_scientific_rescue_bundle_20260808
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

# REQUIRED: Jobs to run. SKU examples: C1 (1 CPU), G1 (1 GPU), G4 (4 GPUs), G8-V100 (8 V100s)
# Commands run from the uploaded code directory (code.local_dir).
# 'command' is a shell script block (|): one line per step, e.g. python train.py --lr 0.01
# Write outputs to $AMLT_OUTPUT_DIR for retrieval with 'amlt results'.
# Use $$VAR to pass env vars literally ($VAR is interpolated at submission time).
jobs:
  - name: state8-exact-rescue-semantic-preserve-seed66
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &rescue_command |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      bash scripts/run_state8_exact_scientific_rescue.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env: &common_env
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-exact-rescue-venv
        EXACT_SOURCE_ROOT: /mnt/amulet/studentmodeling/diagnostics/state8_stateonly_repair_seed65_trajectory01_exact_teacher_curriculum_c4_seed65_v1
        EXACT_CURRICULUM_ROOT: /mnt/amulet/studentmodeling/diagnostics/state8_qualified_teacher_curriculum_highkd_v1_immutable_taxonomy_semantic_v1_exact_diagnosis_first_seed64_single_ga4
        EXPECTED_STUDENT_ADAPTER_SHA256: REQUIRED_AT_CONDITIONAL_MATERIALIZATION
        EXPECTED_STUDENT_STATE_SHA256: REQUIRED_AT_CONDITIONAL_MATERIALIZATION
        STATE8_COMPOSED_ENTRYPOINT_SHA256: eb9837127af9fe3761f6fa57b78a3e9ba3373a223706f0a4921749eab61e35a3
        STATE8_RETENTION_ENTRYPOINT_SHA256: c8e4e2bebf7ebf01b15685b74a5bdcbaa0afcb5a16c774b40ba0d7070819095a
        STATE8_DIAGNOSIS_FIRST_ENTRYPOINT_SHA256: 7d638013f932f29f52cffeea709b96872df8ba0960b9bb4e56ed23cc3475b216
        STATE8_DIAGNOSIS_FIRST_FORMAL_SHA256: a8bc07a8fe6d2c9bfa9af6d976b53b84321cb4baa9c9fcace3188e370f7732c9
        STATE8_DIAGNOSIS_FIRST_C4_SHA256: 7eef90e079d698c94f1f8655a1df3fe6bd93cedbb175ba4e7082a49bb8069c8b
        STATE8_RESCUE_MODE: semantic_preserve
        TRAIN_SEED: '66'
        RUN_TAG: exact_scientific_rescue_semantic_preserve_seed66_v1
        STATE8_CAUSAL_REPEAT_FRACTION: '0.50'
        STATE8_CAUSAL_WEIGHT: '2.0'
        STATE8_CAUSAL_MARGIN: '0.5'
        STATE8_GEOMETRY_WEIGHT: '0.10'
        STATE8_EEDI_GEOMETRY_WEIGHT: '0.05'
        STATE8_DIFFERENT_MAX_COSINE: '0.90'

  - name: state8-exact-rescue-causal-taskanchor-seed67
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: *rescue_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        <<: *common_env
        STATE8_RESCUE_MODE: causal_taskanchor
        TRAIN_SEED: '67'
        RUN_TAG: exact_scientific_rescue_causal_taskanchor_seed67_v1
        STATE8_CAUSAL_REPEAT_FRACTION: '1.0'
        STATE8_CAUSAL_WEIGHT: '4.0'
        STATE8_CAUSAL_MARGIN: '0.75'
        STATE8_GEOMETRY_WEIGHT: '0.20'
        STATE8_EEDI_GEOMETRY_WEIGHT: '0.10'

  - name: state8-exact-rescue-retention-preserve-seed68
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: *rescue_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        <<: *common_env
        STATE8_RESCUE_MODE: retention_preserve
        TRAIN_SEED: '68'
        RUN_TAG: exact_scientific_rescue_retention_preserve_seed68_v1
        STATE8_CAUSAL_REPEAT_FRACTION: '0.50'
        STATE8_CAUSAL_WEIGHT: '2.0'
        STATE8_CAUSAL_MARGIN: '0.5'
        STATE8_GEOMETRY_WEIGHT: '0.10'
        STATE8_EEDI_GEOMETRY_WEIGHT: '0.05'
        STATE8_DIFFERENT_MAX_COSINE: '0.90'
        STATE8_T6_ANCHOR_SCHEDULE: '0.5,0.75,1.0'
