# Generated from `amlt template -t Feeds -f amlt/feeds_t3_eedi_taskonly_qwen_formal_20260813.yaml -y`.
description: Formal open-generation evaluation of the Eedi-only T3 Qwen3-32B specialist

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-t3-specialist-eval-venv
    - /tmp/studentmodeling-t3-specialist-eval-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-t3-specialist-eval-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: /home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: qwen3-32b-t3-eedi-taskonly-formal-open-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-t3-specialist-eval-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export ADAPTER=/mnt/amulet/studentmodeling/adapters/qwen3_32b_eedi_t3_qlora_1epoch_len1536/final_adapter
      export EVAL_DATA=/mnt/amulet/studentmodeling/formal_evaluation_v1/test.jsonl
      test "$$(sha256sum scripts/evaluate_formal_protocols.py | cut -d' ' -f1)" = b347ed4d2228725a325975c0ffab162ca32a2e0252583de841c00b3ab1e196de
      test "$$(sha256sum scripts/copy_model_parallel.py | cut -d' ' -f1)" = 62b37ab70bc2ffc81c8314ca69215da7facdf18dba3f023d83096d1c3526ea4c
      test "$$(sha256sum requirements-feeds.txt | cut -d' ' -f1)" = fcbe7c063774982c0f0c87a6be96c203352e00ff4ac653d949a8eb97347a3fb1
      mkdir -p "$$HF_HUB_CACHE" "$$AMLT_OUTPUT_DIR/eval/t3_eedi_taskonly"
      test "$$(df --output=avail /tmp | tail -1)" -ge 125829120
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" --workers 16
      test -f "$$LOCAL_MODEL/config.json"
      test -f "$$ADAPTER/adapter_model.safetensors"
      test -f "$$EVAL_DATA"
      test "$$(sha256sum "$$ADAPTER/adapter_model.safetensors" | cut -d' ' -f1)" = 329e95ad02a10cd9541f81ce3f220aaa521369f5761659a146fc2c54ad859bb2
      python -u scripts/evaluate_formal_protocols.py \
        --model "$$LOCAL_MODEL" --adapter "$$ADAPTER" \
        --eval-jsonl "$$EVAL_DATA" \
        --output-dir "$$AMLT_OUTPUT_DIR/eval/t3_eedi_taskonly" \
        --tasks diagnose_misconception --sources eedi_mining \
        --max-length 1536 --max-new-tokens 160 --generation-batch-size 2 \
        --state-token-alias '<|vision_pad|>' --seed 42 \
        --save-unredacted-predictions --t3-llm-judge \
        --judge-model gpt-5.5 --judge-workers 12 --judge-audit-samples 100
      python - <<'PY'
      import json, pathlib
      root=pathlib.Path(__import__('os').environ['AMLT_OUTPUT_DIR'])/'eval/t3_eedi_taskonly'
      metrics=json.load(open(root/'metrics.json'))
      group=metrics['metrics_by_group']['diagnose_misconception/eedi_mining/open_taxonomy_generation']
      assert group['n']==894,group
      assert metrics['generation_rows']==894,metrics
      assert metrics['adapter'].endswith('qwen3_32b_eedi_t3_qlora_1epoch_len1536/final_adapter'),metrics
      print(json.dumps({'status':'complete','scope':'T3-Eedi-only','n':894,'metrics':group},sort_keys=True))
      PY
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
