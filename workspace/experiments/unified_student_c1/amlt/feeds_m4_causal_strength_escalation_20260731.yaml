description: Second-stage controlled M4 causal-strength search from atomic round 250
  to 500 after the lower-dose branches miss the frozen C4 gate
target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
  - python -m venv --system-site-packages /tmp/studentmodeling-m4-causal-strength-venv
  - /tmp/studentmodeling-m4-causal-strength-venv/bin/python -m pip install --upgrade
    pip
  - /tmp/studentmodeling-m4-causal-strength-venv/bin/python -m pip install -r requirements-feeds.txt
code:
  local_dir: $CONFIG_DIR/..
  ignore:
  - .git/
  - .vscode/
  - amlt/
  - data/
  - results/
  - __pycache__/
  - '*.pyc'
storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true
jobs:
- name: m4-causal-raw8-round250-to500-seed42
  sku: 80G4-A100
  process_count_per_node: -1
  mpi: true
  sla_tier: Standard
  command: "set -euo pipefail\nexport PATH=\"/tmp/studentmodeling-m4-causal-strength-venv/bin:$$PATH\"\
    \nexport PYTHONPATH=\"$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}\"\n\
    export HF_HOME=/tmp/hf_cache\nexport HF_HUB_CACHE=/tmp/hf_cache/hub\nexport HF_HUB_DISABLE_XET=1\n\
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True\nexport TRANSFORMERS_VERBOSITY=error\n\
    export LOCAL_MODEL=/tmp/Qwen3-32B\nexport SOURCE_DATA=/mnt/amulet/studentmodeling/method_small_v1\n\
    export BASE_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean\n\
    export UNIFIED_DATA=/tmp/unified_recurrent_method_small_fixedu4_v2_full\nexport\
    \ CAUSAL_DATA=/tmp/recurrent_causal_pairs_v1\nexport M3_RUN_DIR=/mnt/amulet/studentmodeling/checkpoints/world_model_v1_m3_generation_kd_trainable_seed42_fixedu4_v2_20260730\n\
    export MAIN_RUN_DIR=/mnt/amulet/studentmodeling/checkpoints/world_model_v1_m4_generation_kd_trainable_seed42_fixedu4_v2_20260730\n\
    export CHECKPOINT=\"$$MAIN_RUN_DIR/checkpoint-round-250\"\nexport CACHE_DIR=/mnt/amulet/studentmodeling/world_model_v1/m4/teacher_cache_train_n12000_top256_fixedu4_v2_20260730\n\
    export RUN_DIR=\"/mnt/amulet/studentmodeling/diagnostics/world_model_v1_m4_causal_$${BRANCH}_seed42_round500_20260731\"\
    \nmkdir -p \"$$HF_HUB_CACHE\" \"$$UNIFIED_DATA\" \"$$CAUSAL_DATA\" \"$$RUN_DIR\"\
    \ \\\n  \"$$AMLT_OUTPUT_DIR/model\" \"$$AMLT_OUTPUT_DIR/metrics\" \"$$AMLT_OUTPUT_DIR/eval/c4\"\
    \ntest \"$$(df --output=avail /tmp | tail -1)\" -ge 125829120\ntest -f \"$$SOURCE_DATA/train.jsonl\"\
    \ntest -f \"$$SOURCE_DATA/valid.jsonl\"\ntest -f \"$$BASE_DATA/train.jsonl\"\n\
    test -f \"$$BASE_DATA/val.jsonl\"\ntest -f \"$$BASE_DATA/test_same_template.jsonl\"\
    \ntest -f \"$$M3_RUN_DIR/final_adapter/adapter_model.safetensors\"\ntest -f \"\
    $$M3_RUN_DIR/recurrent_state.pt\"\ntest -f \"$$CACHE_DIR/integrity.json\"\ntest\
    \ -f \"$$CHECKPOINT/adapter/adapter_model.safetensors\"\ntest -f \"$$CHECKPOINT/recurrent_state.pt\"\
    \ntest -f \"$$CHECKPOINT/checkpoint_completion.json\"\ntest \"$$(sha256sum scripts/train_recurrent_student_m4.py\
    \ | cut -d' ' -f1)\" = f03c363cd3614965b495cab73629c8ab79eebce4d8dc72a873e205cc1212f4bc\n\
    test \"$$(sha256sum scripts/recurrent_student_model.py | cut -d' ' -f1)\" = 9e0431dccb524f67b401f7ea911e11c96fc3061432ffdc73e0cac2bbc2acc5a0\n\
    test \"$$(sha256sum scripts/build_unified_recurrent_manifest.py | cut -d' ' -f1)\"\
    \ = 8bc822ec33165037dff8353707a037a0edc12679cd67b66885aa94a4288542f6\ntest \"\
    $$(sha256sum scripts/audit_unified_recurrent_manifest.py | cut -d' ' -f1)\" =\
    \ 6de4fcab57aa8dbd0b56f07972e341f64b60668474f03069cc47878a80e434a0\ntest \"$$(sha256sum\
    \ scripts/build_recurrent_causal_pairs.py | cut -d' ' -f1)\" = 2daed709603a63a487705bce87539b58c7e01d239397758305d3b023f5eb26b7\n\
    test \"$$(sha256sum scripts/evaluate_recurrent_causal_gate.py | cut -d' ' -f1)\"\
    \ = 9dca3271d29153baf66b440239467e6889c0f2c64677c4e31fd4e2d8a5710c10\ntest \"\
    $$(sha256sum manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json | cut -d' ' -f1)\"\
    \ = edcdb934a65252557f6c569eea9ef7a85e5445549deac9fb4829c3f579e1a9b8\npython -m\
    \ unittest discover -s tests -p 'test_train_recurrent_student_m4.py' -v\npython\
    \ -m unittest discover -s tests -p 'test_recurrent_student_model.py' -v\n\npython\
    \ - \"$$CHECKPOINT\" <<'PY'\nimport hashlib, json, sys\nroot = sys.argv[1]\nreceipt\
    \ = json.load(open(root + '/checkpoint_completion.json', encoding='utf-8'))\n\
    digest = lambda path: hashlib.sha256(open(path, 'rb').read()).hexdigest()\nassert\
    \ receipt.get('status') == 'complete' and receipt.get('round') == 250, receipt\n\
    assert receipt.get('world_size') == 4, receipt\nassert receipt['sha256']['adapter_model']\
    \ == digest(root + '/adapter/adapter_model.safetensors')\nassert receipt['sha256']['recurrent_state']\
    \ == digest(root + '/recurrent_state.pt')\nPY\n\nexec 7>/tmp/m4-causal-branch-data.lock\n\
    flock -x 7\nif [[ ! -f /tmp/m4-causal-branch-data.complete ]]; then\n  python\
    \ scripts/build_unified_recurrent_manifest.py \\\n    --train-jsonl \"$$SOURCE_DATA/train.jsonl\"\
    \ \\\n    --valid-jsonl \"$$SOURCE_DATA/valid.jsonl\" \\\n    --output-dir \"\
    $$UNIFIED_DATA\" \\\n    --max-updates 4 \\\n    --seed 20260730\n  python scripts/audit_unified_recurrent_manifest.py\
    \ \\\n    --train-jsonl \"$$UNIFIED_DATA/train.jsonl\" \\\n    --valid-jsonl \"\
    $$UNIFIED_DATA/valid.jsonl\" \\\n    --output-json \"$$UNIFIED_DATA/audit.json\"\
    \n  python scripts/build_recurrent_causal_pairs.py \\\n    --train-source \"$$BASE_DATA/train.jsonl\"\
    \ \\\n    --valid-source \"$$BASE_DATA/val.jsonl\" \\\n    --train-pairs manifests/cf_paired_state_swap_train_seed20260730_v1.json\
    \ \\\n    --valid-pairs manifests/cf_paired_state_swap_valid_seed20260731_v1.json\
    \ \\\n    --output-dir \"$$CAUSAL_DATA\" \\\n    --max-updates 4\n  touch /tmp/m4-causal-branch-data.complete\n\
    fi\nflock -u 7\ntest \"$$(sha256sum \"$$UNIFIED_DATA/train.jsonl\" | cut -d' '\
