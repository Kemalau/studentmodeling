    \ branch\nPY\n    export RESUME_CHECKPOINT=\"$$RUN_DIR/checkpoint-round-500\"\n\
    \  fi\n  python -u scripts/train_recurrent_student_m4.py \\\n    --model \"$$LOCAL_MODEL\"\
