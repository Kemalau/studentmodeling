    \ \\\n    --gradient-accumulation-steps 1 \\\n    --trainable-projections \\\n\
    \    --state-projection-rank 64 \\\n    --eval-limit 300 \\\n    --causal-eval-limit\
    \ 165 \\\n    --save-steps 250 \\\n    --distributed-mpi \\\n    --distributed-world-size\
    \ 4 \\\n    --diagnostic-stop-after-round 500 \\\n    --resume-from-checkpoint\
    \ \"$$RESUME_CHECKPOINT/recurrent_state.pt\" \\\n    --seed 42 \\\n    \"$${normalize_args[@]}\"\
    \nfi\nif [[ \"$${OMPI_COMM_WORLD_RANK:-0}\" != 0 ]]; then\n  exit 0\nfi\ntest\
    \ -f \"$$RUN_DIR/completion.json\"\ntest -f \"$$RUN_DIR/final_adapter/adapter_model.safetensors\"\
    \ntest -f \"$$RUN_DIR/recurrent_state.pt\"\npython - \"$$RUN_DIR\" \"$$BRANCH\"\
    \ \"$$CAUSAL_WEIGHT\" \"$$NORMALIZE_CAUSAL\" <<'PY'\nimport json, sys\nroot, branch\
    \ = sys.argv[1], sys.argv[2]\ncompletion = json.load(open(root + '/completion.json',\
    \ encoding='utf-8'))\nconfig = json.load(open(root + '/run_config.json', encoding='utf-8'))\n\
    history = json.load(open(root + '/trainer_history.json', encoding='utf-8'))\n\
    assert completion.get('status') == 'diagnostic_complete', completion\nassert completion.get('micro_steps')\
    \ == 2000, completion\nassert completion.get('causal_pairs_seen') == 288, completion\n\
    assert config.get('diagnostic_stop_after_round') == 500, config\nassert float(config.get('causal_weight'))\
    \ == float(sys.argv[3]), config\nassert bool(config.get('normalize_causal_exposure'))\
    \ == bool(int(sys.argv[4])), config\ncausal = [row for row in history if row.get('causal_pair_id')]\n\
    payload = {\n    'branch': branch,\n    'round_start': 250,\n    'round_end':\
    \ 500,\n    'causal_weight': float(config['causal_weight']),\n    'causal_exposure_multiplier':\
    \ float(config['causal_exposure_multiplier']),\n    'effective_causal_weight':\
    \ float(config['causal_weight']) * float(config['causal_exposure_multiplier']),\n\
    \    'causal_rows_total': len(causal),\n    'margin_loss_first_half': sum(float(x['causal_margin_loss'])\
    \ for x in causal[:144]) / 144,\n    'margin_loss_second_half': sum(float(x['causal_margin_loss'])\
    \ for x in causal[144:]) / 144,\n}\nopen(root + '/branch_training_summary.json',\
    \ 'w', encoding='utf-8').write(json.dumps(payload, indent=2, sort_keys=True) +\
    \ '\\n')\nprint(json.dumps(payload, indent=2, sort_keys=True))\nPY\npython -u\
    \ scripts/evaluate_recurrent_causal_gate.py \\\n  --model \"$$LOCAL_MODEL\" \\\
    \n  --adapter \"$$RUN_DIR/final_adapter\" \\\n  --recurrent-state \"$$RUN_DIR/recurrent_state.pt\"\
    \ \\\n  --jsonl \"$$BASE_DATA/test_same_template.jsonl\" \\\n  --pair-manifest\
    \ manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json \\\n  --output-json \"$$AMLT_OUTPUT_DIR/eval/c4/recurrent_causal_gate.json\"\
    \ \\\n  --state-token-alias '<|vision_pad|>' \\\n  --max-length 1536 \\\n  --num-pairs\
    \ 150 \\\n  --seed 42\ncp -r \"$$RUN_DIR/final_adapter/.\" \"$$AMLT_OUTPUT_DIR/model/\"\
    \ncp \"$$RUN_DIR/recurrent_state.pt\" \"$$AMLT_OUTPUT_DIR/model/recurrent_state.pt\"\
    \ncp \"$$RUN_DIR/completion.json\" \"$$AMLT_OUTPUT_DIR/metrics/completion.json\"\
    \ncp \"$$RUN_DIR/validation_metrics.json\" \"$$AMLT_OUTPUT_DIR/metrics/validation_metrics.json\"\
    \ncp \"$$RUN_DIR/causal_validation_metrics.json\" \"$$AMLT_OUTPUT_DIR/metrics/causal_validation_metrics.json\"\
    \ncp \"$$RUN_DIR/training_metrics.json\" \"$$AMLT_OUTPUT_DIR/metrics/training_metrics.json\"\
    \ncp \"$$RUN_DIR/run_config.json\" \"$$AMLT_OUTPUT_DIR/metrics/run_config.json\"\
    \ncp \"$$RUN_DIR/gradient_audit.json\" \"$$AMLT_OUTPUT_DIR/metrics/gradient_audit.json\"\
    \ncp \"$$RUN_DIR/branch_training_summary.json\" \"$$AMLT_OUTPUT_DIR/metrics/branch_training_summary.json\"\
    \n"
  submit_args:
    max_attempts: 2
    max_run_duration_seconds: 43200
    env:
      _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
      BRANCH: raw8
      CAUSAL_WEIGHT: '8.0'
      NORMALIZE_CAUSAL: '0'
