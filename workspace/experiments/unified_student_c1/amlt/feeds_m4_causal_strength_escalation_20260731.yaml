    \ = sys.argv[1], sys.argv[2]\nreceipt = json.load(open(root + '/checkpoint_completion.json',\
    \ encoding='utf-8'))\npayload = torch.load(root + '/recurrent_state.pt', map_location='cpu',\
    \ weights_only=False)\ndigest = lambda path: hashlib.sha256(open(path, 'rb').read()).hexdigest()\n\
    assert receipt.get('status') == 'complete' and receipt.get('round') == 500, receipt\n\
    assert receipt.get('world_size') == 4, receipt\nassert receipt['sha256']['adapter_model']\
