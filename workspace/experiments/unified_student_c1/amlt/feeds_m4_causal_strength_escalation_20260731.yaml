    \ \"$$CAUSAL_DATA/train.jsonl\" \\\n    --causal-valid-jsonl \"$$CAUSAL_DATA/valid.jsonl\"\
    \ \\\n    --teacher-cache \"$$CACHE_DIR\" \\\n    --output-dir \"$$RUN_DIR\" \\\
    \n    --state-token-alias '<|vision_pad|>' \\\n    --max-length 1536 \\\n    --learning-rate\
    \ 1e-5 \\\n    --generation-weight 1.0 \\\n    --behavior-kd-weight 0.5 \\\n \
    \   --behavior-kd-temperature 1.0 \\\n    --consistency-weight 0.25 \\\n    --direct-replay-weight\
