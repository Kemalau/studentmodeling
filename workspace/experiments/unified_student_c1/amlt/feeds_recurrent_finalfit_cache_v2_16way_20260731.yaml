  - {name: finalfit-cache-v2-rank15-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "15"}}}
