# Generated from `amlt template -t Feeds -y`; project fields are fail-closed below.
description: Exact batch-1 eager teacher cache for the 259845-row recurrent final fit, split into 16 independently resumable partitions

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-finalfit-cache-v2-venv
    - /tmp/studentmodeling-finalfit-cache-v2-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-finalfit-cache-v2-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: finalfit-cache-v2-rank00-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &cache_command |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-finalfit-cache-v2-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export RAW_FULL=/mnt/amulet/studentmodeling/full_trainplusvalid_no_t4_strict_t6/train.jsonl
      export RAW_SPLIT=/tmp/full_trainvalid_promptcomplete_v1
      export RECURRENT_SPLIT=/tmp/unified_recurrent_full259845_u4_v1
      export FINAL_JSONL="$$RECURRENT_SPLIT/final_fit_trainvalid.jsonl"
      export TEACHER_ADAPTER=/mnt/amulet/studentmodeling/adapters/qwen3_32b_full_trainvalid_no_t4_strictt6_1ep/final_adapter
      export CACHE_ROOT=/mnt/amulet/studentmodeling/world_model_v1/final_fit/cache_full259845_top256_seed42_v2_16way
      export PART_DIR="$$CACHE_ROOT/rank-$${PARTITION_INDEX}"
      mkdir -p "$$HF_HUB_CACHE" "$$PART_DIR" "$$AMLT_OUTPUT_DIR/cache"
      test "$$(df --output=avail /tmp | tail -1)" -ge 125829120
      test -f "$$RAW_FULL"
      test -f "$$TEACHER_ADAPTER/adapter_model.safetensors"
      test "$$(sha256sum "$$RAW_FULL" | cut -d' ' -f1)" = aeabd3b4dfef3c4d92ac68583879c91448ef90f58304cedf32e470b586ca4542
      test "$$(sha256sum scripts/split_full_mix_by_original_split.py | cut -d' ' -f1)" = 6dd0bab1e1e669a6012fbd6dc5947335294ec456a04b4c92dc68240e81974801
      test "$$(sha256sum scripts/build_unified_recurrent_manifest.py | cut -d' ' -f1)" = 8bc822ec33165037dff8353707a037a0edc12679cd67b66885aa94a4288542f6
      test "$$(sha256sum scripts/audit_unified_recurrent_manifest.py | cut -d' ' -f1)" = 6de4fcab57aa8dbd0b56f07972e341f64b60668474f03069cc47878a80e434a0
      test "$$(sha256sum scripts/merge_recurrent_full_corpus.py | cut -d' ' -f1)" = 1bfdf4408867b03d171ef52f7c9c8b8dc328becf759dc304adaf5e37612c4e34
      test "$$(sha256sum scripts/build_teacher_cache.py | cut -d' ' -f1)" = d52b5f17ffbbd033ce2ba27877dbedf9abdaffa4aaaffe8194cbe7bd5a5b7f08
      test "$$(sha256sum scripts/finalize_teacher_cache.py | cut -d' ' -f1)" = d70a169b26f9e632c2104d90a2f4e07913350f4931424de3429c0a1ff922135e
      python -m unittest discover -s tests -p 'test_teacher_cache.py' -v
      python scripts/split_full_mix_by_original_split.py --input-jsonl "$$RAW_FULL" --output-dir "$$RAW_SPLIT"
      test "$$(sha256sum "$$RAW_SPLIT/train.jsonl" | cut -d' ' -f1)" = 70637b5b7e5f828195513b9c1679acb94c09df3c7fd86393fc0b34f555eafaf2
      test "$$(sha256sum "$$RAW_SPLIT/valid.jsonl" | cut -d' ' -f1)" = a3aab16770a09595e5e69e8097678f5374033b359733323bdaff0b1d9b0a2e9d
      python scripts/build_unified_recurrent_manifest.py --train-jsonl "$$RAW_SPLIT/train.jsonl" --valid-jsonl "$$RAW_SPLIT/valid.jsonl" --output-dir "$$RECURRENT_SPLIT" --max-updates 4 --seed 20260730
      test "$$(sha256sum "$$RECURRENT_SPLIT/train.jsonl" | cut -d' ' -f1)" = 2a2f650bb077196a79deaa7eac363d5224fd5936e9c51e60d3fd5f27775282c2
      test "$$(sha256sum "$$RECURRENT_SPLIT/valid.jsonl" | cut -d' ' -f1)" = 78bfce75576dc3873cbb6459669a952adeedb8b77bda15f281af9519e2506d14
      python scripts/audit_unified_recurrent_manifest.py --train-jsonl "$$RECURRENT_SPLIT/train.jsonl" --valid-jsonl "$$RECURRENT_SPLIT/valid.jsonl" --output-json "$$RECURRENT_SPLIT/audit.json"
      python scripts/merge_recurrent_full_corpus.py --train-jsonl "$$RECURRENT_SPLIT/train.jsonl" --valid-jsonl "$$RECURRENT_SPLIT/valid.jsonl" --output-jsonl "$$FINAL_JSONL" --manifest "$$RECURRENT_SPLIT/final_fit_manifest.json"
      test "$$(sha256sum "$$FINAL_JSONL" | cut -d' ' -f1)" = 9961f746cb17e6c314e182d3453b6157022fb48b8de44d2e68bc8e87a1131ccd
      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py --source /mnt/amulet/studentmodeling/models/Qwen3-32B --destination "$$LOCAL_MODEL" --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
      if [[ ! -f "$$PART_DIR/integrity.json" ]]; then
        rm -f "$$PART_DIR"/*.partial
        python -u scripts/build_teacher_cache.py \
          --model "$$LOCAL_MODEL" \
          --teacher-adapter "$$TEACHER_ADAPTER" \
          --jsonl "$$FINAL_JSONL" \
          --output-dir "$$PART_DIR" \
          --state-token-alias '<|vision_pad|>' \
          --max-length 1536 \
          --top-k 256 \
          --shard-size 512 \
          --batch-size 1 \
          --attn-implementation eager \
          --order-seed 42 \
          --partition-index "$$PARTITION_INDEX" \
          --partition-count 16
        python scripts/finalize_teacher_cache.py --cache-dir "$$PART_DIR"
      fi
      python - "$$PART_DIR" "$$PARTITION_INDEX" <<'PY'
      import json, sys
      root, rank = sys.argv[1], int(sys.argv[2])
      manifest = json.load(open(root + '/manifest.json', encoding='utf-8'))
      integrity = json.load(open(root + '/integrity.json', encoding='utf-8'))
      assert manifest['source_sha256'] == '9961f746cb17e6c314e182d3453b6157022fb48b8de44d2e68bc8e87a1131ccd'
      assert manifest['source_rows'] == 259845 and manifest['order_seed'] == 42
      assert manifest['partition_index'] == rank and manifest['partition_count'] == 16
      assert manifest['rows'] in {16240, 16241}
      assert manifest['batch_size'] == 1 and manifest['attn_implementation'] == 'eager'
      assert integrity['status'] == 'verified' and integrity['rows'] == manifest['rows']
      PY
      cp "$$PART_DIR/manifest.json" "$$AMLT_OUTPUT_DIR/cache/manifest.json"
      cp "$$PART_DIR/integrity.json" "$$AMLT_OUTPUT_DIR/cache/integrity.json"
    submit_args: &cache_submit
      max_attempts: 3
      max_run_duration_seconds: 345600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        PARTITION_INDEX: "0"

  - {name: finalfit-cache-v2-rank01-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "1"}}}
  - {name: finalfit-cache-v2-rank02-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "2"}}}
  - {name: finalfit-cache-v2-rank03-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "3"}}}
  - {name: finalfit-cache-v2-rank04-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "4"}}}
  - {name: finalfit-cache-v2-rank05-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "5"}}}
  - {name: finalfit-cache-v2-rank06-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "6"}}}
  - {name: finalfit-cache-v2-rank07-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "7"}}}
  - {name: finalfit-cache-v2-rank08-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "8"}}}
  - {name: finalfit-cache-v2-rank09-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "9"}}}
  - {name: finalfit-cache-v2-rank10-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "10"}}}
  - {name: finalfit-cache-v2-rank11-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "11"}}}
  - {name: finalfit-cache-v2-rank12-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "12"}}}
  - {name: finalfit-cache-v2-rank13-seed42, sku: 80G1-A100, process_count_per_node: 1, mpi: false, sla_tier: Standard, command: *cache_command, submit_args: {max_attempts: 3, max_run_duration_seconds: 345600, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, PARTITION_INDEX: "13"}}}
