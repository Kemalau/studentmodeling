description: Diagnostic n50 C4 at promoted exact-epoch checkpoint round 1000

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-promoted-c1000-c4-venv
    - /tmp/studentmodeling-promoted-c1000-c4-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-promoted-c1000-c4-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: promoted-round1000-c4-n50-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-promoted-c1000-c4-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts/frozen_layerwise_finalfit:$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export CHECKPOINT=/mnt/amulet/studentmodeling/checkpoints/layerwise_unified_world_model_seed42_taskretention_eedi_full_open_t3_state_path_v1_20260802/checkpoint-round-1000
      export PROMOTION=/mnt/amulet/studentmodeling/layerwise_world_model_v1/task_retention_promotion/selected.json
      export C4_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean
      export PAIRS=/tmp/c4_pairs_seed42_n50.json
      mkdir -p "$$HF_HUB_CACHE" "$$AMLT_OUTPUT_DIR/eval/c4" "$$CHECKPOINT/c4_eval_progress_n50_v1"
      test -f "$$CHECKPOINT/checkpoint_completion.json"
      test -f "$$CHECKPOINT/adapter/adapter_config.json"
      test -f "$$CHECKPOINT/adapter/adapter_model.safetensors"
      test -f "$$CHECKPOINT/recurrent_state.pt"
      test -f "$$PROMOTION"
      test -f "$$C4_DATA/test_same_template.jsonl"
      test "$$(df --output=avail /tmp | tail -1)" -ge 83886080
      test "$$(sha256sum "$$PROMOTION" | cut -d' ' -f1)" = adc6eacca29cf22c554875d0f1e5cd8e6cbd6722966228b3aafe8a3e62ca0ee7
      test "$$(sha256sum "$$C4_DATA/test_same_template.jsonl" | cut -d' ' -f1)" = 079f7634cc54dfd55dfc234503bb5925ab734b1ca74aa2f2a9a17cc4375a2c2f
      test "$$(sha256sum manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json | cut -d' ' -f1)" = edcdb934a65252557f6c569eea9ef7a85e5445549deac9fb4829c3f579e1a9b8
      test "$$(sha256sum scripts/evaluate_recurrent_causal_gate.py | cut -d' ' -f1)" = fd6510465abafbd897ac4acbf27dd0da14b179637ba9a632f4c5cb539214c5ad
      test "$$(sha256sum scripts/audit_layerwise_distributed_checkpoint.py | cut -d' ' -f1)" = 6690ece8935c6343bec7136ad34a9899b72a866c7bde6286ca26b2c82890007f
      test "$$(sha256sum scripts/audit_layerwise_promoted_checkpoint.py | cut -d' ' -f1)" = 2d6f522759706b370c51919dd84e58d0fb9fcaf93c16244fcb2312dd15a8df78
      test "$$(sha256sum scripts/frozen_layerwise_finalfit/layerwise_recurrent_student_model.py | cut -d' ' -f1)" = c80357282e600b31f68f55d8ab434ad349c0e9eeeeb222b52dbadae7caea11ca
      test "$$(sha256sum tests/frozen_layerwise_finalfit/test_layerwise_recurrent_student_model.py | cut -d' ' -f1)" = a995f82f364eb3247ff3e17873cc720bbce7a2a8f52813c9369421fa61d3c274
      python - "$$CHECKPOINT" <<'PY'
      import hashlib,json,pathlib,sys
      root=pathlib.Path(sys.argv[1]); receipt=json.load(open(root/'checkpoint_completion.json'))
      def digest(path):
          h=hashlib.sha256()
          with open(path,'rb') as handle:
              for chunk in iter(lambda:handle.read(1024*1024),b''): h.update(chunk)
          return h.hexdigest()
      observed={'adapter_model':digest(root/'adapter/adapter_model.safetensors'),
                'recurrent_state':digest(root/'recurrent_state.pt')}
      assert receipt.get('status')=='complete' and receipt.get('round')==1000,receipt
      assert receipt.get('world_size')==16 and receipt.get('sha256')==observed,(receipt,observed)
      PY
      python scripts/audit_layerwise_distributed_checkpoint.py \
        --checkpoint "$$CHECKPOINT/recurrent_state.pt" --expected-round 1000 \
        --output "$$AMLT_OUTPUT_DIR/eval/c4/exact_resume_audit.json"
      python scripts/audit_layerwise_promoted_checkpoint.py \
        --checkpoint "$$CHECKPOINT/recurrent_state.pt" --manifest "$$PROMOTION" \
        --expected-round 1000 --output "$$AMLT_OUTPUT_DIR/eval/c4/promoted_recipe_audit.json"
      python - manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json "$$PAIRS" <<'PY'
      import hashlib,json,pathlib,sys
      source=pathlib.Path(sys.argv[1]); value=json.loads(source.read_text())
      assert value.get('num_pairs')==150 and len(value.get('pairs') or [])==150,value
      out={**value,'num_pairs':50,'pairs':value['pairs'][:50],'diagnostic_only':True,
           'selection':'ordered_prefix','parent_manifest_sha256':hashlib.sha256(source.read_bytes()).hexdigest()}
      pathlib.Path(sys.argv[2]).write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
      PY
      python -m unittest discover -s tests -p 'test_evaluate_recurrent_causal_gate.py' -v
      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      export C4_PROGRESS_KEY="$$(python - "$$CHECKPOINT/checkpoint_completion.json" <<'PY'
      import json,sys
      x=json.load(open(sys.argv[1])); print(f"round={x['round']}:adapter={x['sha256']['adapter_model']}:state={x['sha256']['recurrent_state']}:n50")
      PY
      )"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
      python -u scripts/evaluate_recurrent_causal_gate.py \
        --model "$$LOCAL_MODEL" --adapter "$$CHECKPOINT/adapter" \
        --recurrent-state "$$CHECKPOINT/recurrent_state.pt" --state-architecture layerwise \
        --jsonl "$$C4_DATA/test_same_template.jsonl" --pair-manifest "$$PAIRS" \
        --output-json "$$AMLT_OUTPUT_DIR/eval/c4/recurrent_causal_gate.json" \
        --state-token-alias '<|vision_pad|>' --max-length 1536 --num-pairs 50 --seed 42 \
        --progress-dir "$$CHECKPOINT/c4_eval_progress_n50_v1" --progress-key "$$C4_PROGRESS_KEY"
      python - "$$AMLT_OUTPUT_DIR/eval/c4/recurrent_causal_gate.json" \
        "$$AMLT_OUTPUT_DIR/eval/c4/summary.json" <<'PY'
      import json,pathlib,sys
      x=json.load(open(sys.argv[1]))['summary']; c=x['clean']
      assert x['all_pairs_n']==50 and x['clean_n']>0,x
      out={'stage':'layerwise_checkpoint_c4','artifact_label':'promoted-eedi-full-open-t3-state-path-lr2e6',
           'checkpoint_round':1000,'diagnostic_only':True,'not_a_formal_gate':True,
           'clean_n':x['clean_n'],'swap':c['swap']['flip_to_A_rate'],
           'random':c['random']['flip_to_A_rate'],'same_rule':c['samemal']['flip_to_A_rate'],
           'noop':c['noop']['flip_to_A_rate'],'D_specific':x['D_specific'],
           'scientific_gate_pass':x['scientific_gate_pass'],'checks':x['checks']}
      pathlib.Path(sys.argv[2]).write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
      print(json.dumps(out,indent=2,sort_keys=True))
      PY
      cp "$$PAIRS" "$$AMLT_OUTPUT_DIR/eval/c4/c4_pair_manifest_n50.json"
      printf '%s\n' 'stage=promoted_round1000_c4' 'diagnostic_only=true' 'checkpoint_round=1000' > "$$AMLT_OUTPUT_DIR/eval/c4/scope.txt"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
