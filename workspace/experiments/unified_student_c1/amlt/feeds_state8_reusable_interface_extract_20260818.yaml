# Parallel frozen-state extraction for the revised C4 reusable-interface protocol.
description: Extract student-disjoint recurrent State8 features for revised C4

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-reusable-interface-venv
    - /tmp/studentmodeling-state8-reusable-interface-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-reusable-interface-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-reusable-interface-train-seed8601
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_reusable_interface_extract.sh | cut -d' ' -f1)" = bdc7c5cb82f3ff1a54ebdc0dab04182678c146797a83e9be7328bc86be5dfa9c
      test "$$(sha256sum scripts/evaluate_state8_reusable_interface.py | cut -d' ' -f1)" = d74c6859912e00b0d2ce116c557206e3e8c000a0e890cbc1eb6f7e6ae35d78aa
      export STATE_INTERFACE_SPLIT=train
      bash scripts/run_state8_reusable_interface_extract.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-reusable-interface-venv
  - name: state8-reusable-interface-valid-seed8601
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_reusable_interface_extract.sh | cut -d' ' -f1)" = bdc7c5cb82f3ff1a54ebdc0dab04182678c146797a83e9be7328bc86be5dfa9c
      test "$$(sha256sum scripts/evaluate_state8_reusable_interface.py | cut -d' ' -f1)" = d74c6859912e00b0d2ce116c557206e3e8c000a0e890cbc1eb6f7e6ae35d78aa
      export STATE_INTERFACE_SPLIT=valid
      bash scripts/run_state8_reusable_interface_extract.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-reusable-interface-venv
  - name: state8-reusable-interface-test-seed8601
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_reusable_interface_extract.sh | cut -d' ' -f1)" = bdc7c5cb82f3ff1a54ebdc0dab04182678c146797a83e9be7328bc86be5dfa9c
      test "$$(sha256sum scripts/evaluate_state8_reusable_interface.py | cut -d' ' -f1)" = d74c6859912e00b0d2ce116c557206e3e8c000a0e890cbc1eb6f7e6ae35d78aa
      export STATE_INTERFACE_SPLIT=test
      bash scripts/run_state8_reusable_interface_extract.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-reusable-interface-venv
