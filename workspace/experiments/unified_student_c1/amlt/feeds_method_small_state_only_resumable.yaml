# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
description: Resume-safe one-epoch hard student-state bottleneck QLoRA on method_small_v1

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-venv
    - /tmp/studentmodeling-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: qwen3-32b-method-small-state-only-resumable
    sku: 80G1-A100
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export TRAIN_DATA=/mnt/amulet/studentmodeling/method_small_v1/train.jsonl
      export VALID_DATA=/mnt/amulet/studentmodeling/method_small_v1/valid.jsonl
      export RUN_DIR=/mnt/amulet/studentmodeling/checkpoints/method_small_state_only_resumable_20260725
      mkdir -p "$$HF_HUB_CACHE" "$$AMLT_OUTPUT_DIR/model" "$$RUN_DIR"
      sha256sum "$$TRAIN_DATA" "$$VALID_DATA" | tee "$$AMLT_OUTPUT_DIR/input_sha256.txt"
      available_kb=$$(df --output=avail /tmp | tail -1)
      test "$$available_kb" -ge 125829120
      (
        flock -x 9
        if [[ ! -f /tmp/Qwen3-32B.copy_complete ]]; then
          rm -rf "$$LOCAL_MODEL"
          mkdir -p "$$LOCAL_MODEL"
          cp -r /mnt/amulet/studentmodeling/models/Qwen3-32B/. "$$LOCAL_MODEL/"
          touch /tmp/Qwen3-32B.copy_complete
        fi
      ) 9>/tmp/qwen3-32b-copy.lock

      if [[ -f "$$RUN_DIR/final_adapter/adapter_model.safetensors" ]]; then
        cp -r "$$RUN_DIR/final_adapter/." "$$AMLT_OUTPUT_DIR/model/"
        exit 0
      fi

      latest=""
      mapfile -t checkpoints < <(find "$$RUN_DIR" -mindepth 1 -maxdepth 1 -type d -name 'checkpoint-*' | sort -V)
      for ((i=$${#checkpoints[@]}-1; i>=0; i--)); do
        candidate="$${checkpoints[$$i]}"
        if [[ -f "$$candidate/adapter_model.safetensors" \
              && -f "$$candidate/optimizer.pt" \
              && -f "$$candidate/scheduler.pt" \
              && -f "$$candidate/trainer_state.json" ]]; then
          latest="$$candidate"
          break
        fi
      done
      resume_args=()
      if [[ -n "$$latest" ]]; then
        echo "[resume] checkpoint=$$latest"
        resume_args=(--resume-from-checkpoint "$$latest")
      else
        echo "[resume] no complete checkpoint; starting from step 0"
      fi

      python -u scripts/train_c1_lora.py \
        --model "$$LOCAL_MODEL" \
        --train-jsonl "$$TRAIN_DATA" \
        --valid-jsonl "$$VALID_DATA" \
        --output-dir "$$RUN_DIR" \
        --max-length 1536 \
        --max-train-samples 12000 \
        --max-valid-samples 900 \
        --max-steps 3000 \
        --per-device-train-batch-size 1 \
        --per-device-eval-batch-size 1 \
        --gradient-accumulation-steps 4 \
        --learning-rate 1e-4 \
        --lora-rank 8 \
        --lora-alpha 16 \
        --load-4bit \
        --state-token-alias '<|vision_pad|>' \
        --bottleneck-mask \
        --bottleneck-style standard \
        --supervise-eos \
        --logging-steps 20 \
        --eval-steps 3000 \
        --save-steps 200 \
        --seed 42 \
        "$${resume_args[@]}"
      test -f "$$RUN_DIR/final_adapter/adapter_model.safetensors"
      cp -r "$$RUN_DIR/final_adapter/." "$$AMLT_OUTPUT_DIR/model/"
      cp "$$RUN_DIR/run_config.json" "$$AMLT_OUTPUT_DIR/model/run_config.json"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
