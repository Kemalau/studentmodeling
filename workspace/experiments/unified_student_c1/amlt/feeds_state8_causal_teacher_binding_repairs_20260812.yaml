description: Bound State8 same-question failed-checkpoint orthogonal repair branches
target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
  - python -m venv --system-site-packages /tmp/studentmodeling-state8-eedi-repair-venv
  - /tmp/studentmodeling-state8-eedi-repair-venv/bin/python -m pip install --upgrade
    pip
  - /tmp/studentmodeling-state8-eedi-repair-venv/bin/python -m pip install -r requirements-feeds.txt
code:
  local_dir: /home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1
  ignore:
  - .git/
  - .vscode/
  - amlt/
  - data/
  - results/
  - __pycache__/
  - '*.pyc'
storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true
jobs:
- name: state8-eedi-repair-causal-teacher-low-seed8201
  sku: 80G1-A100
  process_count_per_node: 1
  mpi: false
  sla_tier: Standard
  command: 'set -euo pipefail

    test "$$(sha256sum scripts/run_state8_eedi_same_question_repair_branch.sh | cut
    -d'' '' -f1)" = 9bb45e7262277677a8b0e184bb8dd9a3782ac68cb25b11529666979a01dc0178

    bash scripts/run_state8_eedi_same_question_repair_branch.sh

    '
  submit_args:
    max_attempts: 2
    max_run_duration_seconds: 172800
    env:
      _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
      VENV_ROOT: /tmp/studentmodeling-state8-eedi-repair-venv
      REPAIR_BRANCH: causal_teacher_low
      REPAIR_SEED: '8201'
      SOURCE_CHECKPOINT_ARM: curriculum_current_query
      SOURCE_CHECKPOINT_STEP: '3000'
      SOURCE_CHECKPOINT_ROOT: /mnt/amulet/studentmodeling/checkpoint_snapshots/state8_diagnosis_first_eedi_current_query_curriculum_20260812/checkpoint-3000
      SOURCE_ANCHOR_MODE: full_mse1
      EXPECTED_STUDENT_ADAPTER_SHA256: 566bd6a488523bd59610767e019c53c5f1609b760a1ab1d1fcf6cbaabc95cabd
      EXPECTED_STUDENT_STATE_SHA256: 5e0b0d40ee5dee2429f641270cdbb83e66b96172cd53e3336e84ac9b6564ac73
      REPAIR_REMOTE_ROOT: /mnt/amulet/studentmodeling/diagnostics/state8_stateonly_repair_seed8201_taskanchor_source_anchor_full_mse1_eedi_same_question_v1_causal_teacher_low_seed8201
      STATE8_EEDI_CAUSAL_TWINS: '200'
      STATE8_CAUSAL_REPEAT_FRACTION: '0.75'
      STATE8_CAUSAL_WEIGHT: '2.0'
      STATE8_CAUSAL_MARGIN: '0.5'
      STATE8_EEDI_GEOMETRY_WEIGHT: '0.10'
      STATE8_CAUSAL_TEACHER_TRAJECTORY_WEIGHT: '0.15'
      STATE8_CAUSAL_TEACHER_COSINE_WEIGHT: '1.0'
      STATE8_CAUSAL_TEACHER_RELATIVE_MSE_WEIGHT: '1.0'
