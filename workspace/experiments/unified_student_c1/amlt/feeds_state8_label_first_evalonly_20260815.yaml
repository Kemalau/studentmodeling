description: Frozen completed State8 label-first checkpoint, read-only causal evaluation

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-label-first-evalonly-venv
    - /tmp/studentmodeling-state8-label-first-evalonly-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-label-first-evalonly-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-label-first-readout-25
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &eval_command |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_label_first_evalonly.sh | cut -d' ' -f1)" = 896e10518c02214647ca8535bc3085d757830d77ba7172943d96126da0dd2456
      bash scripts/run_state8_label_first_evalonly.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-label-first-evalonly-venv
        EVAL_KIND: readout

  - name: state8-label-first-natural-c4-25
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: *eval_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-label-first-evalonly-venv
        EVAL_KIND: natural_c4
