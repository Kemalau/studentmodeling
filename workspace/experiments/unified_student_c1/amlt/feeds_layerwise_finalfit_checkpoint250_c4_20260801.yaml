# Generated from `amlt template -t Feeds -f amlt/feeds_layerwise_finalfit_checkpoint250_c4_20260801.yaml -y`.
# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
description: Diagnostic-only frozen C4 probe of the formal layerwise unified fit at atomic round 1000

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-layerwise-checkpoint-c4-venv
    - /tmp/studentmodeling-layerwise-checkpoint-c4-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-layerwise-checkpoint-c4-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: layerwise-finalfit-checkpoint1000-c4-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-layerwise-checkpoint-c4-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export RUN_DIR=/mnt/amulet/studentmodeling/diagnostics/layerwise_unified_finalfit_seed42_20260801_snapshot
      export CHECKPOINT="$$RUN_DIR/checkpoint-round-1000"
      export C4_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean
      mkdir -p "$$HF_HUB_CACHE" "$$AMLT_OUTPUT_DIR/eval/c4"
      test -f "$$CHECKPOINT/adapter/adapter_config.json"
      test -f "$$CHECKPOINT/adapter/adapter_model.safetensors"
      test -f "$$CHECKPOINT/recurrent_state.pt"
      test -f "$$CHECKPOINT/checkpoint_completion.json"
      python - "$$CHECKPOINT" <<'PY'
      import hashlib, json, pathlib, sys
      root = pathlib.Path(sys.argv[1])
      receipt = json.load(open(root / 'checkpoint_completion.json', encoding='utf-8'))
      def digest(path):
          value = hashlib.sha256()
          with open(path, 'rb') as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                  value.update(chunk)
          return value.hexdigest()
      assert receipt.get('status') == 'complete' and receipt.get('round') == 1000, receipt
      assert receipt.get('world_size') == 16, receipt
      assert receipt['sha256']['adapter_model'] == digest(root / 'adapter/adapter_model.safetensors')
      assert receipt['sha256']['recurrent_state'] == digest(root / 'recurrent_state.pt')
      PY
      export C4_PROGRESS_DIR="$$CHECKPOINT/c4_eval_progress_v1"
      export C4_PROGRESS_KEY="$$(python - "$$CHECKPOINT/checkpoint_completion.json" <<'PY'
      import json,sys
      x=json.load(open(sys.argv[1],encoding='utf-8'))
      print(f"round={x['round']}:adapter={x['sha256']['adapter_model']}:state={x['sha256']['recurrent_state']}")
      PY
      )"
      mkdir -p "$$C4_PROGRESS_DIR"
      test "$$(sha256sum scripts/audit_layerwise_distributed_checkpoint.py | cut -d' ' -f1)" = 6690ece8935c6343bec7136ad34a9899b72a866c7bde6286ca26b2c82890007f
      python scripts/audit_layerwise_distributed_checkpoint.py \
        --checkpoint "$$CHECKPOINT/recurrent_state.pt" \
        --expected-round 1000 \
        --output "$$AMLT_OUTPUT_DIR/eval/c4/checkpoint_resume_audit.json"
      test "$$(sha256sum "$$C4_DATA/test_same_template.jsonl" | cut -d' ' -f1)" = 079f7634cc54dfd55dfc234503bb5925ab734b1ca74aa2f2a9a17cc4375a2c2f
      test "$$(sha256sum manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json | cut -d' ' -f1)" = edcdb934a65252557f6c569eea9ef7a85e5445549deac9fb4829c3f579e1a9b8
      test "$$(sha256sum scripts/evaluate_recurrent_causal_gate.py | cut -d' ' -f1)" = fd6510465abafbd897ac4acbf27dd0da14b179637ba9a632f4c5cb539214c5ad
      test "$$(sha256sum scripts/frozen_layerwise_finalfit/layerwise_recurrent_student_model.py | cut -d' ' -f1)" = c80357282e600b31f68f55d8ab434ad349c0e9eeeeb222b52dbadae7caea11ca
      test "$$(sha256sum tests/frozen_layerwise_finalfit/test_layerwise_recurrent_student_model.py | cut -d' ' -f1)" = a995f82f364eb3247ff3e17873cc720bbce7a2a8f52813c9369421fa61d3c274
      cp scripts/frozen_layerwise_finalfit/layerwise_recurrent_student_model.py scripts/layerwise_recurrent_student_model.py
      cp tests/frozen_layerwise_finalfit/test_layerwise_recurrent_student_model.py tests/test_layerwise_recurrent_student_model.py
      test "$$(sha256sum scripts/layerwise_recurrent_student_model.py | cut -d' ' -f1)" = c80357282e600b31f68f55d8ab434ad349c0e9eeeeb222b52dbadae7caea11ca
      python -m unittest discover -s tests -p 'test_evaluate_recurrent_causal_gate.py' -v
      rm -rf "$$LOCAL_MODEL"; mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
      python -u scripts/evaluate_recurrent_causal_gate.py \
        --model "$$LOCAL_MODEL" --adapter "$$CHECKPOINT/adapter" \
        --recurrent-state "$$CHECKPOINT/recurrent_state.pt" \
        --state-architecture layerwise \
        --jsonl "$$C4_DATA/test_same_template.jsonl" \
        --pair-manifest manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json \
        --output-json "$$AMLT_OUTPUT_DIR/eval/c4/recurrent_causal_gate.json" \
        --state-token-alias '<|vision_pad|>' --max-length 1536 \
        --num-pairs 150 --seed 42 \
        --progress-dir "$$C4_PROGRESS_DIR" --progress-key "$$C4_PROGRESS_KEY"
      printf '%s\n' \
        'stage=layerwise_finalfit_checkpoint_c4' \
        'diagnostic_only=true' \
        'checkpoint_round=1000' \
        'formal_final_c4_required=true' \
        > "$$AMLT_OUTPUT_DIR/eval/c4/probe_scope.txt"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
