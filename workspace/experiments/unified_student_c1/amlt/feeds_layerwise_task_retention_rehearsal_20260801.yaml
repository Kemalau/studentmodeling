description: Two-arm train-only T3/T6 task-retention rehearsal from immutable layerwise round-750 checkpoint

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-layerwise-task-retention-venv
    - /tmp/studentmodeling-layerwise-task-retention-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-layerwise-task-retention-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: layerwise-task-retention-equal-t3-t6-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: &task_retention_command |
      set -euo pipefail
      bash scripts/run_layerwise_task_retention_rehearsal.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-layerwise-task-retention-venv
        BRANCH: equal_t3_t6
        MANIFEST: manifests/layerwise_task_retention_equal_t3_t6_seed42_v1.json
        MANIFEST_SHA256: 32adfcc7bd1d78f541ec8685ec8f96f9934b35471011bb896c402b1e77a7bf6f

  - name: layerwise-task-retention-t3-heavy-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: *task_retention_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-layerwise-task-retention-venv
        BRANCH: t3_heavy
        MANIFEST: manifests/layerwise_task_retention_t3_heavy_seed42_v1.json
        MANIFEST_SHA256: ba8ad97ea29111ce6a5d15f17f3e2bf88fe44a47ef5f10a889815d782f12438e
