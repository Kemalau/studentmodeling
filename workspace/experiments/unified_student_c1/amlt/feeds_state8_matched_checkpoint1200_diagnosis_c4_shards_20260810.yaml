# Generated with `amlt template -t Feeds -n 4 -y`, then specialized for five
# disjoint checkpoint-1200 diagnosis-C4 shards.
description: Hash-bound checkpoint-1200 diagnosis C4 in five disjoint 10-pair shards

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-matched-checkpoint1200-c4-shards-venv
    - /tmp/studentmodeling-state8-matched-checkpoint1200-c4-shards-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-matched-checkpoint1200-c4-shards-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-matched-cp1200-diagnosis-c4-shard00
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &shard_command |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_matched_checkpoint1200_diagnosis_c4_shard.sh | cut -d' ' -f1)" = 200eef02cda83a2c71b5e1972af1b18253d0eb733357403860ba44bda0c542e4
      bash scripts/run_state8_matched_checkpoint1200_diagnosis_c4_shard.sh
    submit_args: &shard_submit
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        PAIR_START: '0'
        PAIR_COUNT: '10'

  - name: state8-matched-cp1200-diagnosis-c4-shard10
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: *shard_command
    submit_args:
      <<: *shard_submit
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        PAIR_START: '10'
        PAIR_COUNT: '10'

  - name: state8-matched-cp1200-diagnosis-c4-shard20
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: *shard_command
    submit_args:
      <<: *shard_submit
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        PAIR_START: '20'
        PAIR_COUNT: '10'

  - name: state8-matched-cp1200-diagnosis-c4-shard30
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: *shard_command
    submit_args:
      <<: *shard_submit
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        PAIR_START: '30'
        PAIR_COUNT: '10'

  - name: state8-matched-cp1200-diagnosis-c4-shard40
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: *shard_command
    submit_args:
      <<: *shard_submit
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        PAIR_START: '40'
        PAIR_COUNT: '10'
