# Generated with `amlt template -t Feeds -y`, then specialized for the gated
# diagnosis-first full-history-teacher to eight-State-token curriculum.
description: Gated diagnosis-first teacher to State8 five-phase curriculum

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-diagnosis-first-matched-curriculum-venv
    - /tmp/studentmodeling-diagnosis-first-matched-curriculum-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-diagnosis-first-matched-curriculum-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-diagnosis-first-matched-curriculum-seed67
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      test "$$(sha256sum scripts/run_state8_diagnosis_first_matched_curriculum.sh | cut -d' ' -f1)" = 1bb2bb9e7d3ec12b74d54a3aed5bbd8093395721bc9a62e0bd31cf09fdd2f925
      test "$$(sha256sum scripts/train_state8_diagnosis_first_matched_teacher_curriculum.py | cut -d' ' -f1)" = 0f4e305fa5eb48ec2beaa328a3b9c125b649f28327a405a211a1803570498a1a
      bash scripts/run_state8_diagnosis_first_matched_curriculum.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-diagnosis-first-matched-curriculum-venv
