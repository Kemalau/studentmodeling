# Generated with `amlt template -t Feeds -f <path> -n 4 -y`, then specialized.
description: Hash-bound read-only trajectory screen for five diagnosis-task-anchor milestones
target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-taskanchor-milestone-venv
    - /tmp/studentmodeling-state8-taskanchor-milestone-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-taskanchor-milestone-venv/bin/python -m pip install -r requirements-feeds.txt
code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']
storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true
