# Generated with `amlt template -t Feeds -y`, then specialized for a
# schema-matched diagnosis-first full-history teacher and frozen-panel screen.
description: Diagnosis-first full-history T3 teacher with semantic gate artifacts

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-diagnosis-first-teacher-venv
    - /tmp/studentmodeling-diagnosis-first-teacher-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-diagnosis-first-teacher-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-diagnosis-first-full-history-teacher-seed66
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      export PATH="/tmp/studentmodeling-diagnosis-first-teacher-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export RAW_FULL=/mnt/amulet/studentmodeling/full_trainplusvalid_no_t4_strict_t6/train.jsonl
      export RAW_EVAL=/mnt/amulet/studentmodeling/formal_evaluation_v1/test.jsonl
      export INIT_ADAPTER=/mnt/amulet/studentmodeling/adapters/qwen3_32b_full_trainvalid_no_t4_strictt6_1ep/final_adapter
      export RAW_SPLIT=/tmp/state8_diagnosis_first_teacher_raw_split
      export RECURRENT_SPLIT=/tmp/state8_diagnosis_first_teacher_recurrent_split
      export RECURRENT_EVAL=/tmp/state8_diagnosis_first_teacher_formal_u4/test.jsonl
      export TEACHER_VIEWS=/tmp/state8_diagnosis_first_teacher_views
      export TEACHER_RUN=/mnt/amulet/studentmodeling/checkpoints/state8_diagnosis_first_full_history_teacher_seed66_v1_20260810
      export STABLE_ROOT=/mnt/amulet/studentmodeling/diagnostics/state8_diagnosis_first_full_history_teacher_v1
      mkdir -p "$$HF_HUB_CACHE" "$$RAW_SPLIT" "$$RECURRENT_SPLIT" "$$(dirname "$$RECURRENT_EVAL")" \
        "$$TEACHER_VIEWS" "$$TEACHER_RUN" "$$AMLT_OUTPUT_DIR/model" "$$AMLT_OUTPUT_DIR/metrics" \
        "$$AMLT_OUTPUT_DIR/eval/t3" "$$STABLE_ROOT/model" "$$STABLE_ROOT/metrics"
      test -f "$$RAW_FULL"
      test -f "$$RAW_EVAL"
      test -f "$$INIT_ADAPTER/adapter_model.safetensors"
      test -f "$$INIT_ADAPTER/adapter_config.json"
      test "$$(df --output=avail /tmp | tail -1)" -ge 125829120
      test "$$(sha256sum "$$RAW_FULL" | cut -d' ' -f1)" = aeabd3b4dfef3c4d92ac68583879c91448ef90f58304cedf32e470b586ca4542
      test "$$(sha256sum "$$RAW_EVAL" | cut -d' ' -f1)" = bff7726953ae048bedf6dacdbb7500a54cb8de305e406f2497ef1f11c04167f8
      test "$$(sha256sum "$$INIT_ADAPTER/adapter_model.safetensors" | cut -d' ' -f1)" = 31db2cbe6163e2a32ffe71688803d75b707b7624f79af4a6a1f4a6892138835a
      test "$$(sha256sum scripts/build_state8_diagnosis_first_teacher_views.py | cut -d' ' -f1)" = 57fcf65b5fba246231469c117a1d26aa038d22054eb6abe08a44317737198724
      test "$$(sha256sum scripts/train_c1_lora.py | cut -d' ' -f1)" = 7c8b8b0a32ecf5695b7200f2c5b64fb0989598b88dff1da59da7cbfe7752d591
      python -m pytest -q tests/test_build_state8_diagnosis_first_teacher_views.py \
        tests/test_build_state8_teacher_views.py tests/test_train_c1_lora_init_adapter.py
      rm -rf "$$RAW_SPLIT" "$$RECURRENT_SPLIT" "$$(dirname "$$RECURRENT_EVAL")" "$$TEACHER_VIEWS"
      mkdir -p "$$RAW_SPLIT" "$$RECURRENT_SPLIT" "$$(dirname "$$RECURRENT_EVAL")" "$$TEACHER_VIEWS"
      python scripts/split_full_mix_by_original_split.py \
        --input-jsonl "$$RAW_FULL" --output-dir "$$RAW_SPLIT"
      python scripts/build_unified_recurrent_manifest.py \
        --train-jsonl "$$RAW_SPLIT/train.jsonl" --valid-jsonl "$$RAW_SPLIT/valid.jsonl" \
        --output-dir "$$RECURRENT_SPLIT" --max-updates 4 --seed 20260730
      python scripts/build_recurrent_evaluation_manifest.py \
        --input-jsonl "$$RAW_EVAL" --output-jsonl "$$RECURRENT_EVAL" \
        --audit-json /tmp/state8_diagnosis_first_teacher_formal_u4/audit.json \
        --max-updates 4 --seed 20260730
      python scripts/build_state8_diagnosis_first_teacher_views.py \
        --train-jsonl "$$RECURRENT_SPLIT/train.jsonl" \
        --valid-jsonl "$$RECURRENT_SPLIT/valid.jsonl" \
        --eval-jsonl "$$RECURRENT_EVAL" --output-dir "$$TEACHER_VIEWS"
      python - "$$TEACHER_VIEWS/receipt.json" <<'PY'
      import json,sys
      x=json.load(open(sys.argv[1])); o=x['outputs']
      assert x['stage']=='state8_diagnosis_first_full_history_teacher_views_v1',x
      assert x['diagnosis_field_order']==['diagnosis','evidence','label'],x
      assert x['canonical_label_role']=='auxiliary_supervision_and_reporting',x
      assert x['example_id_overlaps']=={'train_valid':0,'train_eval':0,'valid_eval':0},x
      assert o['train']['rows']==6476 and o['valid']['rows']==300 and o['eval']['rows']==1494,x
      assert o['eval']['source_counts']=={'eedi_mining':894,'malrule':600},x
      PY
      rm -rf "$$LOCAL_MODEL"; mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total,memory.used --format=csv,noheader
      resume_args=()
      latest_checkpoint="$$(python - "$$TEACHER_RUN" <<'PY'
      import pathlib,re,sys
      root=pathlib.Path(sys.argv[1]); valid=[]
      for path in root.glob('checkpoint-*'):
          match=re.fullmatch(r'checkpoint-(\d+)',path.name)
          required=('adapter_model.safetensors','adapter_config.json','trainer_state.json','optimizer.pt','scheduler.pt')
          if match and all((path/name).is_file() for name in required): valid.append((int(match.group(1)),path))
      print(max(valid)[1] if valid else '')
      PY
      )"
      [[ -z "$$latest_checkpoint" ]] || resume_args=(--resume-from-checkpoint "$$latest_checkpoint")
      python -u scripts/train_c1_lora.py \
        --model "$$LOCAL_MODEL" --init-adapter "$$INIT_ADAPTER" \
        --train-jsonl "$$TEACHER_VIEWS/train.jsonl" --valid-jsonl "$$TEACHER_VIEWS/valid.jsonl" \
        --output-dir "$$TEACHER_RUN" "$${resume_args[@]}" --max-length 1536 \
        --max-train-samples 6476 --max-valid-samples 300 \
        --max-steps -1 --num-train-epochs 1 \
        --per-device-train-batch-size 1 --per-device-eval-batch-size 1 \
        --gradient-accumulation-steps 16 --learning-rate 2e-5 \
        --supervise-eos --logging-steps 10 --eval-steps 405 \
        --save-steps 100 --save-total-limit 2 --seed 66
      test -f "$$TEACHER_RUN/final_adapter/adapter_model.safetensors"
      python scripts/add_state8_teacher_markers.py \
        --input-jsonl "$$TEACHER_VIEWS/eval.jsonl" \
        --output-jsonl /tmp/state8_diagnosis_first_teacher_eval_exact_path.jsonl
      python -u scripts/evaluate_formal_protocols.py \
        --model "$$LOCAL_MODEL" --adapter "$$TEACHER_RUN/final_adapter" \
        --eval-jsonl /tmp/state8_diagnosis_first_teacher_eval_exact_path.jsonl \
        --output-dir "$$AMLT_OUTPUT_DIR/eval/t3" \
        --max-length 1536 --max-new-tokens 256 --generation-batch-size 1 \
        --tasks diagnose_misconception --sources eedi_mining malrule \
        --max-samples-per-group 25 --seed 66 --save-unredacted-predictions
      python - "$$AMLT_OUTPUT_DIR/eval/t3/metrics.json" <<'PY'
      import json,sys
      x=json.load(open(sys.argv[1])); g=x['metrics_by_group']
      assert x['sampled_rows']==75 and x['generation_rows']==75,x
      assert set(g)=={
       'diagnose_misconception/eedi_mining/open_taxonomy_generation',
       'diagnose_misconception/malrule/synthetic_cross_template_open_generation',
       'diagnose_misconception/malrule/synthetic_same_template_open_generation'},g
      assert all(v['n']==25 for v in g.values()),g
      PY
      rm -rf "$$STABLE_ROOT/model" "$$STABLE_ROOT/metrics"
      mkdir -p "$$STABLE_ROOT/model" "$$STABLE_ROOT/metrics"
      cp -r "$$TEACHER_RUN/final_adapter/." "$$AMLT_OUTPUT_DIR/model/"
      cp -r "$$TEACHER_RUN/final_adapter/." "$$STABLE_ROOT/model/"
      cp "$$TEACHER_RUN/run_config.json" "$$AMLT_OUTPUT_DIR/metrics/run_config.json"
      cp "$$TEACHER_VIEWS/receipt.json" "$$AMLT_OUTPUT_DIR/metrics/teacher_view_receipt.json"
      cp "$$TEACHER_VIEWS/eval.jsonl" "$$AMLT_OUTPUT_DIR/metrics/teacher_eval.jsonl"
      cp "$$AMLT_OUTPUT_DIR/metrics/"* "$$STABLE_ROOT/metrics/"
      python - "$$STABLE_ROOT" "$$AMLT_OUTPUT_DIR/eval/t3/metrics.json" <<'PY'
      import hashlib,json,pathlib,sys
      root=pathlib.Path(sys.argv[1]); screen=pathlib.Path(sys.argv[2])
      def digest(path):
       h=hashlib.sha256()
       with open(path,'rb') as f:
        for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
       return h.hexdigest()
      receipt={'status':'screen_complete','stage':'state8_diagnosis_first_full_history_teacher_publish_v1',
       'adapter_sha256':digest(root/'model/adapter_model.safetensors'),
       'eval_sha256':digest(root/'metrics/teacher_eval.jsonl'),
       'screen_metrics_sha256':digest(screen),'teacher_history_visible':True,
       'student_history_visible_at_final_inference':False,
       'output_schema':'diagnosis_evidence_label_v1',
       'diagnosis_field_order':['diagnosis','evidence','label'],
       'canonical_label_role':'auxiliary_supervision_and_reporting',
       'train_rows':6476,'valid_rows':300,'eval_rows':1494,'screen_rows':75}
      (root/'metrics/publish_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
      pathlib.Path(__import__('os').environ['AMLT_OUTPUT_DIR']+'/metrics/publish_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
      PY
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
