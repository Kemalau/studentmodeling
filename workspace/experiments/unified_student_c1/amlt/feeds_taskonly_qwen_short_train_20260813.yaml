# Generated from `amlt template -t Feeds -f amlt/feeds_taskonly_qwen_short_train_20260813.yaml -y`.
description: One-epoch same-backbone task-only Qwen3-32B controls for public T3 and T5

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-taskonly-qwen-venv
    - /tmp/studentmodeling-taskonly-qwen-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-taskonly-qwen-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: /home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: qwen3-32b-taskonly-t3-full-oneepoch-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-taskonly-qwen-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache HF_HUB_CACHE=/tmp/hf_cache/hub HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export TRAIN_DATA=/mnt/amulet/studentmodeling/taskonly_qwen_public_t1_t5_v1/diagnose_misconception.jsonl
      export RUN_DIR=/mnt/amulet/studentmodeling/checkpoints/taskonly_qwen_t3_full_oneepoch_seed42_v1
      test "$$(sha256sum scripts/train_c1_lora.py | cut -d' ' -f1)" = 7c8b8b0a32ecf5695b7200f2c5b64fb0989598b88dff1da59da7cbfe7752d591
      test "$$(sha256sum scripts/copy_model_parallel.py | cut -d' ' -f1)" = 62b37ab70bc2ffc81c8314ca69215da7facdf18dba3f023d83096d1c3526ea4c
      test "$$(sha256sum "$$TRAIN_DATA" | cut -d' ' -f1)" = 7971db483e791236b179ac21b2f646383ced8427e87fb0fbf6f98473c37504ab
      test "$$(df --output=avail /tmp | tail -1)" -ge 125829120
      python scripts/copy_model_parallel.py --source /mnt/amulet/studentmodeling/models/Qwen3-32B --destination "$$LOCAL_MODEL" --workers 16
      test ! -e "$$RUN_DIR/completion.json"
      mkdir -p "$$RUN_DIR"
      python -u scripts/train_c1_lora.py \
        --model "$$LOCAL_MODEL" --train-jsonl "$$TRAIN_DATA" --output-dir "$$RUN_DIR" \
        --task-filter diagnose_misconception --max-length 1536 --max-train-samples 6776 \
        --max-steps -1 --num-train-epochs 1 \
        --per-device-train-batch-size 1 --gradient-accumulation-steps 4 \
        --learning-rate 1e-4 --lora-rank 8 --lora-alpha 16 --load-4bit \
        --state-token-alias '<|vision_pad|>' --supervise-eos \
        --logging-steps 20 --save-final-only --seed 42
      python - <<'PY'
      import hashlib,json,os,pathlib
      root=pathlib.Path(os.environ['RUN_DIR']); cfg=json.load(open(root/'run_config.json'))
      assert cfg['task_filter']=='diagnose_misconception' and cfg['num_train_epochs']==1.0,cfg
      assert cfg['max_train_samples']==6776 and cfg['max_steps']==-1,cfg
      path=root/'final_adapter/adapter_model.safetensors'; h=hashlib.sha256(path.read_bytes()).hexdigest()
      receipt={'status':'complete','task':'diagnose_misconception','train_rows':6776,'epochs':1,'global_batch':4,'adapter_sha256':h}
      (root/'completion.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
      print(json.dumps(receipt,sort_keys=True))
      PY
      cp -r "$$RUN_DIR/final_adapter/." "$$AMLT_OUTPUT_DIR/model/"
      cp "$$RUN_DIR/run_config.json" "$$RUN_DIR/completion.json" "$$AMLT_OUTPUT_DIR/"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml}

  - name: qwen3-32b-taskonly-t5-persistence-oneepoch-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-taskonly-qwen-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache HF_HUB_CACHE=/tmp/hf_cache/hub HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export TRAIN_DATA=/mnt/amulet/studentmodeling/taskonly_qwen_public_t1_t5_v1/predict_error_persistence.jsonl
      export RUN_DIR=/mnt/amulet/studentmodeling/checkpoints/taskonly_qwen_t5_persistence_oneepoch_seed42_v1
      test "$$(sha256sum scripts/train_c1_lora.py | cut -d' ' -f1)" = 7c8b8b0a32ecf5695b7200f2c5b64fb0989598b88dff1da59da7cbfe7752d591
      test "$$(sha256sum scripts/copy_model_parallel.py | cut -d' ' -f1)" = 62b37ab70bc2ffc81c8314ca69215da7facdf18dba3f023d83096d1c3526ea4c
      test "$$(sha256sum "$$TRAIN_DATA" | cut -d' ' -f1)" = 0db13b88287d5afc05a53b41f99d83f9e2a812904c4170dd4c168f90c512aa4d
      test "$$(df --output=avail /tmp | tail -1)" -ge 125829120
      python scripts/copy_model_parallel.py --source /mnt/amulet/studentmodeling/models/Qwen3-32B --destination "$$LOCAL_MODEL" --workers 16
      test ! -e "$$RUN_DIR/completion.json"
      mkdir -p "$$RUN_DIR"
      python -u scripts/train_c1_lora.py \
        --model "$$LOCAL_MODEL" --train-jsonl "$$TRAIN_DATA" --output-dir "$$RUN_DIR" \
        --task-filter predict_error_persistence --max-length 1536 --max-train-samples 8375 \
        --max-steps -1 --num-train-epochs 1 \
        --per-device-train-batch-size 1 --gradient-accumulation-steps 4 \
        --learning-rate 1e-4 --lora-rank 8 --lora-alpha 16 --load-4bit \
        --state-token-alias '<|vision_pad|>' --supervise-eos \
        --logging-steps 20 --save-final-only --seed 42
      python - <<'PY'
      import hashlib,json,os,pathlib
      root=pathlib.Path(os.environ['RUN_DIR']); cfg=json.load(open(root/'run_config.json'))
      assert cfg['task_filter']=='predict_error_persistence' and cfg['num_train_epochs']==1.0,cfg
      assert cfg['max_train_samples']==8375 and cfg['max_steps']==-1,cfg
      path=root/'final_adapter/adapter_model.safetensors'; h=hashlib.sha256(path.read_bytes()).hexdigest()
      receipt={'status':'complete','task':'predict_error_persistence','train_rows':8375,'epochs':1,'global_batch':4,'adapter_sha256':h}
      (root/'completion.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
      print(json.dumps(receipt,sort_keys=True))
      PY
      cp -r "$$RUN_DIR/final_adapter/." "$$AMLT_OUTPUT_DIR/model/"
      cp "$$RUN_DIR/run_config.json" "$$RUN_DIR/completion.json" "$$AMLT_OUTPUT_DIR/"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml}
