# Bounded four-rank preflight for the corrected distributed gradient-audit path.
description: Two-round distributed State8 ownership diagnostic after collective-order repair

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-profile-ownership-world4-diagnostic-venv
    - /tmp/studentmodeling-state8-profile-ownership-world4-diagnostic-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-profile-ownership-world4-diagnostic-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - .pytest_cache/
    - amlt/
    - data/
    - results/
    - reports/
    - state8_exact_scientific_rescue_bundle_20260808/
    - state8_midpoint_diagnosis_first_bundle_20260808/
    - strong1_rescue_bundle_20260808/
    - task_anchor_bundle_20260808/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-future-profile-ownership-seed8801-v3-world4-diagnostic
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_student_profile_readout.sh | cut -d' ' -f1)" = 3fd01b0a79a229ceb37dd48beeb468eb3d1a6ab4abdc4c7f4d408f5a18f4f445
      export PROFILE_READOUT_DISTRIBUTED_WORLD_SIZE=4
      export PROFILE_READOUT_GRADIENT_ACCUMULATION_STEPS=1
      export PROFILE_READOUT_DIAGNOSTIC_STOP_ROUND=2
      export PROFILE_READOUT_RUN_DIR=/mnt/amulet/studentmodeling/checkpoints/state8_future_profile_ownership_seed8801_v3_world4_diagnostic
      export PROFILE_READOUT_STABLE_DIR=/mnt/amulet/studentmodeling/diagnostics/state8_future_profile_ownership_seed8801_v3_world4_diagnostic
      bash scripts/run_state8_student_profile_readout.sh
    submit_args:
      max_attempts: 1
      max_run_duration_seconds: 14400
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-profile-ownership-world4-diagnostic-venv
