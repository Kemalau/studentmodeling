description: 'Same-question State8 exact-epoch final evaluation: 16 formal shards,
  three MalRule answer/diagnosis C4 seeds, and one frozen 150-pair Eedi C4'
target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
  - python -m venv --system-site-packages /tmp/studentmodeling-state8-final-eval-venv
  - /tmp/studentmodeling-state8-final-eval-venv/bin/python -m pip install --upgrade
    pip
  - /tmp/studentmodeling-state8-final-eval-venv/bin/python -m pip install -r requirements-feeds.txt
code:
  local_dir: $CONFIG_DIR/..
  ignore:
  - .git/
  - .vscode/
  - amlt/
  - data/
  - results/
  - __pycache__/
  - '*.pyc'
storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true
jobs:
- name: state8-final-formal-shard00
  sku: 80G1-A100
  process_count_per_node: 1
  mpi: false
  sla_tier: Standard
  command: 'set -euo pipefail

    trap ''rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc"
    "$${BASH_COMMAND}" >&2; exit "$$rc"'' ERR

    bash scripts/run_state8_eedi_same_question_final_formal_shard.sh

    '
  submit_args:
    max_attempts: 2
    max_run_duration_seconds: 259200
    env:
      _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
      VENV_ROOT: /tmp/studentmodeling-state8-final-eval-venv
      NUM_SHARDS: '16'
      SHARD_INDEX: '0'
      STATE8_FINAL_EVAL_RUN_DIR: /mnt/amulet/studentmodeling/checkpoints/state8_eedi_same_question_unified_canonical_v1_20260811
