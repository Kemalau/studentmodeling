# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
description: Four-microstep fail-closed memory and gradient gate for layerwise recurrent unified training

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-layerwise-train-venv
    - /tmp/studentmodeling-layerwise-train-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-layerwise-train-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: layerwise-training-memory-gradient-gate-seed42
    sku: 80G1-A100
    sla_tier: Standard
    mpi: false
    process_count_per_node: 1
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-layerwise-train-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export SOURCE_DATA=/mnt/amulet/studentmodeling/method_small_v1
      export C4_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean
      export UNIFIED_DATA=/tmp/layerwise_unified_n1200_u4_v1
      export CAUSAL_DATA=/tmp/layerwise_cf4_balanced_u4_v1
      export INIT_ADAPTER=/mnt/amulet/studentmodeling/checkpoints/state_curriculum_stage_a_cf1_alias_visionpad_seed42_20260727/final_adapter
      export RUN_DIR=/mnt/amulet/studentmodeling/diagnostics/layerwise_recurrent_training_gate_seed42_20260731
      mkdir -p "$$HF_HUB_CACHE" "$$UNIFIED_DATA" "$$CAUSAL_DATA" "$$RUN_DIR" "$$AMLT_OUTPUT_DIR/metrics"
      test "$$(df --output=avail /tmp | tail -1)" -ge 125829120
      test -f "$$SOURCE_DATA/train.jsonl"
      test -f "$$SOURCE_DATA/valid.jsonl"
      test -f "$$C4_DATA/train.jsonl"
      test -f "$$C4_DATA/val.jsonl"
      test -f "$$INIT_ADAPTER/adapter_model.safetensors"
      test "$$(sha256sum "$$SOURCE_DATA/train.jsonl" | cut -d' ' -f1)" = 3813a0044703569c850f09ba4d74eee7bfab1a774466843255bfafe791ef579f
      test "$$(sha256sum "$$SOURCE_DATA/valid.jsonl" | cut -d' ' -f1)" = 9d758302d3eef0320c5446993b063046fc7f1c6f3ecd417c0ffee1a572e832aa
      test "$$(sha256sum "$$C4_DATA/train.jsonl" | cut -d' ' -f1)" = 6fa5f4160e4a096db6228eb165136d927d0a72bae5a8e5dce9df5bda71a73dae
      test "$$(sha256sum "$$C4_DATA/val.jsonl" | cut -d' ' -f1)" = e928dbe191cf85a00b12a78b5b1e4bb8bd8800bd31a19d5310c4e263e3355d25
      test "$$(sha256sum scripts/train_recurrent_student_m4.py | cut -d' ' -f1)" = ab25b40f2b4e91582c9a3bd8bd784161f44aaa6ff5c7aa4c6d19da81693bac32
      test "$$(sha256sum scripts/train_recurrent_student_diagnostic.py | cut -d' ' -f1)" = c3ff9be2eb5dc0216f1be62bd8963901bad36ebe897f83c336fad1274fd64b09
      test "$$(sha256sum scripts/layerwise_recurrent_student_model.py | cut -d' ' -f1)" = 9be3e584cbeb1dc3f1fd7c683106edd547d1b3274934d551d011a4f43e3bcc54
      test "$$(sha256sum scripts/build_unified_recurrent_manifest.py | cut -d' ' -f1)" = 8bc822ec33165037dff8353707a037a0edc12679cd67b66885aa94a4288542f6
      test "$$(sha256sum scripts/audit_unified_recurrent_manifest.py | cut -d' ' -f1)" = 6de4fcab57aa8dbd0b56f07972e341f64b60668474f03069cc47878a80e434a0
      test "$$(sha256sum scripts/build_recurrent_causal_pairs.py | cut -d' ' -f1)" = 2daed709603a63a487705bce87539b58c7e01d239397758305d3b023f5eb26b7
      test "$$(sha256sum manifests/cf4_balanced_paired_state_swap_train_seed20260731_v1.json | cut -d' ' -f1)" = 4e7907cf4d74eced4f4c5c2dddf7213a2649cddca081fd2b4a51f35934b35773
      test "$$(sha256sum manifests/cf4_balanced_paired_state_swap_valid_seed20260801_v1.json | cut -d' ' -f1)" = 1a2f45ced0a123d40e1a9646035b07e3b31203567718e6de982cde24bc45def9
      python -m unittest discover -s tests -p 'test_train_recurrent_student_m4.py' -v
      python -m unittest discover -s tests -p 'test_recurrent_student_model.py' -v
      python -m unittest discover -s tests -p 'test_layerwise_recurrent_student_model.py' -v

      python scripts/build_unified_recurrent_manifest.py \
        --train-jsonl "$$SOURCE_DATA/train.jsonl" \
        --valid-jsonl "$$SOURCE_DATA/valid.jsonl" \
        --output-dir "$$UNIFIED_DATA" \
        --max-updates 4 --train-limit 1200 --valid-limit 300 --seed 20260730
      test "$$(sha256sum "$$UNIFIED_DATA/train.jsonl" | cut -d' ' -f1)" = eacd946140b8a3eda1ec6345bf0bef39007a0df08607f3c3e7b9fed7da3af711
      test "$$(sha256sum "$$UNIFIED_DATA/valid.jsonl" | cut -d' ' -f1)" = c1f3d63900979c70c4f9361282e6ac50048a0e66a80792da031400ae8c0e1c86
      python scripts/audit_unified_recurrent_manifest.py \
        --train-jsonl "$$UNIFIED_DATA/train.jsonl" \
        --valid-jsonl "$$UNIFIED_DATA/valid.jsonl" \
        --output-json "$$UNIFIED_DATA/audit.json"
      python - "$$UNIFIED_DATA/audit.json" <<'PY'
      import json, sys
      value = json.load(open(sys.argv[1], encoding='utf-8'))
      assert value['status'] == 'passed', value
      assert value['train']['rows'] == 1200 and value['valid']['rows'] == 300, value
      assert value['train']['decoder_history_leaks'] == 0, value
      PY

      python scripts/build_recurrent_causal_pairs.py \
        --train-source "$$C4_DATA/train.jsonl" \
        --valid-source "$$C4_DATA/val.jsonl" \
        --train-pairs manifests/cf4_balanced_paired_state_swap_train_seed20260731_v1.json \
        --valid-pairs manifests/cf4_balanced_paired_state_swap_valid_seed20260801_v1.json \
        --output-dir "$$CAUSAL_DATA" --max-updates 4
      test "$$(sha256sum "$$CAUSAL_DATA/train.jsonl" | cut -d' ' -f1)" = 30f68f54120e5a9ada0a37b1dba2b6480de0f8eaeac98d0b7ed7c627429f9766
      test "$$(sha256sum "$$CAUSAL_DATA/valid.jsonl" | cut -d' ' -f1)" = 8e038c3a60c2e1b420779cd54eb203b12ae5d51544c87a805fe19d47fdbe294e

      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total,memory.used --format=csv,noheader

      resume_args=()
      if [[ ! -f "$$RUN_DIR/completion.json" ]]; then
        mapfile -t checkpoints < <(find "$$RUN_DIR" -mindepth 1 -maxdepth 1 -type d -name 'checkpoint-*' | sort -V)
        for ((i=$${#checkpoints[@]}-1; i>=0; i--)); do
          candidate="$${checkpoints[$$i]}"
          if [[ -f "$$candidate/checkpoint_completion.json" && -f "$$candidate/recurrent_state.pt" && -f "$$candidate/adapter/adapter_model.safetensors" ]]; then
            resume_args=(--resume-from-checkpoint "$$candidate/recurrent_state.pt")
            break
          fi
        done
        python -u scripts/train_recurrent_student_m4.py \
          --model "$$LOCAL_MODEL" \
          --init-adapter "$$INIT_ADAPTER" \
          --state-architecture layerwise \
          --train-jsonl "$$UNIFIED_DATA/train.jsonl" \
          --valid-jsonl "$$UNIFIED_DATA/valid.jsonl" \
          --causal-train-jsonl "$$CAUSAL_DATA/train.jsonl" \
          --causal-valid-jsonl "$$CAUSAL_DATA/valid.jsonl" \
          --output-dir "$$RUN_DIR" \
          --state-token-alias '<|vision_pad|>' \
          --max-length 1536 --learning-rate 5e-6 \
          --generation-weight 1.0 --consistency-weight 0.25 --direct-replay-weight 0.25 \
          --causal-weight 1.0 --causal-margin 0.5 \
          --causal-preference-reduction sum --causal-objective-mode donor_directional \
          --gradient-accumulation-steps 1 --eval-limit 4 --causal-eval-limit 4 \
          --save-steps 4 --diagnostic-max-micro-steps 4 --seed 42 \
          "$${resume_args[@]}"
      fi
      test -f "$$RUN_DIR/completion.json"
      test -f "$$RUN_DIR/final_adapter/adapter_model.safetensors"
      test -f "$$RUN_DIR/recurrent_state.pt"
      python - "$$RUN_DIR" <<'PY'
      import json, pathlib, sys, torch
      root = pathlib.Path(sys.argv[1])
      completion = json.load(open(root / 'completion.json', encoding='utf-8'))
      config = json.load(open(root / 'run_config.json', encoding='utf-8'))
      gradient = json.load(open(root / 'gradient_audit.json', encoding='utf-8'))
      history = json.load(open(root / 'trainer_history.json', encoding='utf-8'))
      state = torch.load(root / 'recurrent_state.pt', map_location='cpu', weights_only=False)
      assert completion['status'] == 'diagnostic_complete', completion
      assert completion['micro_steps'] == 4 and completion['optimizer_steps'] == 4, completion
      assert completion['contains_causal_pair'] is True, completion
      assert config['state_architecture'] == 'layerwise', config
      assert config['causal_branch_dropout_mode'] == 'eval_deterministic', config
      assert state['config']['state_architecture'] == 'layerwise', state.keys()
      assert 'state_in_proj' not in state and 'state_out_proj' not in state, state.keys()
      assert gradient['lora']['gradient_abs_sum'] > 0, gradient
      assert max(float(row['peak_cuda_reserved_gib']) for row in history) < 79.0, history
      causal = [row for row in history if row.get('causal_pair_id')]
      assert causal and all(row['causal_backward_graph_max_views'] == 2 for row in causal), causal
      assert all(row['causal_dropout_mode'] == 'eval_deterministic' for row in causal), causal
      PY
      cp "$$RUN_DIR/completion.json" "$$AMLT_OUTPUT_DIR/metrics/completion.json"
      cp "$$RUN_DIR/run_config.json" "$$AMLT_OUTPUT_DIR/metrics/run_config.json"
      cp "$$RUN_DIR/gradient_audit.json" "$$AMLT_OUTPUT_DIR/metrics/gradient_audit.json"
      cp "$$RUN_DIR/trainer_history.json" "$$AMLT_OUTPUT_DIR/metrics/trainer_history.json"
      cp "$$RUN_DIR/validation_metrics.json" "$$AMLT_OUTPUT_DIR/metrics/validation_metrics.json"
      cp "$$RUN_DIR/causal_validation_metrics.json" "$$AMLT_OUTPUT_DIR/metrics/causal_validation_metrics.json"
      cp "$$UNIFIED_DATA/audit.json" "$$AMLT_OUTPUT_DIR/metrics/data_audit.json"
      printf '%s\n' \
        'stage=layerwise_training_memory_gradient_gate' \
        'raw_history_visible_to_decoder=false' \
        'persistent_history_kv_cache=false' \
        'state_architecture=one_address_layerwise_residual_trajectory' \
        'remote_run_dir=/mnt/amulet/studentmodeling/diagnostics/layerwise_recurrent_training_gate_seed42_20260731' \
        > "$$AMLT_OUTPUT_DIR/metrics/scope.txt"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
