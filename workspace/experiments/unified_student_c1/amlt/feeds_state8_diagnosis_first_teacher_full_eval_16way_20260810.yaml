# Generated with `amlt template -t Feeds -y`, then specialized for sixteen
# deterministic shards of the frozen diagnosis-first Teacher panel.
description: Full 1494-row semantic evaluation of diagnosis-first full-history Teacher

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-diagnosis-first-teacher-full-eval-venv
    - /tmp/studentmodeling-diagnosis-first-teacher-full-eval-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-diagnosis-first-teacher-full-eval-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - &base
    name: state8-diagnosis-first-teacher-full-eval-shard00
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &command |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      export PATH="/tmp/studentmodeling-diagnosis-first-teacher-full-eval-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export TEACHER=/mnt/amulet/studentmodeling/diagnostics/state8_diagnosis_first_full_history_teacher_v1
      export EVAL="$$TEACHER/metrics/teacher_eval.jsonl"
      export EXACT_EVAL=/tmp/state8_diagnosis_first_teacher_full_eval_exact.jsonl
      export OUT="$$AMLT_OUTPUT_DIR/eval/t3"
      : "$${SHARD_INDEX:?SHARD_INDEX is required}"
      mkdir -p "$$HF_HUB_CACHE" "$$OUT"
      for path in "$$TEACHER/model/adapter_model.safetensors" \
        "$$TEACHER/model/adapter_config.json" "$$EVAL" \
        "$$TEACHER/metrics/publish_receipt.json"; do test -f "$$path"; done
      test "$$(df --output=avail /tmp | tail -1)" -ge 83886080
      python - "$$TEACHER" <<'PY'
      import hashlib,json,pathlib,sys
      root=pathlib.Path(sys.argv[1]); r=json.load(open(root/'metrics/publish_receipt.json'))
      def digest(path):
       h=hashlib.sha256()
       with open(path,'rb') as f:
        for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
       return h.hexdigest()
      assert r['status']=='complete' and r['stage']=='state8_diagnosis_first_full_history_teacher_publish_v1',r
      assert r['semantic_teacher_gate_pass'] is True,r
      assert r['output_schema']=='diagnosis_evidence_label_v1',r
      assert r['diagnosis_field_order']==['diagnosis','evidence','label'],r
      assert r['canonical_label_role']=='auxiliary_supervision_and_reporting',r
      assert r['train_rows']==6476 and r['valid_rows']==300 and r['eval_rows']==1494,r
      assert r['adapter_sha256']==digest(root/'model/adapter_model.safetensors'),r
      assert r['eval_sha256']==digest(root/'metrics/teacher_eval.jsonl'),r
      PY
      test "$$(sha256sum scripts/evaluate_formal_protocols.py | cut -d' ' -f1)" = b347ed4d2228725a325975c0ffab162ca32a2e0252583de841c00b3ab1e196de
      test "$$(sha256sum scripts/add_state8_teacher_markers.py | cut -d' ' -f1)" = 15b418c5a34058658c25ec1083da04801cc906cd577541cfb59f01e2bc343f51
      test "$$(sha256sum scripts/copy_model_parallel.py | cut -d' ' -f1)" = 62b37ab70bc2ffc81c8314ca69215da7facdf18dba3f023d83096d1c3526ea4c
      python -m pytest -q tests/test_evaluate_formal_protocols.py tests/test_t3_judge_utils.py
      rm -rf "$$LOCAL_MODEL"; mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" --workers 16
      python scripts/add_state8_teacher_markers.py \
        --input-jsonl "$$EVAL" --output-jsonl "$$EXACT_EVAL"
      nvidia-smi --query-gpu=index,name,memory.total,memory.used --format=csv,noheader
      python -u scripts/evaluate_formal_protocols.py \
        --model "$$LOCAL_MODEL" --adapter "$$TEACHER/model" \
        --eval-jsonl "$$EXACT_EVAL" --output-dir "$$OUT" \
        --max-length 1536 --max-new-tokens 256 --generation-batch-size 1 \
        --tasks diagnose_misconception --sources eedi_mining malrule \
        --shard-index "$$SHARD_INDEX" --num-shards 16 --seed 66 \
        --save-unredacted-predictions
      python - "$$OUT/metrics.json" "$$EXACT_EVAL.receipt.json" "$$TEACHER" "$$SHARD_INDEX" <<'PY'
      import json,sys
      m=json.load(open(sys.argv[1])); v=json.load(open(sys.argv[2])); r=json.load(open(sys.argv[3]+'/metrics/publish_receipt.json')); i=int(sys.argv[4])
      assert m['artifact_sha256']=={'adapter_model':r['adapter_sha256'],'evaluation_input':v['output_sha256']},(m,r,v)
      assert m['unsharded_filtered_rows']==1494,m
      assert m['evaluation_shard']=={'index':i,'count':16},m
      assert m['sampled_rows'] in {93,94} and m['generation_rows']==m['sampled_rows'],m
      assert m['classification_rows']==0 and m['max_samples_per_group'] is None,m
      assert m['max_length']==1536 and m['max_new_tokens']==256,m
      assert v['rows']==1494 and v['constant_marker_count']==8,v
      assert v['marker_contains_sample_information'] is False,v
      PY
      cp "$$EXACT_EVAL.receipt.json" "$$OUT/exact_path_receipt.json"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 43200
      env: &env00
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        SHARD_INDEX: '0'

  - <<: *base
    name: state8-diagnosis-first-teacher-full-eval-shard01
    command: *command
    submit_args: {max_attempts: 2, max_run_duration_seconds: 43200, env: {_AZUREML_SINGULARITY_JOB_UAI: rankfun_aml, SHARD_INDEX: '1'}}
  - <<: *base
