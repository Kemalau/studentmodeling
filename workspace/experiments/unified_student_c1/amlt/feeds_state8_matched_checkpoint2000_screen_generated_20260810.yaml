# Generated with `amlt template -t Feeds -n 6 -y`, then specialized.  The
# watcher replaces only the three HASH_* placeholders after reading the atomic
# checkpoint receipt, and validates the rendered config before submission.
description: Matched State8 checkpoint-2000 T3, answer C4, and five diagnosis C4 shards
target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-matched-checkpoint-screen-venv
    - /tmp/studentmodeling-state8-matched-checkpoint-screen-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-matched-checkpoint-screen-venv/bin/python -m pip install -r requirements-feeds.txt
code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']
storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true
jobs:
  - name: state8-matched-checkpoint2000-t3
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_matched_checkpoint_t3.sh | cut -d' ' -f1)" = 040defd83a31512cc820f9944c474153d490740adfb84ac5f2035c1fe09c07c9
      bash scripts/run_state8_matched_checkpoint_t3.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env: &common_env
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        STATE8_MATCHED_CHECKPOINT_ROOT: /mnt/amulet/studentmodeling/checkpoints/state8_qualified_teacher_curriculum_seed42_exact5000_rounds1250_kd1_v2_20260805_taxonomy_semantic_v1_diagnosis_first_matched_teacher_seed67_single_ga4/checkpoint-2000
        STATE8_MATCHED_CHECKPOINT_STEP: '2000'
        STATE8_MATCHED_ADAPTER_SHA256: '95a36705a12a166be19db4134000546beb7e6dda9caf22670cc1a9f7d9844c73'
        STATE8_MATCHED_STATE_SHA256: '48af05a9e162c8beabc838548887f2c8bb6136297d4ad5d64899492f1ab2414b'
        MATCHED_CHECKPOINT_RECEIPT_SHA256: 'c9f2f035f09615a7203b405769314cb70636285cfd682986ffd8bdbc117d7e49'
  - name: state8-matched-checkpoint2000-answer-c4
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_matched_checkpoint_answer_c4.sh | cut -d' ' -f1)" = f2c2c19dcaf182b0b4b4fb1586647b403bdd432b769bd22baebc05fd93c4fa16
      bash scripts/run_state8_matched_checkpoint_answer_c4.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env: *common_env
  - name: state8-matched-checkpoint2000-diagnosis-c4-shard00
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &diagnosis_command |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_matched_checkpoint_diagnosis_c4_shard.sh | cut -d' ' -f1)" = e3e5b637bbcbddd21e1850aed2e60458a60fd6d86ebfda2ac6bdfa9a920bf202
      bash scripts/run_state8_matched_checkpoint_diagnosis_c4_shard.sh
    submit_args: &diagnosis_submit
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        <<: *common_env
        PAIR_START: '0'
        PAIR_COUNT: '10'
  - name: state8-matched-checkpoint2000-diagnosis-c4-shard10
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: *diagnosis_command
    submit_args:
      <<: *diagnosis_submit
      env:
        <<: *common_env
        PAIR_START: '10'
        PAIR_COUNT: '10'
  - name: state8-matched-checkpoint2000-diagnosis-c4-shard20
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: *diagnosis_command
    submit_args:
      <<: *diagnosis_submit
      env:
        <<: *common_env
        PAIR_START: '20'
        PAIR_COUNT: '10'
  - name: state8-matched-checkpoint2000-diagnosis-c4-shard30
    sku: 80G1-A100
