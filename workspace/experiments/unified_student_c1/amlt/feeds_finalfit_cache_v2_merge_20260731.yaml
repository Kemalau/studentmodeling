# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
# ^ Update with: amlt schema add <file>  |  VS Code: Run Task > amlt
# Amulet config file. Docs: https://amulet-docs.azurewebsites.net/config_file.html
# Fill in all <placeholder> values before submitting.
description: Merge and verify the 16 completed remote teacher-cache partitions without recomputing model forwards

target:
  service: manifold  # run "amlt target list manifold" to see available targets
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

# REQUIRED: Docker environment
# Manifold jobs authenticate to Azure (storage, ACR) via a User-Assigned
# Managed Identity, auto-detected from the workspace in most cases. Only set
# _AZUREML_SINGULARITY_JOB_UAI in 'env' below if auto-detection is ambiguous
# (multiple non-primary identities); run 'amlt run' to see the available list.
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258

# REQUIRED: code to run. Set local_dir to your code directory — it must
# exist and be non-empty. $CONFIG_DIR = directory of this file; the default
# $CONFIG_DIR/src means: put your code in a 'src' folder next to this file.
code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

# REQUIRED: Jobs to run. SKU examples: C1 (1 CPU), G1 (1 GPU), G4 (4 GPUs), G8-V100 (8 V100s)
# Commands run from the uploaded code directory (code.local_dir).
# 'command' is a shell script block (|): one line per step, e.g. python train.py --lr 0.01
# Write outputs to $AMLT_OUTPUT_DIR for retrieval with 'amlt results'.
# Use $$VAR to pass env vars literally ($VAR is interpolated at submission time).
jobs:
  - name: finalfit-cache-v2-merge-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      export CACHE_ROOT=/mnt/amulet/studentmodeling/world_model_v1/final_fit/cache_full259845_top256_seed42_v2_16way
      mkdir -p "$$AMLT_OUTPUT_DIR/metrics"
      test "$$(sha256sum scripts/merge_teacher_cache_partitions.py | cut -d' ' -f1)" = 8bd00421608fe2c31df67ce624d2452183461877f9aa07a1e85d8552bd72c468
      test "$$(find "$$CACHE_ROOT" -mindepth 1 -maxdepth 1 -type d -name 'rank-*' | wc -l)" = 16
      python scripts/merge_teacher_cache_partitions.py \
        --parts-root "$$CACHE_ROOT" \
        --output-dir "$$CACHE_ROOT" \
        --expected-rows 259845 \
        > "$$AMLT_OUTPUT_DIR/metrics/merge_receipt.json"
      python - "$$CACHE_ROOT/manifest.json" "$$CACHE_ROOT/integrity.json" <<'PY' \
        > "$$AMLT_OUTPUT_DIR/metrics/final_verification.json"
      import json, sys
      manifest = json.load(open(sys.argv[1], encoding='utf-8'))
      integrity = json.load(open(sys.argv[2], encoding='utf-8'))
      assert manifest['status'] == 'complete' and manifest['rows'] == 259845, manifest
      assert manifest['partition_count'] == 16, manifest
      assert manifest['source_sha256'] == '9961f746cb17e6c314e182d3453b6157022fb48b8de44d2e68bc8e87a1131ccd', manifest
      assert manifest['order_seed'] == 42 and manifest['top_k'] == 256, manifest
      assert manifest['shard_size'] == 512 and manifest['state_token_alias'] == '<|vision_pad|>', manifest
      assert manifest['batch_size'] == 1 and manifest['attn_implementation'] == 'eager', manifest
      assert len(manifest['partition_manifests']) == 16, manifest
      assert integrity['status'] == 'verified' and integrity['rows'] == 259845, integrity
      print(json.dumps({'status': 'verified', 'rows': integrity['rows'], 'shards': len(integrity['shards'])}, indent=2))
      PY
      cp "$$CACHE_ROOT/manifest.json" "$$AMLT_OUTPUT_DIR/metrics/manifest.json"
      cp "$$CACHE_ROOT/integrity.json" "$$AMLT_OUTPUT_DIR/metrics/integrity.json"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 14400
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
