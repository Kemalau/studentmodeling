# Generated with `amlt template -t Feeds -y`, then specialized from the
# validated taxonomy-aware curriculum as the balanced task-retention arm.
description: Balanced eight-token taxonomy-aware teacher-to-state curriculum

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-taxonomy-curriculum-venv
    - /tmp/studentmodeling-state8-taxonomy-curriculum-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-taxonomy-curriculum-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-taxonomy-balanced-curriculum-seed43
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      bash scripts/run_state8_qualified_teacher_curriculum.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-taxonomy-curriculum-venv
        STATE8_REPLAY_VARIANT: balanced
        STATE8_KD_VARIANT: base
        STATE8_CURRICULUM_NAMESPACE: taxonomy_semantic_v1
        TRAIN_ENTRYPOINT: scripts/train_state8_taxonomy_teacher_curriculum.py
        FORMAL_EVALUATOR: scripts/evaluate_recurrent_formal_protocols_taxonomy.py
        STATE8_CURRICULUM_LABEL_WEIGHT: '4.0'
        STATE8_SAVE_STEPS: '5'
        TRAIN_SEED: '43'
