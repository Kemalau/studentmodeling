# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
description: Exact CF1 plus vision-pad training-seed-97 rerun with preserved trainer history and frozen C4 gate

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-c4-seed97-rerun-venv
    - /tmp/studentmodeling-c4-seed97-rerun-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-c4-seed97-rerun-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: /tmp/c4_seed97_frozen_code/amlt-code/22a964712e7de283d440de4c5bcd5fea48344a714de6e8066139f403f57fa1dd
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: c4-cf1-visionpad-trainseed97-rerun-recovery6
    sku: 80G1-A100
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-c4-seed97-rerun-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error

      export LOCAL_MODEL=/tmp/Qwen3-32B
      export FROZEN_CODE="$$AMLT_CODE_DIR"
      export TRAIN_DATA=/mnt/amulet/studentmodeling/state_curriculum_stage_a_v1/train.jsonl
      export VALID_DATA=/mnt/amulet/studentmodeling/state_curriculum_stage_a_v1/valid.jsonl
      export C4_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean
      export PAIR_MANIFEST="$$AMLT_CODE_DIR/manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json"
      export RUN_DIR=/mnt/amulet/studentmodeling/checkpoints/c4_cf1_visionpad_trainseed97_rerun_recovery6_20260824

      test -f "$$TRAIN_DATA"
      test -f "$$VALID_DATA"
      test -f "$$C4_DATA/test_same_template.jsonl"
      test -f "$$C4_DATA/test_cross_template.jsonl"
      test -f "$$PAIR_MANIFEST"
      test -f "$$FROZEN_CODE/scripts/train_c1_lora.py"
      test "$$(sha256sum "$$FROZEN_CODE/scripts/train_c1_lora.py" | cut -d' ' -f1)" = 4e7e633263539b0a46aaa5172a71e921d418c448f89d67ef1fc671044244b6a7
      test "$$(sha256sum "$$FROZEN_CODE/scripts/evaluate_c1.py" | cut -d' ' -f1)" = 3aeb9e7d0a3a699812d799b1d7c70ab1f5564464dcda73943e4e6935dde2ec2f
      test "$$(sha256sum "$$FROZEN_CODE/scripts/probe_student_state_smoke.py" | cut -d' ' -f1)" = 0bc5d9cd9d475e28651a799763a745e2ece4b4b300a412924cbd19964cb66ded
      test "$$(sha256sum "$$FROZEN_CODE/scripts/state_swap_misconception_smoke.py" | cut -d' ' -f1)" = 4a40feb18cf012fd83bfc29c59472724451e3eac5e5711af9fc55768d749fa49
      test "$$(sha256sum "$$FROZEN_CODE/scripts/summarize_stage_a_gate.py" | cut -d' ' -f1)" = 797e8c3c73805fa320f0adb384320cd21fd038c1c331c274e0d2a82a20a33d95
      test "$$(sha256sum "$$TRAIN_DATA" | cut -d' ' -f1)" = 929487329576607572aa49b8e2daba53605b3c733749e7e631baa376a9df65f9
      test "$$(sha256sum "$$VALID_DATA" | cut -d' ' -f1)" = 4bf7117db760bcaba9790b8f7901ae89428911359f2b483f08aef39dc1fe6a36
      test "$$(sha256sum "$$C4_DATA/test_same_template.jsonl" | cut -d' ' -f1)" = 079f7634cc54dfd55dfc234503bb5925ab734b1ca74aa2f2a9a17cc4375a2c2f
      test "$$(sha256sum "$$C4_DATA/test_cross_template.jsonl" | cut -d' ' -f1)" = 405446c371185d23f06b4a0530c8ef4da4d1ac9addb696180f83bdf092402779
      test "$$(sha256sum "$$PAIR_MANIFEST" | cut -d' ' -f1)" = edcdb934a65252557f6c569eea9ef7a85e5445549deac9fb4829c3f579e1a9b8

      mkdir -p "$$HF_HUB_CACHE" "$$AMLT_OUTPUT_DIR/model" "$$AMLT_OUTPUT_DIR/gate" "$$AMLT_OUTPUT_DIR/audit"
      if [[ -e "$$RUN_DIR" ]]; then
        echo "Refusing to reuse existing rerun directory: $$RUN_DIR" >&2
        exit 3
      fi
      mkdir -p "$$RUN_DIR"

      {
        echo 'condition=cf1'
        echo 'token_name=visionpad'
        echo 'state_token_alias=<|vision_pad|>'
        echo 'train_seed=97'
        echo 'max_steps=1500'
        echo 'learning_rate=1e-4'
        echo 'logging_steps=20'
        echo 'eval_steps=750'
        echo 'save_steps=250'
        sha256sum "$$TRAIN_DATA" "$$VALID_DATA" "$$C4_DATA/test_same_template.jsonl" \
          "$$C4_DATA/test_cross_template.jsonl" "$$PAIR_MANIFEST" \
          "$$FROZEN_CODE/scripts/train_c1_lora.py"
      } | tee "$$AMLT_OUTPUT_DIR/audit/input_manifest.txt"

      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python "$$FROZEN_CODE/scripts/copy_model_parallel.py" \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" \
        --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader

      (
        while true; do
          for step in 250 500 750 1000 1250 1500; do
            source="$$RUN_DIR/checkpoint-$$step/trainer_state.json"
            target="$$AMLT_OUTPUT_DIR/audit/trainer_state_step$$step.json"
            if [[ -f "$$source" && ! -f "$$target" ]]; then
              cp "$$source" "$$target"
            fi
          done
          sleep 15
        done
      ) &
      watcher_pid=$$!

      set +e
      python -u "$$FROZEN_CODE/scripts/train_c1_lora.py" \
        --model "$$LOCAL_MODEL" \
        --train-jsonl "$$TRAIN_DATA" \
        --valid-jsonl "$$VALID_DATA" \
        --output-dir "$$RUN_DIR" \
        --max-length 1536 \
        --max-train-samples 6000 \
        --max-valid-samples 600 \
        --max-steps 1500 \
        --per-device-train-batch-size 1 \
        --per-device-eval-batch-size 1 \
        --gradient-accumulation-steps 4 \
        --learning-rate 1e-4 \
        --lora-rank 8 \
        --lora-alpha 16 \
        --load-4bit \
        --state-token-alias '<|vision_pad|>' \
        --bottleneck-mask \
        --bottleneck-style late_fusion \
        --supervise-eos \
        --logging-steps 20 \
        --eval-steps 750 \
        --save-steps 250 \
        --seed 97 \
        2>&1 | tee "$$AMLT_OUTPUT_DIR/audit/train.log"
      train_rc=$${PIPESTATUS[0]}
      set -e
      kill "$$watcher_pid" 2>/dev/null || true
      wait "$$watcher_pid" 2>/dev/null || true
      test "$$train_rc" -eq 0

      test -f "$$RUN_DIR/final_adapter/adapter_model.safetensors"
      cp -r "$$RUN_DIR/final_adapter/." "$$AMLT_OUTPUT_DIR/model/"
      cp "$$RUN_DIR/run_config.json" "$$AMLT_OUTPUT_DIR/model/run_config.json"
      for step in 250 500 750 1000 1250 1500; do
        test -f "$$AMLT_OUTPUT_DIR/audit/trainer_state_step$$step.json"
      done

      python -u "$$FROZEN_CODE/scripts/evaluate_c1.py" \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --train-jsonl "$$C4_DATA/train.jsonl" \
        --eval-jsonl "$$C4_DATA/test_same_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/response_same_masked.json" \
        --tasks malrule_next_response \
        --max-samples-per-task 300 \
        --max-length 1536 \
        --batch-size 2 \
        --bottleneck-mask \
        --bottleneck-style late_fusion \
        --state-token-alias '<|vision_pad|>' \
        --load-4bit \
        --progress-every 50

      python -u "$$FROZEN_CODE/scripts/evaluate_c1.py" \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --train-jsonl "$$C4_DATA/train.jsonl" \
        --eval-jsonl "$$C4_DATA/test_cross_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/response_cross_masked.json" \
        --tasks malrule_next_response \
        --max-samples-per-task 300 \
        --max-length 1536 \
        --batch-size 2 \
        --bottleneck-mask \
        --bottleneck-style late_fusion \
        --state-token-alias '<|vision_pad|>' \
        --load-4bit \
        --progress-every 50

      python -u "$$FROZEN_CODE/scripts/probe_student_state_smoke.py" \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --train-jsonl "$$C4_DATA/train.jsonl" \
        --same-jsonl "$$C4_DATA/test_same_template.jsonl" \
        --cross-jsonl "$$C4_DATA/test_cross_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/state_probe_masked.json" \
        --task malrule_next_response \
        --layers 0,8,16,24,32,40,48,56,63 \
        --train-per-label 50 \
        --eval-per-label 15 \
        --max-length 1536 \
        --batch-size 2 \
        --epochs 250 \
        --lr 0.1 \
        --weight-decay 1e-4 \
        --seed 42 \
        --state-token-alias '<|vision_pad|>' \
        --bottleneck-mask \
        --bottleneck-style late_fusion

      python -u "$$FROZEN_CODE/scripts/state_swap_misconception_smoke.py" \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --jsonl "$$C4_DATA/test_same_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/state_swap_masked.json" \
        --task malrule_next_response \
        --swap-target response \
        --layers all \
        --num-pairs 150 \
        --pair-manifest "$$PAIR_MANIFEST" \
        --max-length 1536 \
        --seed 42 \
        --state-token-alias '<|vision_pad|>' \
        --bottleneck-mask \
        --bottleneck-style late_fusion

      python -u "$$FROZEN_CODE/scripts/summarize_stage_a_gate.py" \
        --gate-dir "$$AMLT_OUTPUT_DIR/gate" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/gate_summary.json"

      cp "$$AMLT_OUTPUT_DIR/gate/gate_summary.json" "$$RUN_DIR/gate_summary.json"
      sha256sum "$$AMLT_OUTPUT_DIR/model/adapter_model.safetensors" \
        "$$AMLT_OUTPUT_DIR/gate/gate_summary.json" \
        "$$AMLT_OUTPUT_DIR/audit/trainer_state_step1500.json" \
        | tee "$$AMLT_OUTPUT_DIR/audit/output_manifest.txt"
    submit_args:
      max_attempts: 1
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
