# Generated from `amlt template -t Feeds -y`, then specialized for the
# query-aligned diagnosis-first full-history-teacher -> State8 curriculum.
description: Query-aligned diagnosis-first teacher to State8 with final Eedi C4

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-eedi-current-query-curriculum-venv
    - /tmp/studentmodeling-state8-eedi-current-query-curriculum-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-eedi-current-query-curriculum-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-diagnosis-first-eedi-current-query-curriculum-seed83
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_diagnosis_first_eedi_current_query_curriculum.sh | cut -d' ' -f1)" = 6670d9d77852cb79de96736966532832d178f9c013c86ed0061de14ce772e737
      test "$$(sha256sum scripts/train_state8_diagnosis_first_eedi_current_query_curriculum.py | cut -d' ' -f1)" = 6c998b5dbffc515e239599f51c8949d5e8b9e0609caa82a887290e5a52087e8e
      bash scripts/run_state8_diagnosis_first_eedi_current_query_curriculum.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-eedi-current-query-curriculum-venv
