# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
description: Matched control versus explicit paired state-swap loss with a cloned formal student-state token and fixed C4 gate

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-paired-swap-venv
    - /tmp/studentmodeling-paired-swap-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-paired-swap-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: paired-state-control-seed42
    sku: 80G1-A100
    sla_tier: Standard
    command: &run_command |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-paired-swap-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export BASE_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean
      export NORMAL_DATA=/mnt/amulet/studentmodeling/state_curriculum_stage_a_v1
      export TRAIN_PAIRS="$$AMLT_CODE_DIR/manifests/cf_paired_state_swap_train_seed20260730_v1.json"
      export VALID_PAIRS="$$AMLT_CODE_DIR/manifests/cf_paired_state_swap_valid_seed20260731_v1.json"
      export C4_PAIRS="$$AMLT_CODE_DIR/manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json"
      export RUN_DIR="/mnt/amulet/studentmodeling/checkpoints/paired_state_swap_$${ARM}_seed42_20260730"
      mkdir -p "$$HF_HUB_CACHE" "$$RUN_DIR" "$$AMLT_OUTPUT_DIR/model" "$$AMLT_OUTPUT_DIR/gate"

      available_kb=$$(df --output=avail /tmp | tail -1)
      test "$$available_kb" -ge 125829120
      test -f "$$BASE_DATA/train.jsonl"
      test -f "$$BASE_DATA/val.jsonl"
      test -f "$$BASE_DATA/test_same_template.jsonl"
      test -f "$$BASE_DATA/test_cross_template.jsonl"
      test -f "$$NORMAL_DATA/train.jsonl"
      test -f "$$NORMAL_DATA/valid.jsonl"
      test -f "$$TRAIN_PAIRS"
      test -f "$$VALID_PAIRS"
      test -f "$$C4_PAIRS"
      test "$$(sha256sum "$$BASE_DATA/train.jsonl" | cut -d' ' -f1)" = 6fa5f4160e4a096db6228eb165136d927d0a72bae5a8e5dce9df5bda71a73dae
      test "$$(sha256sum "$$BASE_DATA/val.jsonl" | cut -d' ' -f1)" = e928dbe191cf85a00b12a78b5b1e4bb8bd8800bd31a19d5310c4e263e3355d25
      test "$$(sha256sum "$$BASE_DATA/test_same_template.jsonl" | cut -d' ' -f1)" = 079f7634cc54dfd55dfc234503bb5925ab734b1ca74aa2f2a9a17cc4375a2c2f
      test "$$(sha256sum "$$BASE_DATA/test_cross_template.jsonl" | cut -d' ' -f1)" = 405446c371185d23f06b4a0530c8ef4da4d1ac9addb696180f83bdf092402779
      test "$$(sha256sum "$$NORMAL_DATA/train.jsonl" | cut -d' ' -f1)" = 929487329576607572aa49b8e2daba53605b3c733749e7e631baa376a9df65f9
      test "$$(sha256sum "$$NORMAL_DATA/valid.jsonl" | cut -d' ' -f1)" = 4bf7117db760bcaba9790b8f7901ae89428911359f2b483f08aef39dc1fe6a36
      test "$$(sha256sum "$$TRAIN_PAIRS" | cut -d' ' -f1)" = b462367581a9989ef8f8172af44eb126f8b165ac0195e3c1074d1449eef64ee6
      test "$$(sha256sum "$$VALID_PAIRS" | cut -d' ' -f1)" = 263a3765add1ff667214e7cd86bd5e7fc50709eee05e88cb5486c2c897dea4c4
      test "$$(sha256sum "$$C4_PAIRS" | cut -d' ' -f1)" = edcdb934a65252557f6c569eea9ef7a85e5445549deac9fb4829c3f579e1a9b8
      test "$$(sha256sum scripts/train_c1_paired_state_swap.py | cut -d' ' -f1)" = 3fa8b1a29c4d782d4bbda48bbc44ea7751af8efded19414b870df66fc2e779e5
      {
        echo "arm=$$ARM"
        echo "seed=42"
        echo "state_token=<STUDENT_STATE>"
        echo "state_token_init=<|vision_pad|>"
        echo "max_steps=750"
        sha256sum scripts/train_c1_paired_state_swap.py scripts/train_c1_lora.py \
          "$$BASE_DATA/train.jsonl" "$$BASE_DATA/val.jsonl" \
          "$$NORMAL_DATA/train.jsonl" "$$NORMAL_DATA/valid.jsonl" \
          "$$TRAIN_PAIRS" "$$VALID_PAIRS" "$$C4_PAIRS"
      } | tee "$$AMLT_OUTPUT_DIR/input_manifest.txt"

      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" \
        --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader

      if [[ ! -f "$$RUN_DIR/final_adapter/adapter_model.safetensors" ]]; then
        python -u scripts/train_c1_paired_state_swap.py \
          --model "$$LOCAL_MODEL" \
          --base-jsonl "$$BASE_DATA/train.jsonl" \
          --normal-jsonl "$$NORMAL_DATA/train.jsonl" \
          --pair-manifest "$$TRAIN_PAIRS" \
          --valid-base-jsonl "$$BASE_DATA/val.jsonl" \
          --valid-normal-jsonl "$$NORMAL_DATA/valid.jsonl" \
          --valid-pair-manifest "$$VALID_PAIRS" \
          --output-dir "$$RUN_DIR" \
          --arm "$$ARM" \
          --max-length 768 \
          --max-steps 750 \
          --gradient-accumulation-steps 4 \
          --learning-rate 1e-4 \
          --lora-rank 8 \
          --lora-alpha 16 \
          --state-token '<STUDENT_STATE>' \
          --init-state-token-from '<|vision_pad|>' \
          --bottleneck-style late_fusion \
          --logging-steps 10 \
          --eval-steps 750 \
          --save-steps 250 \
          --save-total-limit 4 \
          --seed 42
      fi
      test -f "$$RUN_DIR/final_adapter/adapter_model.safetensors"
      cp -r "$$RUN_DIR/final_adapter/." "$$AMLT_OUTPUT_DIR/model/"
      cp "$$RUN_DIR/run_config.json" "$$AMLT_OUTPUT_DIR/model/run_config.json"

      python -u scripts/evaluate_c1.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --train-jsonl "$$BASE_DATA/train.jsonl" \
        --eval-jsonl "$$BASE_DATA/test_same_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/response_same_masked.json" \
        --tasks malrule_next_response \
        --max-samples-per-task 300 \
        --max-length 768 \
        --batch-size 2 \
        --bottleneck-mask \
        --bottleneck-style late_fusion \
        --load-4bit \
        --progress-every 50

      python -u scripts/evaluate_c1.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --train-jsonl "$$BASE_DATA/train.jsonl" \
        --eval-jsonl "$$BASE_DATA/test_cross_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/response_cross_masked.json" \
        --tasks malrule_next_response \
        --max-samples-per-task 300 \
        --max-length 768 \
        --batch-size 2 \
        --bottleneck-mask \
        --bottleneck-style late_fusion \
        --load-4bit \
        --progress-every 50

      python -u scripts/probe_student_state_smoke.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --train-jsonl "$$BASE_DATA/train.jsonl" \
        --same-jsonl "$$BASE_DATA/test_same_template.jsonl" \
        --cross-jsonl "$$BASE_DATA/test_cross_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/state_probe_masked.json" \
        --task malrule_next_response \
        --layers 0,8,16,24,32,40,48,56,63 \
        --train-per-label 50 \
        --eval-per-label 15 \
        --max-length 768 \
        --batch-size 2 \
        --epochs 250 \
        --lr 0.1 \
        --weight-decay 1e-4 \
        --seed 42 \
        --bottleneck-mask \
        --bottleneck-style late_fusion

      python -u scripts/state_swap_misconception_smoke.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --jsonl "$$BASE_DATA/test_same_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/state_swap_masked.json" \
        --task malrule_next_response \
        --swap-target response \
        --layers all \
        --num-pairs 150 \
        --pair-manifest "$$C4_PAIRS" \
        --max-length 768 \
        --seed 42 \
        --bottleneck-mask \
        --bottleneck-style late_fusion

      python scripts/summarize_stage_a_gate.py \
        --gate-dir "$$AMLT_OUTPUT_DIR/gate" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/gate_summary.json"
    submit_args: &submit_args
      max_attempts: 1
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        ARM: control

  - name: paired-state-swap-seed42
    sku: 80G1-A100
    sla_tier: Standard
    command: *run_command
    submit_args:
      max_attempts: 1
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        ARM: paired_swap
