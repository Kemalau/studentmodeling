        --adapter "$$ADAPTER" \
        --eval-jsonl "$$EVAL_DATA" \
        --output-dir "$$AMLT_OUTPUT_DIR/eval/formal_open" \
        --tasks predict_correctness predict_response diagnose_misconception \
          predict_prospective_error predict_error_persistence \
        --max-length 1536 \
        --max-new-tokens 128 \
        --classification-batch-size 8 \
