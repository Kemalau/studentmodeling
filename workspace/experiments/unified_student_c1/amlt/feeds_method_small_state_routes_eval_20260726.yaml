        --bottleneck-mask \
        --bottleneck-style "$$STYLE" \
        --state-token-alias '<|vision_pad|>' \
        --load-4bit

      python -u scripts/probe_student_state_smoke.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$ADAPTER" \
        --train-jsonl "$$C4_DATA/train.jsonl" \
        --same-jsonl "$$C4_DATA/test_same_template.jsonl" \
        --cross-jsonl "$$C4_DATA/test_cross_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/eval/c4_probe_masked.json" \
        --task malrule_next_response \
        --layers 0,8,16,24,32,40,48,56,63 \
        --train-per-label 50 \
        --eval-per-label 15 \
        --max-length 1536 \
        --batch-size 2 \
        --epochs 250 \
        --lr 0.1 \
        --weight-decay 1e-4 \
        --seed 42 \
        --state-token-alias '<|vision_pad|>' \
        --bottleneck-mask \
        --bottleneck-style "$$STYLE"

      python -u scripts/state_swap_misconception_smoke.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$ADAPTER" \
        --jsonl "$$C4_DATA/test_same_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/eval/c4_swap_masked.json" \
        --task malrule_next_response \
        --swap-target response \
