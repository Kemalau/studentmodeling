      python -u scripts/evaluate_c1.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$ADAPTER" \
        --train-jsonl "$$TRAIN_DATA" \
        --eval-jsonl "$$EVAL_DATA" \
        --output-json "$$AMLT_OUTPUT_DIR/eval/t1_t6_masked.json" \
