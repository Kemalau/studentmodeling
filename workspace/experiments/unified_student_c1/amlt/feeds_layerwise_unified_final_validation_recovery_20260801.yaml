      assert config['validation_only_from_distributed_checkpoint'] is True and config['finalize_complete_distributed_epoch'] is True, config
      assert config['state_architecture']=='layerwise' and config['distributed_world_size']==16, config
      receipt={'status':'final_fit_complete','stage':'layerwise_unified_final_fit','selected_branch':'r256_scale','run_dir':str(root),'state_architecture':'layerwise','state_shape':[64,5120],'real_examples':259845,'one_epoch_exact':True,'optimizer_steps':completion['optimizer_steps'],'raw_history_visible_to_decoder':False,'persistent_history_kv_cache':False,'recovery_mode':'single_A100_validation_from_exact_final_distributed_checkpoint'}
      (root/'final_fit_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8'); print(json.dumps(receipt,indent=2,sort_keys=True))
      PY
