      receipt = json.load(open(root / 'checkpoint_completion.json', encoding='utf-8'))
      payload = torch.load(root / 'recurrent_state.pt', map_location='cpu', weights_only=False)
      def digest(path):
          value = hashlib.sha256()
          with path.open('rb') as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                  value.update(chunk)
          return value.hexdigest()
      assert receipt.get('status') == 'complete' and receipt.get('round') == 16241, receipt
      assert receipt.get('world_size') == 16, receipt
      assert receipt['sha256']['adapter_model'] == digest(root / 'adapter/adapter_model.safetensors')
      assert receipt['sha256']['recurrent_state'] == digest(root / 'recurrent_state.pt')
      assert payload.get('distributed') is True and payload.get('round') == 16241, payload
      assert payload.get('world_size') == 16, payload
      config = payload.get('config') or {}
      expected = {
          'state_architecture': 'layerwise',
          'state_token_alias': '<|vision_pad|>',
          'layerwise_transition_rank': 256,
          'layerwise_operation_checkpointing': True,
          'generation_weight': 1.0,
          'behavior_kd_weight': 0.5,
          'behavior_kd_temperature': 1.0,
          'consistency_weight': 0.25,
          'direct_replay_weight': 0.25,
          'causal_weight': 1.0,
          'causal_margin': 0.5,
          'causal_preference_reduction': 'sum',
          'causal_objective_mode': 'specificity_triplet',
          'causal_repeat_fraction': 0.05,
          'normalize_causal_exposure': True,
          'gradient_accumulation_steps': 1,
          'lr_scheduler': 'cosine',
          'warmup_ratio': 0.03,
          'learning_rate': 5e-7,
          'seed': 42,
          'distributed_world_size': 16,
          'real_train_rows': 259845,
          'planned_optimizer_steps': 16241,
          'train_sha256': '9961f746cb17e6c314e182d3453b6157022fb48b8de44d2e68bc8e87a1131ccd',
          'valid_sha256': '78bfce75576dc3873cbb6459669a952adeedb8b77bda15f281af9519e2506d14',
          'causal_train_sha256': '30f68f54120e5a9ada0a37b1dba2b6480de0f8eaeac98d0b7ed7c627429f9766',
          'causal_valid_sha256': '8e038c3a60c2e1b420779cd54eb203b12ae5d51544c87a805fe19d47fdbe294e',
      }
      drift = {key: (config.get(key), value) for key, value in expected.items() if config.get(key) != value}
      assert not drift, drift
      assert len(payload.get('history') or []) == 259845, len(payload.get('history') or [])
      positions = [int(row['global_position']) for row in payload['history']]
      assert positions == list(range(259845)), (positions[:3], positions[-3:], len(positions))
      PY

