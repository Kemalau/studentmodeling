# Derived from the generated and validated Feeds Qwen3-32B one-epoch template.
description: T1 plus interaction-matched T2 add-one recovery from latest complete checkpoint, seed 42

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-t1t2-addone-venv
    - /tmp/studentmodeling-t1t2-addone-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-t1t2-addone-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - manifests/
    - reports/
    - tests/
    - third_party/
    - task_anchor_bundle_20260808/
    - state8_midpoint_diagnosis_first_bundle_20260808/
    - strong1_rescue_bundle_20260808/
    - state8_exact_scientific_rescue_bundle_20260808/
    - '!scripts/'
    - scripts/*
    - '!scripts/build_t1_t2_paired_addone.py'
    - '!scripts/run_t1_t2_paired_addone.sh'
    - '!scripts/stage_t1_t2_resume_checkpoint.py'
    - '!scripts/train_c1_lora.py'
    - '!scripts/copy_model_parallel.py'
    - '!scripts/evaluate_formal_protocols.py'
    - '!scripts/evaluate_c1.py'
    - '!scripts/evaluate_c1_cached.py'
    - '!scripts/t3_llm_judge.py'
    - '!scripts/t3_judge_utils.py'
    - '!scripts/task_taxonomy_v2.py'
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: qwen3-32b-t1-t2-paired-addone-recovery-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/build_t1_t2_paired_addone.py | cut -d' ' -f1)" = 51db795c0216991aa347464e9cc2c4449bb3ef333813034dbfef87352c71467f
      test "$$(sha256sum scripts/run_t1_t2_paired_addone.sh | cut -d' ' -f1)" = 7ba3f854554290440cc01dff237c781c78b1d8ce6e788b4f97a170b328589363
      test "$$(sha256sum scripts/stage_t1_t2_resume_checkpoint.py | cut -d' ' -f1)" = 6beb23e7776de6d388f8bbfc86f47e388c7d97790faa94c6a42abd9556a0bad5
      test "$$(sha256sum scripts/train_c1_lora.py | cut -d' ' -f1)" = 115fded0ef080c4b7a58f5e616a971660791826f8cc53cb4275edcfd1005d9ed
      test "$$(sha256sum scripts/evaluate_formal_protocols.py | cut -d' ' -f1)" = b347ed4d2228725a325975c0ffab162ca32a2e0252583de841c00b3ab1e196de
      test "$$(sha256sum scripts/evaluate_c1.py | cut -d' ' -f1)" = df2451a6e7658cdf4e6ff0e5abe1e3b0708e63685265d46ade0ee97b09846be6
      test "$$(sha256sum scripts/evaluate_c1_cached.py | cut -d' ' -f1)" = a59cff8150090b609c251996151a916dcd1eda8178e6f4cc06e3a55897a5faa2
      test "$$(sha256sum scripts/t3_llm_judge.py | cut -d' ' -f1)" = bbed28e43b2a3da9da74ed5d6b4460d02f2d3f5efa1d9f314a4bde64e3ef8b8c
      test "$$(sha256sum scripts/t3_judge_utils.py | cut -d' ' -f1)" = f82492d0d5469066741aa7ed42b167b8ef10b5b9d7d8b56681bfec33ad095bdc
      bash scripts/run_t1_t2_paired_addone.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 345600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
