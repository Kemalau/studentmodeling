# Generated with `amlt template -t Feeds -y`, then specialized for the
# immutable round-500 State8 taxonomy T3 screen.
description: State8 taxonomy round-500 strict-state-only natural T3 screen

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-midcurve-t3-venv
    - /tmp/studentmodeling-state8-midcurve-t3-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-midcurve-t3-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-taxonomy-t3heavy-round500-t3-screen
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      export VENV_ROOT=/tmp/studentmodeling-state8-midcurve-t3-venv
      export PATH="$$VENV_ROOT/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export RAW_EVAL=/mnt/amulet/studentmodeling/formal_evaluation_v1/test.jsonl
      export RECURRENT_EVAL=/tmp/state8_taxonomy_midcurve_u4/test.jsonl
      export CHECKPOINT=/mnt/amulet/studentmodeling/diagnostics/state8_taxonomy_t3heavy_round500_immutable_20260807
      export OUT="$$AMLT_OUTPUT_DIR/eval/t3_screen"
      mkdir -p "$$HF_HUB_CACHE" "$$(dirname "$$RECURRENT_EVAL")" "$$OUT"
      test -f "$$CHECKPOINT/checkpoint_completion.json"
      test -f "$$CHECKPOINT/adapter/adapter_model.safetensors"
      test -f "$$CHECKPOINT/adapter/adapter_config.json"
      test -f "$$CHECKPOINT/recurrent_state.pt"
      test -f "$$RAW_EVAL"
      test "$$(df --output=avail /tmp | tail -1)" -ge 83886080
      python - "$$CHECKPOINT" <<'PY'
      import hashlib,json,pathlib,sys
      root=pathlib.Path(sys.argv[1]); receipt=json.load(open(root/'checkpoint_completion.json'))
      def digest(path):
          h=hashlib.sha256()
          with open(path,'rb') as f:
              for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
          return h.hexdigest()
      observed={'adapter_model':digest(root/'adapter/adapter_model.safetensors'),
                'recurrent_state':digest(root/'recurrent_state.pt')}
      assert receipt['status']=='complete' and receipt['round']==500,receipt
      assert receipt['world_size']==4,receipt
      assert observed==receipt['sha256'],(observed,receipt)
      PY
      test "$$(sha256sum "$$RAW_EVAL" | cut -d' ' -f1)" = bff7726953ae048bedf6dacdbb7500a54cb8de305e406f2497ef1f11c04167f8
      test "$$(sha256sum scripts/evaluate_recurrent_formal_protocols.py | cut -d' ' -f1)" = 262370592e018641b99d6282858d8990b38314c05bb6e3bbc645823834cf73ed
      test "$$(sha256sum scripts/evaluate_recurrent_formal_protocols_taxonomy.py | cut -d' ' -f1)" = 648baa998672f30652ad3e68f114c2648c5bf839dcddd5b1e0acae47400e5b22
      test "$$(sha256sum scripts/state8_taxonomy_contract.py | cut -d' ' -f1)" = 1ca32112e76c795502f3cb1edbedcc7220f093c133fae8d20ff5cab789e512ed
      python -m pytest -q tests/test_evaluate_recurrent_formal_protocols.py tests/test_state8_taxonomy_contract.py
      python scripts/build_recurrent_evaluation_manifest.py \
        --input-jsonl "$$RAW_EVAL" --output-jsonl "$$RECURRENT_EVAL" \
        --audit-json /tmp/state8_taxonomy_midcurve_u4/audit.json \
        --max-updates 4 --seed 20260730
      test "$$(sha256sum "$$RECURRENT_EVAL" | cut -d' ' -f1)" = a368cefb0c49cb6a305ad1a892808361fba2d44d555a0a28ea64e56babe32525
      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
      python -u scripts/evaluate_recurrent_formal_protocols_taxonomy.py \
        --model "$$LOCAL_MODEL" --adapter "$$CHECKPOINT/adapter" \
        --recurrent-state "$$CHECKPOINT/recurrent_state.pt" \
        --state-architecture layerwise --eval-jsonl "$$RECURRENT_EVAL" \
        --output-dir "$$OUT" --state-token-alias '<|vision_pad|>' \
        --max-samples-per-group 25 --max-length 1536 --max-new-tokens 128 \
        --state-batch-size 2 --candidate-row-batch-size 2 --seed 42 \
        --tasks diagnose_misconception --sources eedi_mining malrule \
        --save-unredacted-predictions --t3-natural-schema
      python - "$$OUT/metrics.json" <<'PY'
      import json,sys
      x=json.load(open(sys.argv[1]))
      assert x['state_architecture']=='layerwise' and x['state_shape']==[64,8,5120],x
      assert x['raw_history_visible_to_decoder'] is False,x
      assert x['persistent_history_kv_cache'] is False,x
      assert x['sampled_rows']>0,x
      assert len(x['artifact_sha256']['adapter_model'])==64,x
      assert len(x['artifact_sha256']['recurrent_state'])==64,x
      PY
      cp "$$CHECKPOINT/checkpoint_completion.json" "$$OUT/checkpoint_completion.json"
      cp /tmp/state8_taxonomy_midcurve_u4/audit.json "$$OUT/manifest_audit.json"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
