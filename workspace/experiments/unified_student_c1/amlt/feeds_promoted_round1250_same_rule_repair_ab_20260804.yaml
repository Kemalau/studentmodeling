# Generated from `amlt template -t Feeds -f amlt/feeds_promoted_round1250_same_rule_repair_ab_20260804.yaml -y`.
description: Controlled same-rule causal repair A/B from promoted round 1250

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-round1250-samerule-ab-venv
    - /tmp/studentmodeling-round1250-samerule-ab-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-round1250-samerule-ab-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: promoted-round1250-repair-base-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: &repair_command |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      test "$$(sha256sum scripts/run_layerwise_task_retention_rehearsal.sh | cut -d' ' -f1)" = f46c3906365085114cd8649832b448fcfd5551139878fc8f042eafad0592de48
      test "$$(sha256sum scripts/augment_recurrent_causal_same_rule.py | cut -d' ' -f1)" = d0f5eb225e771a745874ab9a6c829b8cd4ac2bd71754ae96f8c8007498bc1ff2
      test "$$(sha256sum manifests/layerwise_promoted_round1250_same_rule_repair_balanced_seed42_v1.json | cut -d' ' -f1)" = f612eec632b185679a8c746034927047e5c9ac4b808238ee2e1d753fda89cd36
      bash scripts/run_layerwise_task_retention_rehearsal.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env: &base_env
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-round1250-samerule-ab-venv
        BRANCH: eedi_full_open_t3
        LOSS_PROFILE: state_path
        TRAIN_ENTRYPOINT: scripts/train_recurrent_student_m4_open_t3.py
        CAUSAL_VARIANT: base
        SAME_RULE_AUGMENTER_SHA256: d0f5eb225e771a745874ab9a6c829b8cd4ac2bd71754ae96f8c8007498bc1ff2
        SEGMENT_ROWS: '1000'
        LEARNING_RATE: '5e-7'
        EXPECTED_CAUSAL_PAIRS: '50'
        DIAGNOSTIC_START_GLOBAL_POSITION: '20000'
        DIAGNOSTIC_STOP_AFTER_ROUND: '5250'
        MANIFEST: manifests/layerwise_promoted_round1250_same_rule_repair_balanced_seed42_v1.json
        MANIFEST_SHA256: f612eec632b185679a8c746034927047e5c9ac4b808238ee2e1d753fda89cd36
        WARM_START_CHECKPOINT_DIR: /mnt/amulet/studentmodeling/eval_artifacts/promoted_round1250_frozen_v1/checkpoint-round-1250
        WARM_START_EXPECTED_ROUND: '1250'
        WARM_START_EXPECTED_WORLD_SIZE: '16'

  - name: promoted-round1250-repair-same-rule-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: *repair_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        <<: *base_env
        CAUSAL_VARIANT: same_rule
