    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_eedi_same_question_causal_repair.sh | cut -d' ' -f1)" = f52f59787423437e180e88f17323509ae5174371236c980a1ee8c3b0f3503217
