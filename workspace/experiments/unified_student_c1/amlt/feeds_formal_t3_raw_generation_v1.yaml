description: Generate full formal T3 predictions for Base and Unified Qwen3-32B on four A100 GPUs

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-eval-venv
    - /tmp/studentmodeling-eval-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-eval-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - __pycache__/
    - '*.pyc'

storage:
  student_data:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: false

jobs:
  - name: qwen3-32b-formal-t3-raw-v1
    sku: 80G4-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-eval-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export ADAPTER=/mnt/amulet/studentmodeling/adapters/qwen3_32b_full_trainvalid_no_t4_strictt6_1ep/final_adapter
      export EVAL_DATA=/mnt/amulet/studentmodeling/formal_evaluation_v1/test.jsonl
      mkdir -p "$$HF_HUB_CACHE" "$$AMLT_OUTPUT_DIR/eval/logs"
      (
        flock -x 9
        if [[ ! -f /tmp/Qwen3-32B.copy_complete ]]; then
          rm -rf "$$LOCAL_MODEL"
          mkdir -p "$$LOCAL_MODEL"
          python scripts/copy_model_parallel.py \
            --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
            --destination "$$LOCAL_MODEL" \
            --workers 16
          touch /tmp/Qwen3-32B.copy_complete
        fi
      ) 9>/tmp/qwen3-32b-copy.lock
      test -f "$$ADAPTER/adapter_model.safetensors"
      test -f "$$EVAL_DATA"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader

      run_eval() {
        local gpu="$$1" mode="$$2" source="$$3" output="$$4"
        local adapter_args=()
        if [[ "$$mode" == adapter ]]; then adapter_args=(--adapter "$$ADAPTER"); fi
        CUDA_VISIBLE_DEVICES="$$gpu" python -u scripts/evaluate_formal_protocols.py \
          --model "$$LOCAL_MODEL" "$${adapter_args[@]}" --eval-jsonl "$$EVAL_DATA" \
          --output-dir "$$AMLT_OUTPUT_DIR/eval/$$output" \
          --tasks diagnose_misconception --sources "$$source" \
          --max-length 1536 --max-new-tokens 128 --generation-batch-size 2 \
          --save-unredacted-predictions \
          2>&1 | sed -u "s/^/[$$output] /" | tee "$$AMLT_OUTPUT_DIR/eval/logs/$$output.log"
      }

      run_eval 0 base eedi_mining base_t3_eedi & pid0=$$!
      run_eval 1 base malrule base_t3_malrule & pid1=$$!
      run_eval 2 adapter eedi_mining adapter_t3_eedi & pid2=$$!
      run_eval 3 adapter malrule adapter_t3_malrule & pid3=$$!
      status=0
      wait "$$pid0" || status=1
      wait "$$pid1" || status=1
      wait "$$pid2" || status=1
      wait "$$pid3" || status=1
      exit "$$status"
    submit_args:
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
