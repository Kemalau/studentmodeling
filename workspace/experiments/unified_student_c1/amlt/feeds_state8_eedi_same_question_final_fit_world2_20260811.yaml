# Generated from the approved diagnosis-first matched world2 lineage and
# specialized for the jointly promoted same-question State8 candidate.
description: Same-question State8 exact 259845-row unified final fit; world2; global batch 16; strict state-only
target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
