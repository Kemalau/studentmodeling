      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      test "$$(sha256sum scripts/render_state8_eedi_same_question_finalfit_world2.py | cut -d' ' -f1)" = 736d06fd7596707c9a669f9bff0a649d34134c40814fc5c88f77b268e61d1615
