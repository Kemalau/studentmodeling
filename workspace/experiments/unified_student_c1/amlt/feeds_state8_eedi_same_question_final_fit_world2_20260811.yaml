      test "$$observed" = 8d025cb0301b894b85c1e2eac34bc3f318dc269fc76bd581b8aaa2bc887cc59f
      test "$$(sha256sum "$$rendered" | cut -d' ' -f1)" = "$$observed"
      bash -n "$$rendered"
      exec bash "$$rendered"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 345600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-eedi-same-question-finalfit-venv
        FINALFIT_VARIANT: SELECTED_VARIANT
