# Specialized from the AMLT Feeds/Manifold template for two matched
# taxonomy-aware State8 consolidation screens.
description: Taxonomy curriculum state-only causal consolidation screen

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-taxonomy-consolidation-venv
    - /tmp/studentmodeling-state8-taxonomy-consolidation-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-taxonomy-consolidation-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - &base
    name: state8-taxonomy-curriculum-consolidation-t3heavy-seed52
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: &command |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      bash scripts/run_state8_stateonly_repair_ab.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env: &common_env
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-taxonomy-consolidation-venv
        REPAIR_ARM: trajectory01
        REQUESTED_WORLD_SIZE: '4'
        GRADIENT_ACCUMULATION_STEPS: '1'
        STATE8_REPAIR_SAVE_STEPS: '5'
        STATE8_REPAIR_RECOVERY_SAVE_STEPS: '1'
        TRAIN_ENTRYPOINT: scripts/train_state8_taxonomy_causal_repair.py
        STUDENT_ROOT: /mnt/amulet/studentmodeling/diagnostics/state8_qualified_teacher_curriculum_highkd_v1_immutable_taxonomy_semantic_v1
        RUN_TAG: taxonomy_curriculum_consolidation_t3heavy_v1
        TRAIN_SEED: '52'
        STATE8_CAUSAL_LABEL_WEIGHT: '4.0'
        STATE8_REPAIR_LABEL_WEIGHT: '4.0'
        STATE8_RANDOM_NEUTRAL: '1'
        STATE8_GEOMETRY_WEIGHT: '0.10'
        STATE8_EEDI_GEOMETRY_WEIGHT: '0.05'
        STATE8_DIFFERENT_MAX_COSINE: '0.90'
        STATE8_CAUSAL_DIAGNOSIS_ONLY: '0'
        STATE8_CAUSAL_REPEAT_FRACTION: '0.50'
        STATE8_CAUSAL_WEIGHT: '2.0'
        STATE8_CAUSAL_MARGIN: '0.5'
        STATE8_LAYERWISE_TRANSITION_ONLY: '0'
        STATE8_UPDATER_ONLY: '0'
        STATE8_FORMAL_SCOPE: unified
        STATE8_REPAIR_MANIFEST: manifests/layerwise_task_retention_staged_t3_t6_seed42_v1.json
        STATE8_REPAIR_MANIFEST_SHA256: a4eb41b2130f7e0810eeff36b5f3d16b8dd2c8631c50dbd25216f0793af23557

  - <<: *base
    name: state8-taxonomy-curriculum-consolidation-balanced-seed53
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        <<: *common_env
        STUDENT_ROOT: /mnt/amulet/studentmodeling/diagnostics/state8_qualified_teacher_balanced_curriculum_v1_immutable_taxonomy_semantic_v1
        RUN_TAG: taxonomy_curriculum_consolidation_balanced_v1
        TRAIN_SEED: '53'

  - <<: *base
    name: state8-taxonomy-curriculum-consolidation-t3heavy-diag-seed54
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        <<: *common_env
        RUN_TAG: taxonomy_curriculum_consolidation_t3heavy_diag_v1
        TRAIN_SEED: '54'
        STATE8_GEOMETRY_WEIGHT: '0.05'
        STATE8_CAUSAL_DIAGNOSIS_ONLY: '1'
        STATE8_CAUSAL_REPEAT_FRACTION: '1.0'

  - <<: *base
    name: state8-taxonomy-curriculum-consolidation-balanced-diag-seed55
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        <<: *common_env
        STUDENT_ROOT: /mnt/amulet/studentmodeling/diagnostics/state8_qualified_teacher_balanced_curriculum_v1_immutable_taxonomy_semantic_v1
        RUN_TAG: taxonomy_curriculum_consolidation_balanced_diag_v1
        TRAIN_SEED: '55'
        STATE8_GEOMETRY_WEIGHT: '0.05'
        STATE8_CAUSAL_DIAGNOSIS_ONLY: '1'
        STATE8_CAUSAL_REPEAT_FRACTION: '1.0'
