# Generated from `amlt template -t Feeds -y`, then specialized for the
# immutable selected State8 source-anchor answer-C4 confirmation.
description: Frozen 150-pair answer-C4 confirmation for selected State8 source-anchor arm
target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-source-anchor-answer-c4-venv
    - /tmp/studentmodeling-state8-source-anchor-answer-c4-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-source-anchor-answer-c4-venv/bin/python -m pip install -r requirements-feeds.txt
code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']
storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true
jobs:
  - name: state8-source-anchor-answer-c4-selected
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_source_anchor_answer_c4.sh | cut -d' ' -f1)" = RUNNER_SHA256
      bash scripts/run_state8_source_anchor_answer_c4.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-source-anchor-answer-c4-venv
        SOURCE_ANCHOR_ARM: SELECTED_ARM
        SOURCE_ANCHOR_JOB: SELECTED_JOB
        SOURCE_ANCHOR_ADAPTER_SHA256: SELECTED_ADAPTER_SHA256
        SOURCE_ANCHOR_STATE_SHA256: SELECTED_STATE_SHA256
