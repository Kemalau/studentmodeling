# Generated from `amlt template -t Feeds -y`; communication-only diagnostic.
description: Two-node 16-rank Feeds MPI NCCL rendezvous diagnostic for exact recurrent final-fit scaling

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

jobs:
  - name: multinode-recurrent-dist-diag
    sku: 2x80G8-A100-IB-NvLink
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      test "$$(sha256sum scripts/distributed_epoch.py | cut -d' ' -f1)" = 4b825fa7e7f03de5ceb60e3a812eafab79ba47b07bc9ca8c11274c45f24cd178
      python -m unittest discover -s tests -p 'test_distributed_epoch.py' -v
      python -u - <<'PY'
      import json, os, socket, torch
      from distributed_epoch import (
          all_reduce_int, barrier, close, context_from_environment,
          initialize, master_address,
      )
      context = context_from_environment(True)
      assert context.world_size == 16, context
      address = master_address(context)
      initialize(context, 29642)
      total = all_reduce_int(context.rank + 1, context)
      assert total == 136, total
      value = torch.tensor([float(context.rank + 1)], device=context.local_rank)
      torch.distributed.all_reduce(value)
      assert value.item() == 136.0, value
      barrier(context)
      receipt = {
          'status': 'pass', 'rank': context.rank, 'local_rank': context.local_rank,
          'world_size': context.world_size, 'hostname': socket.gethostname(),
          'master_address': address, 'all_reduce_sum': value.item(),
          'device': torch.cuda.get_device_name(context.local_rank),
      }
      path = os.path.join(os.environ['AMLT_OUTPUT_DIR'], f'rank-{context.rank}.json')
      with open(path, 'w', encoding='utf-8') as handle:
          json.dump(receipt, handle, indent=2, sort_keys=True)
          handle.write('\n')
      print(json.dumps(receipt, sort_keys=True), flush=True)
      close(context)
      PY
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 1800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
