# Generated from the Feeds/Manifold AMLT template on 2026-08-21. Submit only
# after the frozen 200-step v5 smoke gate passes on DBE development students.
# This run deliberately never reads the frozen XES confirmatory test.
description: State8 ownership v5, numeric-only capacity-controlled one-epoch DBE development run

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-profile-ownership-v5-formal-venv
    - /tmp/studentmodeling-state8-profile-ownership-v5-formal-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-profile-ownership-v5-formal-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - .pytest_cache/
    - amlt/
    - data/
    - results/
    - reports/
    - state8_exact_scientific_rescue_bundle_20260808/
    - state8_midpoint_diagnosis_first_bundle_20260808/
    - strong1_rescue_bundle_20260808/
    - task_anchor_bundle_20260808/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-profile-ownership-v5-formal-seed8801
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_student_profile_readout_v5.sh | cut -d' ' -f1)" = 95e7356981651b1cb689647eb3490f24dc0e193f60c8f83905ab250b0886721c
      unset PROFILE_READOUT_DIAGNOSTIC_MAX_MICRO_STEPS PROFILE_READOUT_DIAGNOSTIC_STOP_ROUND PROFILE_READOUT_RESUME_FROM PROFILE_READOUT_EVAL_ONLY
      export PROFILE_READOUT_RUN_DIR=/mnt/amulet/studentmodeling/checkpoints/state8_profile_ownership_v5_formal_seed8801
      export PROFILE_READOUT_STABLE_DIR=/mnt/amulet/studentmodeling/diagnostics/state8_profile_ownership_v5_formal_seed8801
      export STATE8_PROFILE_OWNERSHIP_HEAD_LEARNING_RATE=3e-4
      export STATE8_PROFILE_OWNERSHIP_RESET_HEAD=1
      export STATE8_PROFILE_OWNERSHIP_FEATURE_NORMALIZATION=layernorm
      export STATE8_PROFILE_OWNERSHIP_MIN_KC_TRAIN_SUPPORT=4
      export STATE8_PROFILE_OWNERSHIP_BIAS_PRIOR_STRENGTH=8
      export STATE8_V5_PROFILE_GENERATION_WEIGHT=0.1
      export STATE8_PROFILE_LEGACY_CAUSAL_ENABLED=0
      bash scripts/run_state8_student_profile_readout_v5.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-profile-ownership-v5-formal-venv
