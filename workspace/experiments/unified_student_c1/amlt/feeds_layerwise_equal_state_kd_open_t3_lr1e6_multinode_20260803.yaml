# Generated from `amlt template -t Feeds -d`, then filled from the validated
# equal-T3/T6 open-T3 selective-KD 1e-6 arm. This infrastructure recovery keeps
# four MPI ranks but places one rank on each of four 80G1-A100 nodes so it does
# not require a contiguous four-GPU node. The optimizer, data order, batch,
# objective, seed, and evaluation protocols are unchanged.
# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
description: Equal-T3/T6 open-T3 selective-KD lr1e-6 four-node recovery

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-layerwise-equal-open-statekd-lr1e6-venv
    - /tmp/studentmodeling-layerwise-equal-open-statekd-lr1e6-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-layerwise-equal-open-statekd-lr1e6-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: layerwise-equal-t3-t6-open-t3-statekd-lr1e6-seed42
    sku: 4x80G1-A100
    process_count_per_node: 1
    mpi: true
    sla_tier: Standard
    command: |
      set -euo pipefail
      bash scripts/run_layerwise_task_retention_rehearsal.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-layerwise-equal-open-statekd-lr1e6-venv
        BRANCH: equal_t3_t6_open_t3
        LOSS_PROFILE: state_kd
        TRAIN_ENTRYPOINT: scripts/train_recurrent_student_m4_open_t3_selective_kd.py
        SEGMENT_ROWS: '1000'
        LEARNING_RATE: '1e-6'
        EXPECTED_CAUSAL_PAIRS: '50'
        DIAGNOSTIC_STOP_AFTER_ROUND: '3250'
        MANIFEST: manifests/layerwise_task_retention_equal_t3_t6_seed42_v1.json
        MANIFEST_SHA256: 32adfcc7bd1d78f541ec8685ec8f96f9934b35471011bb896c402b1e77a7bf6f
