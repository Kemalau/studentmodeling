description: Diagnosis-first matched State8 exact 259845-row final fit; world2; global
  batch 16; strict state-only
target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
  - python -m venv --system-site-packages /tmp/studentmodeling-state8-finalfit-venv
  - /tmp/studentmodeling-state8-finalfit-venv/bin/python -m pip install --upgrade
    pip
  - /tmp/studentmodeling-state8-finalfit-venv/bin/python -m pip install -r requirements-feeds.txt
code:
  local_dir: $CONFIG_DIR/..
  ignore:
  - .git/
  - .vscode/
  - amlt/
  - data/
  - results/
  - __pycache__/
  - '*.pyc'
storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true
jobs:
- name: state8-diagnosis-first-matched-seed67-unified-finalfit-seed42
  sku: 80G2-A100
  process_count_per_node: -1
  mpi: true
  sla_tier: Standard
  command: 'set -euo pipefail

    trap ''rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc"
    "$${BASH_COMMAND}" >&2; exit "$$rc"'' ERR

    bash scripts/run_state8_unified_final_fit_world2.sh

    '
  submit_args:
    max_attempts: 2
    max_run_duration_seconds: 43200
    env:
      _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
      VENV_ROOT: /tmp/studentmodeling-state8-finalfit-venv
      FINALFIT_VARIANT: diagnosis_first_matched_seed67
