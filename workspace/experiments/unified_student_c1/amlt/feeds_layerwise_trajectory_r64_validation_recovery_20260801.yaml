description: Single-GPU validation-only finalization of the completed r64 layerwise trajectory checkpoint

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-r64-finalize-venv
    - /tmp/studentmodeling-r64-finalize-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-r64-finalize-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: trajectory-r64-scale-validation-only-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-r64-finalize-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export SOURCE_DATA=/mnt/amulet/studentmodeling/method_small_v1
      export C4_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean
      export UNIFIED_DATA=/tmp/layerwise_trajectory_unified_u4_v1
      export CAUSAL_DATA=/tmp/layerwise_trajectory_cf4_u4_v1
      export INIT_ADAPTER=/mnt/amulet/studentmodeling/checkpoints/state_curriculum_stage_a_cf1_alias_visionpad_seed42_20260727/final_adapter
      export RUN_DIR=/mnt/amulet/studentmodeling/checkpoints/layerwise_trajectory_curriculum_r64_scale_seed42_n200_20260731
      export CHECKPOINT="$$RUN_DIR/checkpoint-round-50"
      mkdir -p "$$HF_HUB_CACHE" "$$UNIFIED_DATA" "$$CAUSAL_DATA" \
        "$$AMLT_OUTPUT_DIR/model" "$$AMLT_OUTPUT_DIR/metrics" "$$AMLT_OUTPUT_DIR/eval/c4"
      test "$$(df --output=avail /tmp | tail -1)" -ge 125829120
      test -f "$$SOURCE_DATA/train.jsonl"
      test -f "$$SOURCE_DATA/valid.jsonl"
      test -f "$$C4_DATA/train.jsonl"
      test -f "$$C4_DATA/val.jsonl"
      test -f "$$C4_DATA/test_same_template.jsonl"
      test -f "$$INIT_ADAPTER/adapter_model.safetensors"
      test -f "$$CHECKPOINT/adapter/adapter_model.safetensors"
      test -f "$$CHECKPOINT/recurrent_state.pt"
      test -f "$$CHECKPOINT/checkpoint_completion.json"
      test -f "$$RUN_DIR/gradient_audit.json"
      test "$$(sha256sum "$$SOURCE_DATA/train.jsonl" | cut -d' ' -f1)" = 3813a0044703569c850f09ba4d74eee7bfab1a774466843255bfafe791ef579f
      test "$$(sha256sum "$$SOURCE_DATA/valid.jsonl" | cut -d' ' -f1)" = 9d758302d3eef0320c5446993b063046fc7f1c6f3ecd417c0ffee1a572e832aa
      test "$$(sha256sum "$$C4_DATA/train.jsonl" | cut -d' ' -f1)" = 6fa5f4160e4a096db6228eb165136d927d0a72bae5a8e5dce9df5bda71a73dae
      test "$$(sha256sum "$$C4_DATA/val.jsonl" | cut -d' ' -f1)" = e928dbe191cf85a00b12a78b5b1e4bb8bd8800bd31a19d5310c4e263e3355d25
      test "$$(sha256sum scripts/train_recurrent_student_m4.py | cut -d' ' -f1)" = a39d0d1aabe97e7df3bc0424e18a556af338ba6bf4f328ea21b921915bd4727f
      test "$$(sha256sum scripts/layerwise_recurrent_student_model.py | cut -d' ' -f1)" = 1706a01450660c833534e487a8b7aad56a61541ce41cc17ca2c8ed16e2e23d3c
      test "$$(sha256sum scripts/evaluate_recurrent_causal_gate.py | cut -d' ' -f1)" = d2a0cf7702f3aaf56bc3629af7b63837f739799f47a3b51e5f5076917116f0b2
      test "$$(sha256sum scripts/build_unified_recurrent_manifest.py | cut -d' ' -f1)" = 8bc822ec33165037dff8353707a037a0edc12679cd67b66885aa94a4288542f6
      test "$$(sha256sum scripts/audit_unified_recurrent_manifest.py | cut -d' ' -f1)" = 6de4fcab57aa8dbd0b56f07972e341f64b60668474f03069cc47878a80e434a0
      test "$$(sha256sum scripts/build_recurrent_causal_pairs.py | cut -d' ' -f1)" = 2daed709603a63a487705bce87539b58c7e01d239397758305d3b023f5eb26b7
      test "$$(sha256sum manifests/cf4_balanced_paired_state_swap_train_seed20260731_v1.json | cut -d' ' -f1)" = 4e7907cf4d74eced4f4c5c2dddf7213a2649cddca081fd2b4a51f35934b35773
      test "$$(sha256sum manifests/cf4_balanced_paired_state_swap_valid_seed20260801_v1.json | cut -d' ' -f1)" = 1a2f45ced0a123d40e1a9646035b07e3b31203567718e6de982cde24bc45def9
      test "$$(sha256sum manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json | cut -d' ' -f1)" = edcdb934a65252557f6c569eea9ef7a85e5445549deac9fb4829c3f579e1a9b8
      python -m unittest discover -s tests -p 'test_train_recurrent_student_m4.py' -v
      python -m unittest discover -s tests -p 'test_layerwise_recurrent_student_model.py' -v
      python -m unittest discover -s tests -p 'test_evaluate_recurrent_causal_gate.py' -v

      python - "$$CHECKPOINT" <<'PY'
      import hashlib, json, sys, torch
      root = sys.argv[1]
      receipt = json.load(open(root + '/checkpoint_completion.json', encoding='utf-8'))
      payload = torch.load(root + '/recurrent_state.pt', map_location='cpu', weights_only=False)
      def digest(path):
          h = hashlib.sha256()
          with open(path, 'rb') as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                  h.update(chunk)
          return h.hexdigest()
      assert receipt.get('status') == 'complete', receipt
      assert receipt.get('round') == 50 and receipt.get('world_size') == 4, receipt
      assert receipt['sha256']['adapter_model'] == digest(root + '/adapter/adapter_model.safetensors')
      assert receipt['sha256']['recurrent_state'] == digest(root + '/recurrent_state.pt')
      config = payload['config']
      assert payload.get('distributed') is True and payload.get('round') == 50, payload.keys()
      assert payload.get('world_size') == 4 and len(payload.get('history') or []) == 200, payload.keys()
      assert config['state_architecture'] == 'layerwise', config
      assert config['layerwise_transition_rank'] == 64, config
      assert config['layerwise_transition_only'] is True, config
      assert config['trajectory_curriculum_only'] is True, config
      assert config['trajectory_relative_mse_weight'] == 1.0, config
      assert config['generation_weight'] == config['behavior_kd_weight'] == 0, config
      assert config['direct_replay_weight'] == config['causal_weight'] == 0, config
      assert config['causal_trajectory_weight'] == 1.0, config
      PY

      python scripts/build_unified_recurrent_manifest.py \
        --train-jsonl "$$SOURCE_DATA/train.jsonl" --valid-jsonl "$$SOURCE_DATA/valid.jsonl" \
        --output-dir "$$UNIFIED_DATA" --max-updates 4 --seed 20260730
      python scripts/audit_unified_recurrent_manifest.py \
        --train-jsonl "$$UNIFIED_DATA/train.jsonl" --valid-jsonl "$$UNIFIED_DATA/valid.jsonl" \
        --output-json "$$UNIFIED_DATA/audit.json"
      python scripts/build_recurrent_causal_pairs.py \
        --train-source "$$C4_DATA/train.jsonl" --valid-source "$$C4_DATA/val.jsonl" \
        --train-pairs manifests/cf4_balanced_paired_state_swap_train_seed20260731_v1.json \
        --valid-pairs manifests/cf4_balanced_paired_state_swap_valid_seed20260801_v1.json \
        --output-dir "$$CAUSAL_DATA" --max-updates 4
      test "$$(sha256sum "$$UNIFIED_DATA/train.jsonl" | cut -d' ' -f1)" = 18f2a05be56a93bb63f5ac552559502f29770158356faf906020911d5e9e2e6d
      test "$$(sha256sum "$$UNIFIED_DATA/valid.jsonl" | cut -d' ' -f1)" = 9079207606ebab4fe85a47926d8fb38332970af12d78cc647dcda965f4522069
      test "$$(sha256sum "$$CAUSAL_DATA/train.jsonl" | cut -d' ' -f1)" = 30f68f54120e5a9ada0a37b1dba2b6480de0f8eaeac98d0b7ed7c627429f9766
      test "$$(sha256sum "$$CAUSAL_DATA/valid.jsonl" | cut -d' ' -f1)" = 8e038c3a60c2e1b420779cd54eb203b12ae5d51544c87a805fe19d47fdbe294e

      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      rm -f "$$RUN_DIR/completion.json.partial"
      python -u scripts/train_recurrent_student_m4.py \
        --model "$$LOCAL_MODEL" --init-adapter "$$INIT_ADAPTER" \
        --state-architecture layerwise --layerwise-operation-checkpointing \
        --layerwise-transition-only --layerwise-transition-rank 64 \
        --trajectory-curriculum-only --trajectory-cosine-weight 1.0 \
        --trajectory-relative-mse-weight 1.0 \
        --train-jsonl "$$UNIFIED_DATA/train.jsonl" --valid-jsonl "$$UNIFIED_DATA/valid.jsonl" \
        --causal-train-jsonl "$$CAUSAL_DATA/train.jsonl" --causal-valid-jsonl "$$CAUSAL_DATA/valid.jsonl" \
        --output-dir "$$RUN_DIR" --state-token-alias '<|vision_pad|>' \
        --max-length 1536 --learning-rate 1e-4 \
        --generation-weight 0 --behavior-kd-weight 0 --consistency-weight 1.0 \
        --direct-replay-weight 0 --causal-weight 0 --causal-trajectory-weight 1.0 \
        --causal-repeat-fraction 1.0 --gradient-accumulation-steps 1 \
        --eval-limit 80 --causal-eval-limit 80 --save-steps 25 \
        --diagnostic-stop-after-round 50 \
        --resume-from-checkpoint "$$CHECKPOINT/recurrent_state.pt" \
        --validation-only-from-distributed-checkpoint --seed 42

      test -f "$$RUN_DIR/completion.json"
      test -f "$$RUN_DIR/final_adapter/adapter_model.safetensors"
      test -f "$$RUN_DIR/recurrent_state.pt"
      python - "$$RUN_DIR" <<'PY'
      import json, pathlib, sys
      root = pathlib.Path(sys.argv[1])
      completion = json.load(open(root / 'completion.json', encoding='utf-8'))
      config = json.load(open(root / 'run_config.json', encoding='utf-8'))
      gradient = json.load(open(root / 'gradient_audit.json', encoding='utf-8'))
      assert completion['status'] == 'diagnostic_complete', completion
      assert completion['micro_steps'] == 200 and completion['causal_pairs_seen'] == 200, completion
      assert completion['optimizer_steps'] == 50, completion
      assert config['validation_only_from_distributed_checkpoint'] is True, config
      assert config['validation_only_checkpoint'].endswith('checkpoint-round-50/recurrent_state.pt'), config
      assert config['state_architecture'] == 'layerwise' and config['layerwise_transition_rank'] == 64, config
      assert gradient['lora']['parameter_tensors'] == 0, gradient
      assert gradient['layerwise_transition']['gradient_abs_sum'] > 0, gradient
      assert not gradient['frozen_tensors_with_grad'], gradient
      receipt = {
          'status': 'trajectory_curriculum_complete', 'branch': 'r64_scale',
          'transition_rank': 64, 'relative_mse_weight': 1.0,
          'optimizer_steps': completion['optimizer_steps'], 'remote_run_dir': str(root),
          'raw_history_visible_to_decoder': False, 'persistent_history_kv_cache': False,
          'recovery_mode': 'validation_only_from_atomic_round_50_checkpoint',
      }
      (root / 'trajectory_curriculum_receipt.json').write_text(
          json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
      )
      print(json.dumps(receipt, indent=2, sort_keys=True))
      PY
      python -u scripts/evaluate_recurrent_causal_gate.py \
        --model "$$LOCAL_MODEL" --adapter "$$RUN_DIR/final_adapter" \
        --recurrent-state "$$RUN_DIR/recurrent_state.pt" --state-architecture layerwise \
        --jsonl "$$C4_DATA/test_same_template.jsonl" \
        --pair-manifest manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json \
        --output-json "$$AMLT_OUTPUT_DIR/eval/c4/recurrent_causal_gate.json" \
        --state-token-alias '<|vision_pad|>' --max-length 1536 --num-pairs 150 --seed 42
      cp -r "$$RUN_DIR/final_adapter/." "$$AMLT_OUTPUT_DIR/model/"
      cp "$$RUN_DIR/recurrent_state.pt" "$$AMLT_OUTPUT_DIR/model/recurrent_state.pt"
      cp "$$RUN_DIR"/*.json "$$AMLT_OUTPUT_DIR/metrics/"
      cp "$$UNIFIED_DATA/audit.json" "$$AMLT_OUTPUT_DIR/metrics/data_audit.json"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
