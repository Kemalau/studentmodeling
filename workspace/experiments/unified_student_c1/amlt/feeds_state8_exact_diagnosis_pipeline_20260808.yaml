# Generated with `amlt template -t Feeds -y`, then specialized for the exact
# diagnosis-first teacher-to-State8 curriculum plus C4 consolidation pipeline.
description: Exact State8 diagnosis-first teacher curriculum and causal consolidation

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-exact-diagnosis-venv
    - /tmp/studentmodeling-state8-exact-diagnosis-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-exact-diagnosis-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-exact-diagnosis-first-curriculum-c4-seed64
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      bash scripts/run_state8_exact_diagnosis_pipeline.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-exact-diagnosis-venv
        STATE8_DIAGNOSIS_FIRST_CURRICULUM_SHA256: 82364884211bf708103d149031df24393bb16d43a8e7e8444f1c1a089771eeda
        STATE8_DIAGNOSIS_FIRST_ENTRYPOINT_SHA256: 7d638013f932f29f52cffeea709b96872df8ba0960b9bb4e56ed23cc3475b216
        STATE8_DIAGNOSIS_FIRST_EXACT_RESUME_SHA256: 12ff946035194eb40cfabe08fd1416b1b5fe54ec60e1ef440202eb2d2ac71060
        STATE8_DIAGNOSIS_FIRST_FORMAL_SHA256: a8bc07a8fe6d2c9bfa9af6d976b53b84321cb4baa9c9fcace3188e370f7732c9
        STATE8_DIAGNOSIS_FIRST_C4_SHA256: 7eef90e079d698c94f1f8655a1df3fe6bd93cedbb175ba4e7082a49bb8069c8b
