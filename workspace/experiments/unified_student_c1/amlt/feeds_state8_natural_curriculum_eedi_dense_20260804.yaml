# Generated from the approved full-support Eedi AMLT template.  The two jobs
# differ only in the gold-semantic trajectory coefficient.
description: Eight-slot natural-language history-dropout curriculum for closed Eedi T3

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-natural-curriculum-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: &command |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      exec 4>/tmp/studentmodeling-state8-natural-venv.lock
      flock -x 4
      if [[ ! -f /tmp/studentmodeling-state8-natural-venv.complete ]]; then
        rm -rf /tmp/studentmodeling-state8-natural-venv
        python -m venv --system-site-packages /tmp/studentmodeling-state8-natural-venv
        /tmp/studentmodeling-state8-natural-venv/bin/python -m pip install --upgrade pip
        /tmp/studentmodeling-state8-natural-venv/bin/python -m pip install -r requirements-feeds.txt
        /tmp/studentmodeling-state8-natural-venv/bin/python -c 'import accelerate,bitsandbytes,peft,safetensors,transformers'
        touch /tmp/studentmodeling-state8-natural-venv.complete
      fi
      flock -u 4
      bash scripts/run_state8_natural_curriculum.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-natural-venv
        BRANCH: eedi_dense
        LOSS_PROFILE: state_path
        TRAIN_ENTRYPOINT: scripts/train_recurrent_student_m4_state8_natural_curriculum.py
        SEGMENT_ROWS: '1000'
        LEARNING_RATE: '2e-6'
        CONSISTENCY_WEIGHT: '0.25'
        CAUSAL_VARIANT: same_rule
        EXPECTED_CAUSAL_PAIRS: '50'
        DIAGNOSTIC_STOP_AFTER_ROUND: '3250'
        MANIFEST: manifests/layerwise_task_retention_eedi_dense_seed42_v1.json
        MANIFEST_SHA256: cc484d7f7b6db02cfdf1e530866e029a721896d9c57103313e581f504c7bc16e
