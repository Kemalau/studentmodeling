# Specialized from an AMLT 11.14.2 Feeds/Manifold template.  Five disjoint
# read-only shards evaluate one immutable State8 adapter and recurrent state.
description: State8 semantic diagnosis C4 50-pair five-way sharded evaluation

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-c4-shard-venv
    - /tmp/studentmodeling-state8-c4-shard-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-c4-shard-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - &base
    name: state8-c4-shard00
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &command |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      bash scripts/run_state8_diagnosis_c4_shard.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env: &env
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-c4-shard-venv
        PAIR_START: '0'
        PAIR_COUNT: '10'

  - <<: *base
    name: state8-c4-shard10
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        <<: *env
        PAIR_START: '10'

  - <<: *base
    name: state8-c4-shard20
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        <<: *env
        PAIR_START: '20'

  - <<: *base
    name: state8-c4-shard30
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        <<: *env
        PAIR_START: '30'

  - <<: *base
    name: state8-c4-shard40
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        <<: *env
        PAIR_START: '40'
