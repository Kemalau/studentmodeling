# Generated from `amlt template -t Feeds -y`, then specialized for the
# diagnosis-first full-history-teacher -> State8 -> final Eedi C4 curriculum.
description: Diagnosis-first teacher to State8 with final state-only Eedi C4

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-eedi-curriculum-venv
    - /tmp/studentmodeling-state8-eedi-curriculum-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-eedi-curriculum-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-diagnosis-first-eedi-curriculum-seed83
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_diagnosis_first_eedi_curriculum.sh | cut -d' ' -f1)" = 123733ddbfa7743f910be1ab1bedcdbfd9bb379d19ea106c2c92540c246134fe
      test "$$(sha256sum scripts/train_state8_diagnosis_first_eedi_curriculum.py | cut -d' ' -f1)" = 779bcf9acafa160efed46f2c7b94ffdc4cb6ea1f50d4e6eaba9de283e0d30e0f
      bash scripts/run_state8_diagnosis_first_eedi_curriculum.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-eedi-curriculum-venv
