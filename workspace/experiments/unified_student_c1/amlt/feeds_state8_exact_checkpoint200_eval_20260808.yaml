# Generated from `amlt template -t Feeds -y`, then specialized for four
# independent read-only checkpoints from the exact diagnosis-first C4 stage.
description: Conditional read-only State8 diagnosis-first consolidation milestone evaluation

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-exact-milestone-venv
    - /tmp/studentmodeling-state8-exact-milestone-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-exact-milestone-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - &milestone
    name: state8-exact-consolidation-step200-eval
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &command |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      bash scripts/run_state8_exact_consolidation_milestone_eval.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env: &env
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-exact-milestone-venv
        MILESTONE_STEP: '200'

  - <<: *milestone
    name: state8-exact-consolidation-step400-eval
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        <<: *env
        MILESTONE_STEP: '400'

  - <<: *milestone
    name: state8-exact-consolidation-step600-eval
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        <<: *env
        MILESTONE_STEP: '600'

  - <<: *milestone
    name: state8-exact-consolidation-step800-eval
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        <<: *env
        MILESTONE_STEP: '800'
