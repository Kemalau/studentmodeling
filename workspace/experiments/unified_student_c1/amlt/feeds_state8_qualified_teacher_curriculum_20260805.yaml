# Generated from the approved State8 Feeds diagnostic template.
description: Qualified frozen full-history teacher to eight-token state curriculum

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-qualified-teacher-venv
    - /tmp/studentmodeling-state8-qualified-teacher-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-qualified-teacher-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-qualified-teacher-curriculum-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: &curriculum_command |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      bash scripts/run_state8_qualified_teacher_curriculum.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-qualified-teacher-venv
        STATE8_REPLAY_VARIANT: t3_heavy
        STATE8_SAVE_STEPS: '125'

  - name: state8-qualified-teacher-balanced-curriculum-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: *curriculum_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-qualified-teacher-venv
        STATE8_REPLAY_VARIANT: balanced
        STATE8_SAVE_STEPS: '125'

  - name: state8-qualified-teacher-highkd-curriculum-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: *curriculum_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-qualified-teacher-venv
        STATE8_REPLAY_VARIANT: t3_heavy
        STATE8_KD_VARIANT: highkd
        STATE8_SAVE_STEPS: '125'
