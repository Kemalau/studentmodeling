description: Diagnostic-only frozen C4 probe of the formal layerwise unified fit at
  atomic round 500
target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
  - python -m venv --system-site-packages /tmp/studentmodeling-layerwise-checkpoint-c4-venv
  - /tmp/studentmodeling-layerwise-checkpoint-c4-venv/bin/python -m pip install --upgrade
    pip
  - /tmp/studentmodeling-layerwise-checkpoint-c4-venv/bin/python -m pip install -r
    requirements-feeds.txt
code:
  local_dir: $CONFIG_DIR/..
  ignore:
  - .git/
  - .vscode/
  - amlt/
  - data/
  - results/
  - __pycache__/
  - '*.pyc'
storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true
jobs:
- name: layerwise-finalfit-checkpoint500-c4-seed42
  sku: 80G1-A100
  process_count_per_node: 1
  mpi: false
  sla_tier: Standard
  command: "set -euo pipefail\nexport PATH=\"/tmp/studentmodeling-layerwise-checkpoint-c4-venv/bin:$$PATH\"\
    \nexport PYTHONPATH=\"$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}\"\n\
    export HF_HOME=/tmp/hf_cache\nexport HF_HUB_CACHE=/tmp/hf_cache/hub\nexport HF_HUB_DISABLE_XET=1\n\
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True\nexport TRANSFORMERS_VERBOSITY=error\n\
    export LOCAL_MODEL=/tmp/Qwen3-32B\nexport RUN_DIR=/mnt/amulet/studentmodeling/diagnostics/layerwise_unified_finalfit_seed42_20260801_snapshot\n\
    export CHECKPOINT=\"$$RUN_DIR/checkpoint-round-500\"\nexport C4_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean\n\
    mkdir -p \"$$HF_HUB_CACHE\" \"$$AMLT_OUTPUT_DIR/eval/c4\"\ntest -f \"$$CHECKPOINT/adapter/adapter_config.json\"\
    \ntest -f \"$$CHECKPOINT/adapter/adapter_model.safetensors\"\ntest -f \"$$CHECKPOINT/recurrent_state.pt\"\
    \ntest -f \"$$CHECKPOINT/checkpoint_completion.json\"\npython - \"$$CHECKPOINT\"\
    \ <<'PY'\nimport hashlib, json, pathlib, sys\nroot = pathlib.Path(sys.argv[1])\n\
    receipt = json.load(open(root / 'checkpoint_completion.json', encoding='utf-8'))\n\
    def digest(path):\n    value = hashlib.sha256()\n    with open(path, 'rb') as\
    \ handle:\n        for chunk in iter(lambda: handle.read(1024 * 1024), b''):\n\
    \            value.update(chunk)\n    return value.hexdigest()\nassert receipt.get('status')\
    \ == 'complete' and receipt.get('round') == 500, receipt\nassert receipt.get('world_size')\
    \ == 16, receipt\nassert receipt['sha256']['adapter_model'] == digest(root / 'adapter/adapter_model.safetensors')\n\
    assert receipt['sha256']['recurrent_state'] == digest(root / 'recurrent_state.pt')\n\
    PY\nexport C4_PROGRESS_DIR=\"$$CHECKPOINT/c4_eval_progress_v1\"\nexport C4_PROGRESS_KEY=\"\
    $$(python - \"$$CHECKPOINT/checkpoint_completion.json\" <<'PY'\nimport json,sys\n\
    x=json.load(open(sys.argv[1],encoding='utf-8'))\nprint(f\"round={x['round']}:adapter={x['sha256']['adapter_model']}:state={x['sha256']['recurrent_state']}\"\
    )\nPY\n)\"\nmkdir -p \"$$C4_PROGRESS_DIR\"\ntest \"$$(sha256sum scripts/audit_layerwise_distributed_checkpoint.py\
    \ | cut -d' ' -f1)\" = 6690ece8935c6343bec7136ad34a9899b72a866c7bde6286ca26b2c82890007f\n\
    python scripts/audit_layerwise_distributed_checkpoint.py \\\n  --checkpoint \"\
    $$CHECKPOINT/recurrent_state.pt\" \\\n  --expected-round 500 \\\n  --output \"\
    $$AMLT_OUTPUT_DIR/eval/c4/checkpoint_resume_audit.json\"\ntest \"$$(sha256sum\
    \ \"$$C4_DATA/test_same_template.jsonl\" | cut -d' ' -f1)\" = 079f7634cc54dfd55dfc234503bb5925ab734b1ca74aa2f2a9a17cc4375a2c2f\n\
    test \"$$(sha256sum manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json | cut\
    \ -d' ' -f1)\" = edcdb934a65252557f6c569eea9ef7a85e5445549deac9fb4829c3f579e1a9b8\n\
    test \"$$(sha256sum scripts/evaluate_recurrent_causal_gate.py | cut -d' ' -f1)\"\
    \ = fd6510465abafbd897ac4acbf27dd0da14b179637ba9a632f4c5cb539214c5ad\ntest \"\
    $$(sha256sum scripts/frozen_layerwise_finalfit/layerwise_recurrent_student_model.py\
    \ | cut -d' ' -f1)\" = 1706a01450660c833534e487a8b7aad56a61541ce41cc17ca2c8ed16e2e23d3c\n\
    test \"$$(sha256sum tests/frozen_layerwise_finalfit/test_layerwise_recurrent_student_model.py\
    \ | cut -d' ' -f1)\" = c71470252dbaaeebb2869b162e73f7a6e4edf34f75df48f156575bd3927992f2\n\
    cp scripts/frozen_layerwise_finalfit/layerwise_recurrent_student_model.py scripts/layerwise_recurrent_student_model.py\n\
    cp tests/frozen_layerwise_finalfit/test_layerwise_recurrent_student_model.py tests/test_layerwise_recurrent_student_model.py\n\
    test \"$$(sha256sum scripts/layerwise_recurrent_student_model.py | cut -d' ' -f1)\"\
    \ = 1706a01450660c833534e487a8b7aad56a61541ce41cc17ca2c8ed16e2e23d3c\npython -m\
    \ unittest discover -s tests -p 'test_evaluate_recurrent_causal_gate.py' -v\n\
    rm -rf \"$$LOCAL_MODEL\"; mkdir -p \"$$LOCAL_MODEL\"\npython scripts/copy_model_parallel.py\
    \ \\\n  --source /mnt/amulet/studentmodeling/models/Qwen3-32B \\\n  --destination\
    \ \"$$LOCAL_MODEL\" --workers 16\ntest -f \"$$LOCAL_MODEL/model.safetensors.index.json\"\
    \nnvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader\npython\
    \ -u scripts/evaluate_recurrent_causal_gate.py \\\n  --model \"$$LOCAL_MODEL\"\
    \ --adapter \"$$CHECKPOINT/adapter\" \\\n  --recurrent-state \"$$CHECKPOINT/recurrent_state.pt\"\
    \ \\\n  --state-architecture layerwise \\\n  --jsonl \"$$C4_DATA/test_same_template.jsonl\"\
    \ \\\n  --pair-manifest manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json \\\
    \n  --output-json \"$$AMLT_OUTPUT_DIR/eval/c4/recurrent_causal_gate.json\" \\\n\
    \  --state-token-alias '<|vision_pad|>' --max-length 1536 \\\n  --num-pairs 150\
    \ --seed 42 \\\n  --progress-dir \"$$C4_PROGRESS_DIR\" --progress-key \"$$C4_PROGRESS_KEY\"\
    \nprintf '%s\\n' \\\n  'stage=layerwise_finalfit_checkpoint_c4' \\\n  'diagnostic_only=true'\
    \ \\\n  'checkpoint_round=500' \\\n  'formal_final_c4_required=true' \\\n  > \"\
    $$AMLT_OUTPUT_DIR/eval/c4/probe_scope.txt\"\n"
  submit_args:
    max_attempts: 2
    max_run_duration_seconds: 172800
    env:
      _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
