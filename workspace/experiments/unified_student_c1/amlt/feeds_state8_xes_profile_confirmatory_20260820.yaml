description: One-shot frozen XES profile confirmation for the selected strict State8 checkpoint

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-xes-profile-confirmatory-venv
    - /tmp/studentmodeling-state8-xes-profile-confirmatory-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-xes-profile-confirmatory-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - .pytest_cache/
    - amlt/
    - data/
    - results/
    - reports/
    - state8_exact_scientific_rescue_bundle_20260808/
    - state8_midpoint_diagnosis_first_bundle_20260808/
    - strong1_rescue_bundle_20260808/
    - task_anchor_bundle_20260808/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-xes-profile-confirmatory-lrfix-v4-seed8801
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_xes_profile_confirmatory.sh | cut -d' ' -f1)" = b73228349bd301d03651dfe1cb872c944e795015489a69f5a697c538b0aaebf9
      bash scripts/run_state8_xes_profile_confirmatory.sh
    submit_args:
      max_attempts: 1
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-xes-profile-confirmatory-venv
