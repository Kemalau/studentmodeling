description: Generate unredacted method-small T3 predictions for Base and the one-epoch full-open Qwen3-32B adapter

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-eval-venv
    - /tmp/studentmodeling-eval-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-eval-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - __pycache__/
    - '*.pyc'

storage:
  student_data:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: false

jobs:
  - name: qwen3-32b-method-small-base-t3-raw
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-eval-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export EVAL_DATA=/mnt/amulet/studentmodeling/method_small_v1/test.jsonl
      mkdir -p "$$HF_HUB_CACHE" "$$AMLT_OUTPUT_DIR/eval/base_t3"
      available_kb=$$(df --output=avail /tmp | tail -1)
      test "$$available_kb" -ge 125829120
      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" \
        --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      test -f "$$EVAL_DATA"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
      python -u scripts/evaluate_formal_protocols.py \
        --model "$$LOCAL_MODEL" \
        --eval-jsonl "$$EVAL_DATA" \
        --output-dir "$$AMLT_OUTPUT_DIR/eval/base_t3" \
        --tasks diagnose_misconception \
        --max-length 1536 \
        --max-new-tokens 128 \
        --generation-batch-size 2 \
        --save-unredacted-predictions
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml

  - name: qwen3-32b-method-small-adapter-t3-raw
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-eval-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export ADAPTER=/mnt/amulet/projects/v-yuejiali/amlt-results/7215295067.10143-255b28af-1e91/model/final_adapter
      export EVAL_DATA=/mnt/amulet/studentmodeling/method_small_v1/test.jsonl
      mkdir -p "$$HF_HUB_CACHE" "$$AMLT_OUTPUT_DIR/eval/adapter_t3"
      available_kb=$$(df --output=avail /tmp | tail -1)
      test "$$available_kb" -ge 125829120
      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" \
        --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      test -f "$$ADAPTER/adapter_model.safetensors"
      test -f "$$EVAL_DATA"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
      python -u scripts/evaluate_formal_protocols.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$ADAPTER" \
        --eval-jsonl "$$EVAL_DATA" \
        --output-dir "$$AMLT_OUTPUT_DIR/eval/adapter_t3" \
        --tasks diagnose_misconception \
        --max-length 1536 \
        --max-new-tokens 128 \
        --generation-batch-size 2 \
        --save-unredacted-predictions
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
