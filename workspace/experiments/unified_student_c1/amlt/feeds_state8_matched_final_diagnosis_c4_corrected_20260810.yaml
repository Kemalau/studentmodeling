# Generated with `amlt template -t Feeds -y`, then specialized.  The watcher
# replaces only the artifact/receipt hash placeholders after the immutable
# matched checkpoint has been published.
description: Corrected matched-final diagnosis C4 with explicit Malrule taxonomy contract
target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-matched-final-diagnosis-c4-corrected-venv
    - /tmp/studentmodeling-matched-final-diagnosis-c4-corrected-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-matched-final-diagnosis-c4-corrected-venv/bin/python -m pip install -r requirements-feeds.txt
code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']
storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true
jobs:
  - name: state8-matched-final-diagnosis-c4-corrected
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_matched_final_diagnosis_c4_corrected.sh | cut -d' ' -f1)" = HASH_LAUNCHER_SHA256
      bash scripts/run_state8_matched_final_diagnosis_c4_corrected.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        EXPECTED_ADAPTER_SHA256: 'HASH_ADAPTER_SHA256'
        EXPECTED_STATE_SHA256: 'HASH_STATE_SHA256'
        EXPECTED_RECEIPT_SHA256: 'HASH_RECEIPT_SHA256'
