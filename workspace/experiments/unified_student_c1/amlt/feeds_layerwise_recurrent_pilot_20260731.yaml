# Generated from `amlt template -t Feeds -n 2 -d -y`.
# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
description: Three-branch distributed pilot for the one-address layerwise recurrent unified student model

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-layerwise-pilot-venv
    - /tmp/studentmodeling-layerwise-pilot-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-layerwise-pilot-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: layerwise-pilot-preserve-low-lr-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: &pilot_command |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-layerwise-pilot-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      : "$${BRANCH:?BRANCH is required}"
      : "$${LEARNING_RATE:?LEARNING_RATE is required}"
      : "$${CAUSAL_WEIGHT:?CAUSAL_WEIGHT is required}"
      : "$${CAUSAL_OBJECTIVE:?CAUSAL_OBJECTIVE is required}"
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export SOURCE_DATA=/mnt/amulet/studentmodeling/method_small_v1
      export C4_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean
      export UNIFIED_DATA=/tmp/layerwise_pilot_unified_u4_v1
      export CAUSAL_DATA=/tmp/layerwise_pilot_cf4_u4_v1
      export INIT_ADAPTER=/mnt/amulet/studentmodeling/checkpoints/state_curriculum_stage_a_cf1_alias_visionpad_seed42_20260727/final_adapter
      export CACHE_DIR=/mnt/amulet/studentmodeling/world_model_v1/m4/teacher_cache_train_n12000_top256_fixedu4_v2_20260730
      export RUN_DIR="/mnt/amulet/studentmodeling/checkpoints/layerwise_recurrent_pilot_$${BRANCH}_seed42_n200_20260731"
      mkdir -p "$$HF_HUB_CACHE" "$$UNIFIED_DATA" "$$CAUSAL_DATA" "$$RUN_DIR" \
        "$$AMLT_OUTPUT_DIR/model" "$$AMLT_OUTPUT_DIR/metrics" "$$AMLT_OUTPUT_DIR/eval/c4"
      test "$$(df --output=avail /tmp | tail -1)" -ge 125829120
      test -f "$$SOURCE_DATA/train.jsonl"
      test -f "$$SOURCE_DATA/valid.jsonl"
      test -f "$$C4_DATA/train.jsonl"
      test -f "$$C4_DATA/val.jsonl"
      test -f "$$C4_DATA/test_same_template.jsonl"
      test -f "$$INIT_ADAPTER/adapter_model.safetensors"
      test -f "$$CACHE_DIR/integrity.json"
      test "$$(sha256sum "$$SOURCE_DATA/train.jsonl" | cut -d' ' -f1)" = 3813a0044703569c850f09ba4d74eee7bfab1a774466843255bfafe791ef579f
      test "$$(sha256sum "$$SOURCE_DATA/valid.jsonl" | cut -d' ' -f1)" = 9d758302d3eef0320c5446993b063046fc7f1c6f3ecd417c0ffee1a572e832aa
      test "$$(sha256sum "$$C4_DATA/train.jsonl" | cut -d' ' -f1)" = 6fa5f4160e4a096db6228eb165136d927d0a72bae5a8e5dce9df5bda71a73dae
      test "$$(sha256sum "$$C4_DATA/val.jsonl" | cut -d' ' -f1)" = e928dbe191cf85a00b12a78b5b1e4bb8bd8800bd31a19d5310c4e263e3355d25
      test "$$(sha256sum scripts/train_recurrent_student_m4.py | cut -d' ' -f1)" = 35579bf50fb5ed84de70d7f88d683b0cf2e939b66cef9a6b629abb27b2bbe2a4
      test "$$(sha256sum scripts/layerwise_recurrent_student_model.py | cut -d' ' -f1)" = 1706a01450660c833534e487a8b7aad56a61541ce41cc17ca2c8ed16e2e23d3c
      test "$$(sha256sum scripts/evaluate_recurrent_causal_gate.py | cut -d' ' -f1)" = d2a0cf7702f3aaf56bc3629af7b63837f739799f47a3b51e5f5076917116f0b2
      test "$$(sha256sum scripts/build_unified_recurrent_manifest.py | cut -d' ' -f1)" = 8bc822ec33165037dff8353707a037a0edc12679cd67b66885aa94a4288542f6
      test "$$(sha256sum scripts/audit_unified_recurrent_manifest.py | cut -d' ' -f1)" = 6de4fcab57aa8dbd0b56f07972e341f64b60668474f03069cc47878a80e434a0
      test "$$(sha256sum scripts/build_recurrent_causal_pairs.py | cut -d' ' -f1)" = 2daed709603a63a487705bce87539b58c7e01d239397758305d3b023f5eb26b7
      test "$$(sha256sum manifests/cf4_balanced_paired_state_swap_train_seed20260731_v1.json | cut -d' ' -f1)" = 4e7907cf4d74eced4f4c5c2dddf7213a2649cddca081fd2b4a51f35934b35773
      test "$$(sha256sum manifests/cf4_balanced_paired_state_swap_valid_seed20260801_v1.json | cut -d' ' -f1)" = 1a2f45ced0a123d40e1a9646035b07e3b31203567718e6de982cde24bc45def9
      test "$$(sha256sum manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json | cut -d' ' -f1)" = edcdb934a65252557f6c569eea9ef7a85e5445549deac9fb4829c3f579e1a9b8
      python -m unittest discover -s tests -p 'test_train_recurrent_student_m4.py' -v
      python -m unittest discover -s tests -p 'test_layerwise_recurrent_student_model.py' -v
      python -m unittest discover -s tests -p 'test_evaluate_recurrent_causal_gate.py' -v

      exec 7>/tmp/layerwise-pilot-data.lock
      flock -x 7
      if [[ ! -f /tmp/layerwise-pilot-data.complete ]]; then
        rm -rf "$$UNIFIED_DATA" "$$CAUSAL_DATA"
        mkdir -p "$$UNIFIED_DATA" "$$CAUSAL_DATA"
        python scripts/build_unified_recurrent_manifest.py \
          --train-jsonl "$$SOURCE_DATA/train.jsonl" \
          --valid-jsonl "$$SOURCE_DATA/valid.jsonl" \
          --output-dir "$$UNIFIED_DATA" \
          --max-updates 4 --seed 20260730
        python scripts/audit_unified_recurrent_manifest.py \
          --train-jsonl "$$UNIFIED_DATA/train.jsonl" \
          --valid-jsonl "$$UNIFIED_DATA/valid.jsonl" \
          --output-json "$$UNIFIED_DATA/audit.json"
        python scripts/build_recurrent_causal_pairs.py \
          --train-source "$$C4_DATA/train.jsonl" \
          --valid-source "$$C4_DATA/val.jsonl" \
          --train-pairs manifests/cf4_balanced_paired_state_swap_train_seed20260731_v1.json \
          --valid-pairs manifests/cf4_balanced_paired_state_swap_valid_seed20260801_v1.json \
          --output-dir "$$CAUSAL_DATA" --max-updates 4
        touch /tmp/layerwise-pilot-data.complete
      fi
      flock -u 7
      test "$$(sha256sum "$$UNIFIED_DATA/train.jsonl" | cut -d' ' -f1)" = 18f2a05be56a93bb63f5ac552559502f29770158356faf906020911d5e9e2e6d
      test "$$(sha256sum "$$UNIFIED_DATA/valid.jsonl" | cut -d' ' -f1)" = 9079207606ebab4fe85a47926d8fb38332970af12d78cc647dcda965f4522069
      test "$$(sha256sum "$$CAUSAL_DATA/train.jsonl" | cut -d' ' -f1)" = 30f68f54120e5a9ada0a37b1dba2b6480de0f8eaeac98d0b7ed7c627429f9766
      test "$$(sha256sum "$$CAUSAL_DATA/valid.jsonl" | cut -d' ' -f1)" = 8e038c3a60c2e1b420779cd54eb203b12ae5d51544c87a805fe19d47fdbe294e

      exec 6>/tmp/layerwise-pilot-model.lock
      flock -x 6
      if [[ ! -f /tmp/layerwise-pilot-model.complete ]]; then
        rm -rf "$$LOCAL_MODEL"
        mkdir -p "$$LOCAL_MODEL"
        python scripts/copy_model_parallel.py \
          --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
          --destination "$$LOCAL_MODEL" --workers 16
        test -f "$$LOCAL_MODEL/model.safetensors.index.json"
        touch /tmp/layerwise-pilot-model.complete
      fi
      flock -u 6
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total,memory.used --format=csv,noheader

      # One MPI process owns one physical GPU.  Hiding peer GPUs before the
      # trainer process imports torch prevents every rank from creating CUDA
      # contexts on GPU 0 while preserving the same global NCCL world/ranks.
      export CUDA_VISIBLE_DEVICES="$${OMPI_COMM_WORLD_LOCAL_RANK:?MPI local rank is required}"
      export RANK="$${OMPI_COMM_WORLD_RANK:?MPI rank is required}"
      export WORLD_SIZE="$${OMPI_COMM_WORLD_SIZE:?MPI world size is required}"
      export LOCAL_RANK=0

      if [[ ! -f "$$RUN_DIR/completion.json" ]]; then
        resume_args=()
        mapfile -t checkpoints < <(find "$$RUN_DIR" -mindepth 1 -maxdepth 1 \
          -type d -name 'checkpoint-round-*' | sort -V)
        for ((i=$${#checkpoints[@]}-1; i>=0; i--)); do
          candidate="$${checkpoints[$$i]}"
          if [[ -f "$$candidate/checkpoint_completion.json" \
                && -f "$$candidate/adapter/adapter_model.safetensors" \
                && -f "$$candidate/recurrent_state.pt" ]]; then
            resume_args=(--resume-from-checkpoint "$$candidate/recurrent_state.pt")
            break
          fi
        done
        python -u scripts/train_recurrent_student_m4.py \
          --model "$$LOCAL_MODEL" \
          --init-adapter "$$INIT_ADAPTER" \
          --state-architecture layerwise \
          --layerwise-operation-checkpointing \
          --train-jsonl "$$UNIFIED_DATA/train.jsonl" \
          --valid-jsonl "$$UNIFIED_DATA/valid.jsonl" \
          --causal-train-jsonl "$$CAUSAL_DATA/train.jsonl" \
          --causal-valid-jsonl "$$CAUSAL_DATA/valid.jsonl" \
          --teacher-cache "$$CACHE_DIR" --behavior-kd-weight 0.5 --behavior-kd-temperature 1.0 \
          --output-dir "$$RUN_DIR" \
          --state-token-alias '<|vision_pad|>' \
          --max-length 1536 --learning-rate "$$LEARNING_RATE" \
          --generation-weight 1.0 --consistency-weight 0.25 --direct-replay-weight 0.25 \
          --causal-weight "$$CAUSAL_WEIGHT" --causal-margin 0.5 \
          --causal-preference-reduction sum --causal-objective-mode "$$CAUSAL_OBJECTIVE" \
          --causal-repeat-fraction 1.0 \
          --gradient-accumulation-steps 1 --eval-limit 80 --causal-eval-limit 80 \
          --save-steps 25 \
          --distributed-mpi --distributed-world-size 4 \
          --diagnostic-stop-after-round 50 --seed 42 \
          "$${resume_args[@]}"
      fi
      if [[ "$${OMPI_COMM_WORLD_RANK:-0}" != 0 ]]; then
        exit 0
      fi
      test -f "$$RUN_DIR/completion.json"
      test -f "$$RUN_DIR/final_adapter/adapter_model.safetensors"
      test -f "$$RUN_DIR/recurrent_state.pt"
      python - "$$RUN_DIR" "$$BRANCH" "$$CAUSAL_OBJECTIVE" <<'PY'
      import json, pathlib, sys, torch
      root = pathlib.Path(sys.argv[1])
      completion = json.load(open(root / 'completion.json', encoding='utf-8'))
      config = json.load(open(root / 'run_config.json', encoding='utf-8'))
      state = torch.load(root / 'recurrent_state.pt', map_location='cpu', weights_only=False)
      assert completion['status'] == 'diagnostic_complete', completion
      assert completion['micro_steps'] == 200, completion
      assert completion['causal_pairs_seen'] == 200, completion
      assert completion['unique_causal_pairs_seen'] == 200, completion
      assert config['state_architecture'] == 'layerwise', config
      assert config['layerwise_operation_checkpointing'] is True, config
      assert config['distributed_world_size'] == 4, config
      assert config['diagnostic_stop_after_round'] == 50, config
      assert config['causal_objective_mode'] == sys.argv[3], config
      assert config['causal_branch_dropout_mode'] == 'eval_deterministic', config
      assert state['config']['state_architecture'] == 'layerwise', state.keys()
      payload = {
          'status': 'pilot_training_complete',
          'branch': sys.argv[2],
          'state_architecture': 'layerwise',
          'state_shape': [64, 5120],
          'micro_steps': completion['micro_steps'],
          'optimizer_steps': completion['optimizer_steps'],
          'causal_pairs_seen': completion['causal_pairs_seen'],
          'learning_rate': config['learning_rate'],
          'causal_weight': config['causal_weight'],
          'causal_objective_mode': config['causal_objective_mode'],
          'remote_run_dir': str(root),
          'raw_history_visible_to_decoder': False,
          'persistent_history_kv_cache': False,
      }
      open(root / 'pilot_receipt.json', 'w', encoding='utf-8').write(
          json.dumps(payload, indent=2, sort_keys=True) + '\n'
      )
      print(json.dumps(payload, indent=2, sort_keys=True))
      PY
      export CUDA_VISIBLE_DEVICES=0
      python -u scripts/evaluate_recurrent_causal_gate.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --recurrent-state "$$RUN_DIR/recurrent_state.pt" \
        --state-architecture layerwise \
        --jsonl "$$C4_DATA/test_same_template.jsonl" \
        --pair-manifest manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json \
        --output-json "$$AMLT_OUTPUT_DIR/eval/c4/recurrent_causal_gate.json" \
        --state-token-alias '<|vision_pad|>' --max-length 1536 --num-pairs 150 --seed 42
      cp -r "$$RUN_DIR/final_adapter/." "$$AMLT_OUTPUT_DIR/model/"
      cp "$$RUN_DIR/recurrent_state.pt" "$$AMLT_OUTPUT_DIR/model/recurrent_state.pt"
      cp "$$RUN_DIR/completion.json" "$$AMLT_OUTPUT_DIR/metrics/completion.json"
      cp "$$RUN_DIR/pilot_receipt.json" "$$AMLT_OUTPUT_DIR/metrics/pilot_receipt.json"
      cp "$$RUN_DIR/run_config.json" "$$AMLT_OUTPUT_DIR/metrics/run_config.json"
      cp "$$RUN_DIR/gradient_audit.json" "$$AMLT_OUTPUT_DIR/metrics/gradient_audit.json"
      cp "$$RUN_DIR/training_metrics.json" "$$AMLT_OUTPUT_DIR/metrics/training_metrics.json"
      cp "$$RUN_DIR/validation_metrics.json" "$$AMLT_OUTPUT_DIR/metrics/validation_metrics.json"
      cp "$$RUN_DIR/causal_validation_metrics.json" "$$AMLT_OUTPUT_DIR/metrics/causal_validation_metrics.json"
      cp "$$UNIFIED_DATA/audit.json" "$$AMLT_OUTPUT_DIR/metrics/data_audit.json"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        BRANCH: preserve_low_lr
        LEARNING_RATE: '5e-7'
        CAUSAL_WEIGHT: '0.5'
        CAUSAL_OBJECTIVE: donor_directional

  - name: layerwise-pilot-balanced-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: *pilot_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        BRANCH: balanced
        LEARNING_RATE: '2e-6'
        CAUSAL_WEIGHT: '1.0'
        CAUSAL_OBJECTIVE: donor_directional

  - name: layerwise-pilot-specificity-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: *pilot_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 86400
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        BRANCH: specificity
        LEARNING_RATE: '2e-6'
        CAUSAL_WEIGHT: '1.0'
        CAUSAL_OBJECTIVE: specificity_triplet
