# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
description: Frozen C4 seed42 real-random donor control and layerwise trajectory dose response

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-c4-controls-venv
    - /tmp/studentmodeling-c4-controls-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-c4-controls-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - reports/
    - tests/
    - third_party/
    - task_anchor_bundle_20260808/
    - state8_midpoint_diagnosis_first_bundle_20260808/
    - strong1_rescue_bundle_20260808/
    - state8_exact_scientific_rescue_bundle_20260808/
    - '!scripts/'
    - scripts/*
    - '!scripts/copy_model_parallel.py'
    - '!scripts/state_swap_misconception_smoke.py'
    - '!tests/'
    - tests/*
    - '!tests/test_state_swap_layer_groups.py'
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: qwen3-32b-c4-real-random-dose-seed42
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-c4-controls-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache HF_HUB_CACHE=/tmp/hf_cache/hub HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export C4_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean
      export PAIR_MANIFEST="$$AMLT_CODE_DIR/manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json"
      export RUN_DIR=/mnt/amulet/studentmodeling/checkpoints/state_curriculum_stage_a_cf1_alias_visionpad_seed42_20260727
      test "$$(df --output=avail /tmp | tail -1)" -ge 125829120
      test -f "$$RUN_DIR/final_adapter/adapter_model.safetensors"
      test -f "$$C4_DATA/test_same_template.jsonl"
      test -f "$$PAIR_MANIFEST"
      test "$$(sha256sum "$$C4_DATA/test_same_template.jsonl" | cut -d' ' -f1)" = 079f7634cc54dfd55dfc234503bb5925ab734b1ca74aa2f2a9a17cc4375a2c2f
      test "$$(sha256sum "$$PAIR_MANIFEST" | cut -d' ' -f1)" = edcdb934a65252557f6c569eea9ef7a85e5445549deac9fb4829c3f579e1a9b8
      test "$$(sha256sum scripts/state_swap_misconception_smoke.py | cut -d' ' -f1)" = 70b8b48d8809cb8f7c2427b7152a42bc82a841e931029c7adf954e9877808fff
      test "$$(sha256sum tests/test_state_swap_layer_groups.py | cut -d' ' -f1)" = 6f0e26dbea70e38e59df73752a2be51e0b759b5f32017eaa59349dbb1219616f
      python -m pytest -q tests/test_state_swap_layer_groups.py
      mkdir -p "$$AMLT_OUTPUT_DIR/gate"
      sha256sum "$$C4_DATA/test_same_template.jsonl" "$$PAIR_MANIFEST" \
        "$$RUN_DIR/final_adapter/adapter_model.safetensors" \
        | tee "$$AMLT_OUTPUT_DIR/input_sha256.txt"
      rm -rf "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
      python -u scripts/state_swap_misconception_smoke.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --jsonl "$$C4_DATA/test_same_template.jsonl" \
        --output-json "$$AMLT_OUTPUT_DIR/gate/c4_real_random_dose_seed42.json" \
        --task malrule_next_response --swap-target response \
        --layers all --num-pairs 150 --pair-manifest "$$PAIR_MANIFEST" \
        --max-length 1536 --seed 42 --state-token-alias '<|vision_pad|>' \
        --bottleneck-mask --bottleneck-style late_fusion \
        --real-random-control --real-random-seed 20260904 \
        --dose-alphas 0.25,0.5,0.75
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
