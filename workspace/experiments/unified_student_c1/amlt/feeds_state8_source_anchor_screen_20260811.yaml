# Generated from the Feeds/Manifold AMLT template, then specialized and
# hash-bound for three independent source-aware State8 repair screens.
description: Source-aware relative-MSE State8 unified repair screen
target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-source-anchor-venv
    - /tmp/studentmodeling-state8-source-anchor-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-source-anchor-venv/bin/python -m pip install -r requirements-feeds.txt
code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']
storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true
jobs:
  - &base
    name: state8-source-anchor-full-mse1-seed3071
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &command |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_source_anchor_screen.sh | cut -d' ' -f1)" = bb7c6e72dba4ded6c67531c6ce54820c123b4c2f897a0f85be1a3193ee3a9f12
      bash scripts/run_state8_source_anchor_screen.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env: &env
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-source-anchor-venv
        SOURCE_ANCHOR_MODE: full_mse1
        EXPECTED_STUDENT_ADAPTER_SHA256: 73b6633759febc6ccddac8e81d8715b512a86c3410cf6d2f160b48610d59c558
        EXPECTED_STUDENT_STATE_SHA256: 05dd9377584301293ba319ef7cd3bc93ec64f820c171f51abee593185a495aba
  - <<: *base
    name: state8-source-anchor-updater-mse1-seed3072
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        <<: *env
        SOURCE_ANCHOR_MODE: updater_mse1
  - <<: *base
    name: state8-source-anchor-full-mse2-seed3073
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        <<: *env
        SOURCE_ANCHOR_MODE: full_mse2
