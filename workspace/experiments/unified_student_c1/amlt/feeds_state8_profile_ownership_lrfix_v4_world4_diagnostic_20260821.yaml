# Bounded execution-only preflight for the exact lrfix-v4 code and objective.
# It does not inspect the frozen XES confirmatory split and cannot promote on
# scientific merit; it only proves the four-rank collective/exposure contract.
description: Two-round four-A100 execution diagnostic for State8 ownership lrfix v4

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-profile-ownership-lrfix-v4-world4-diagnostic-venv
    - /tmp/studentmodeling-state8-profile-ownership-lrfix-v4-world4-diagnostic-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-profile-ownership-lrfix-v4-world4-diagnostic-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - .pytest_cache/
    - amlt/
    - data/
    - results/
    - reports/
    - state8_exact_scientific_rescue_bundle_20260808/
    - state8_midpoint_diagnosis_first_bundle_20260808/
    - strong1_rescue_bundle_20260808/
    - task_anchor_bundle_20260808/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-profile-ownership-lrfix-v4-world4-diagnostic-seed8801
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_student_profile_readout.sh | cut -d' ' -f1)" = 75079712bac1d7211c341482592fda48bc056e54e549adc11b99b11fd844087e
      export PROFILE_READOUT_DISTRIBUTED_WORLD_SIZE=4
      export PROFILE_READOUT_GRADIENT_ACCUMULATION_STEPS=1
      export PROFILE_READOUT_DIAGNOSTIC_STOP_ROUND=2
      export PROFILE_READOUT_RUN_DIR=/mnt/amulet/studentmodeling/checkpoints/state8_profile_ownership_lrfix_v4_world4_diagnostic_seed8801
      export PROFILE_READOUT_STABLE_DIR=/mnt/amulet/studentmodeling/diagnostics/state8_profile_ownership_lrfix_v4_world4_diagnostic_seed8801
      export STATE8_PROFILE_OWNERSHIP_HEAD_LEARNING_RATE=3e-4
      export STATE8_PROFILE_OWNERSHIP_RESET_HEAD=1
      export STATE8_PROFILE_OWNERSHIP_FEATURE_NORMALIZATION=layernorm
      export STATE8_PROFILE_OWNERSHIP_MIN_KC_TRAIN_SUPPORT=4
      export STATE8_PROFILE_OWNERSHIP_BIAS_PRIOR_STRENGTH=8
      bash scripts/run_state8_student_profile_readout.sh
    submit_args:
      max_attempts: 1
      max_run_duration_seconds: 14400
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-profile-ownership-lrfix-v4-world4-diagnostic-venv
