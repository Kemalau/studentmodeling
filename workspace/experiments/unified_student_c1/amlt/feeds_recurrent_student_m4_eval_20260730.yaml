# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
description: Formal T1 T2 T3 T5 T6 and recurrent-state C4 evaluation for the selected full unified checkpoint

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-m4-eval-venv
    - /tmp/studentmodeling-m4-eval-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-m4-eval-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - amlt/
    - data/
    - results/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: m4-eval-t1-t6-seed42
    sku: 80G1-A100
    sla_tier: Standard
    command: &formal_eval_command |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-m4-eval-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export RAW_EVAL=/mnt/amulet/studentmodeling/formal_evaluation_v1/test.jsonl
      export RECURRENT_EVAL=/tmp/recurrent_formal_evaluation_fixedu4_v2/test.jsonl
      export RECEIPT=/mnt/amulet/studentmodeling/world_model_v1/m4/selected_seed42.json
      export BASE_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean
      mkdir -p "$$HF_HUB_CACHE" "$$(dirname "$$RECURRENT_EVAL")" "$$AMLT_OUTPUT_DIR/eval"
      test -f "$$RECEIPT"
      readarray -t selected < <(python - "$$RECEIPT" <<'PY'
      import json, sys
      value = json.load(open(sys.argv[1], encoding="utf-8"))
      assert value.get("status") == "candidate_complete", value
      assert value.get("mask_protocol") == "answer_anchor_visible_v2", value
      print(value["run_dir"])
      print(value["arm"])
      print(value["projection_mode"])
      PY
      )
      export RUN_DIR="$${selected[0]}"
      export SELECTED_ARM="$${selected[1]}"
      export SELECTED_PROJECTION="$${selected[2]}"
      test -f "$$RUN_DIR/final_adapter/adapter_model.safetensors"
      test -f "$$RUN_DIR/recurrent_state.pt"
      test -f "$$RUN_DIR/completion.json"
      python - "$$RUN_DIR/completion.json" <<'PY'
      import json, sys
      value = json.load(open(sys.argv[1], encoding="utf-8"))
      assert value.get("status") == "complete", value
      assert value.get("real_examples_seen_once") is True, value
      assert value.get("causal_pairs_seen_once") is True, value
      PY
      test -f "$$RAW_EVAL"
      test "$$(sha256sum "$$RAW_EVAL" | cut -d' ' -f1)" = bff7726953ae048bedf6dacdbb7500a54cb8de305e406f2497ef1f11c04167f8
      test "$$(sha256sum scripts/evaluate_recurrent_formal_protocols.py | cut -d' ' -f1)" = eb0243cf232d7e634f0ad784d30e66f93f42f84833a748ec453b648cff0eccda
      test "$$(sha256sum scripts/build_recurrent_evaluation_manifest.py | cut -d' ' -f1)" = d335b0b97471683eb1f317f21af6f0dd36ccca0fe6a8e495838112785ea85a8e
      test "$$(sha256sum scripts/recurrent_student_model.py | cut -d' ' -f1)" = 9e0431dccb524f67b401f7ea911e11c96fc3061432ffdc73e0cac2bbc2acc5a0
      python -m unittest discover -s tests -p 'test_evaluate_recurrent_formal_protocols.py' -v
      python scripts/build_recurrent_evaluation_manifest.py \
        --input-jsonl "$$RAW_EVAL" \
        --output-jsonl "$$RECURRENT_EVAL" \
        --audit-json /tmp/recurrent_formal_evaluation_fixedu4_v2/audit.json \
        --max-updates 4 \
        --seed 20260730
      test "$$(sha256sum "$$RECURRENT_EVAL" | cut -d' ' -f1)" = a368cefb0c49cb6a305ad1a892808361fba2d44d555a0a28ea64e56babe32525
      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" \
        --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
      python -u scripts/evaluate_recurrent_formal_protocols.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --recurrent-state "$$RUN_DIR/recurrent_state.pt" \
        --eval-jsonl "$$RECURRENT_EVAL" \
        --output-dir "$$AMLT_OUTPUT_DIR/eval/$${EVAL_GROUP}" \
        --state-token-alias '<|vision_pad|>' \
        --max-length 1536 \
        --max-new-tokens 128 \
        --tasks $$TASKS \
        --seed 42 \
        --save-unredacted-predictions
      cp /tmp/recurrent_formal_evaluation_fixedu4_v2/audit.json "$$AMLT_OUTPUT_DIR/eval/$${EVAL_GROUP}/manifest_audit.json"
      printf '%s\n' "selected_arm=$$SELECTED_ARM" "selected_projection=$$SELECTED_PROJECTION" 'mask_protocol=answer_anchor_visible_v2' > "$$AMLT_OUTPUT_DIR/eval/$${EVAL_GROUP}/selection.txt"
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        EVAL_GROUP: t1_t6
        TASKS: predict_correctness predict_error_persistence

  - name: m4-eval-t2-seed42
    sku: 80G1-A100
    sla_tier: Standard
    command: *formal_eval_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        EVAL_GROUP: t2
        TASKS: predict_response

  - name: m4-eval-t3-seed42
    sku: 80G1-A100
    sla_tier: Standard
    command: *formal_eval_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        EVAL_GROUP: t3
        TASKS: diagnose_misconception

  - name: m4-eval-t5-seed42
    sku: 80G1-A100
    sla_tier: Standard
    command: *formal_eval_command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        EVAL_GROUP: t5
        TASKS: predict_prospective_error

  - name: m4-eval-c4-seed42
    sku: 80G1-A100
    sla_tier: Standard
    command: |
      set -euo pipefail
      export PATH="/tmp/studentmodeling-m4-eval-venv/bin:$$PATH"
      export PYTHONPATH="$$AMLT_CODE_DIR/scripts$${PYTHONPATH:+:$$PYTHONPATH}"
      export HF_HOME=/tmp/hf_cache
      export HF_HUB_CACHE=/tmp/hf_cache/hub
      export HF_HUB_DISABLE_XET=1
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      export TRANSFORMERS_VERBOSITY=error
      export LOCAL_MODEL=/tmp/Qwen3-32B
      export RECEIPT=/mnt/amulet/studentmodeling/world_model_v1/m4/selected_seed42.json
      export BASE_DATA=/mnt/amulet/studentmodeling/c4_fullopen_20260724/malrule_c1_clean
      mkdir -p "$$HF_HUB_CACHE" "$$AMLT_OUTPUT_DIR/eval/c4"
      test -f "$$RECEIPT"
      export RUN_DIR="$$(python - "$$RECEIPT" <<'PY'
      import json, sys
      value = json.load(open(sys.argv[1], encoding="utf-8"))
      assert value.get("status") == "candidate_complete", value
      assert value.get("mask_protocol") == "answer_anchor_visible_v2", value
      print(value["run_dir"])
      PY
      )"
      test -f "$$RUN_DIR/final_adapter/adapter_model.safetensors"
      test -f "$$RUN_DIR/recurrent_state.pt"
      test -f "$$BASE_DATA/test_same_template.jsonl"
      test "$$(sha256sum "$$BASE_DATA/test_same_template.jsonl" | cut -d' ' -f1)" = 079f7634cc54dfd55dfc234503bb5925ab734b1ca74aa2f2a9a17cc4375a2c2f
      test "$$(sha256sum manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json | cut -d' ' -f1)" = edcdb934a65252557f6c569eea9ef7a85e5445549deac9fb4829c3f579e1a9b8
      test "$$(sha256sum scripts/evaluate_recurrent_causal_gate.py | cut -d' ' -f1)" = 9dca3271d29153baf66b440239467e6889c0f2c64677c4e31fd4e2d8a5710c10
      test "$$(sha256sum scripts/recurrent_student_model.py | cut -d' ' -f1)" = 9e0431dccb524f67b401f7ea911e11c96fc3061432ffdc73e0cac2bbc2acc5a0
      python -m unittest discover -s tests -p 'test_evaluate_recurrent_causal_gate.py' -v
      rm -rf "$$LOCAL_MODEL"
      mkdir -p "$$LOCAL_MODEL"
      python scripts/copy_model_parallel.py \
        --source /mnt/amulet/studentmodeling/models/Qwen3-32B \
        --destination "$$LOCAL_MODEL" \
        --workers 16
      test -f "$$LOCAL_MODEL/model.safetensors.index.json"
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
      python -u scripts/evaluate_recurrent_causal_gate.py \
        --model "$$LOCAL_MODEL" \
        --adapter "$$RUN_DIR/final_adapter" \
        --recurrent-state "$$RUN_DIR/recurrent_state.pt" \
        --jsonl "$$BASE_DATA/test_same_template.jsonl" \
        --pair-manifest manifests/c4_stage_a_gate_pairs_seed42_n150_v1.json \
        --output-json "$$AMLT_OUTPUT_DIR/eval/c4/recurrent_causal_gate.json" \
        --state-token-alias '<|vision_pad|>' \
        --max-length 1536 \
        --num-pairs 150 \
        --seed 42
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
