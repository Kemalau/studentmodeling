# Derived from the approved Feeds State8 profile job; all artifacts are remote.
description: State8 ownership optimizer repair v3, sparse-KC-safe 200-step diagnostic

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-profile-ownership-lrfix-v3-venv
    - /tmp/studentmodeling-state8-profile-ownership-lrfix-v3-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-profile-ownership-lrfix-v3-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore:
    - .git/
    - .vscode/
    - .pytest_cache/
    - amlt/
    - data/
    - results/
    - reports/
    - state8_exact_scientific_rescue_bundle_20260808/
    - state8_midpoint_diagnosis_first_bundle_20260808/
    - strong1_rescue_bundle_20260808/
    - task_anchor_bundle_20260808/
    - __pycache__/
    - '*.pyc'

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - name: state8-profile-ownership-lrfix-v3-smoke-seed8801
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: |
      set -euo pipefail
      test "$$(sha256sum scripts/run_state8_student_profile_readout.sh | cut -d' ' -f1)" = 19b2a6c5143e48828c6a09503ed74b538d030d1141d7ea0ec8f916a6f776f098
      export PROFILE_READOUT_DIAGNOSTIC_MAX_MICRO_STEPS=200
      export PROFILE_READOUT_EVAL_LIMIT=24
      export PROFILE_READOUT_CAUSAL_EVAL_LIMIT=12
      export PROFILE_READOUT_RUN_DIR=/mnt/amulet/studentmodeling/checkpoints/state8_profile_ownership_lrfix_v3_smoke_seed8801
      export PROFILE_READOUT_STABLE_DIR=/mnt/amulet/studentmodeling/diagnostics/state8_profile_ownership_lrfix_v3_smoke_seed8801
      export STATE8_PROFILE_OWNERSHIP_HEAD_LEARNING_RATE=3e-4
      export STATE8_PROFILE_OWNERSHIP_RESET_HEAD=1
      export STATE8_PROFILE_OWNERSHIP_FEATURE_NORMALIZATION=layernorm
      bash scripts/run_state8_student_profile_readout.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 43200
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-profile-ownership-lrfix-v3-venv
