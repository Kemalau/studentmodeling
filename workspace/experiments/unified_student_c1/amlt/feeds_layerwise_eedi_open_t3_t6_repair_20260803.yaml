# yaml-language-server: $schema=file:///home/v-yuejiali/studentmodeling/workspace/experiments/unified_student_c1/.vscode/amlt-config.schema.json
# ^ Update with: amlt schema add <file>  |  VS Code: Run Task > amlt
# Generated with `amlt template -t Feeds -f ... -y`, then filled with three
# controlled T6-repair arms. All start from the same hash-audited causal
# open-T3 checkpoint and use fresh train-only rows.
description: Causal open-T3 checkpoint T6 repair scan

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

# REQUIRED: Docker environment
# Manifold jobs authenticate to Azure (storage, ACR) via a User-Assigned
# Managed Identity, auto-detected from the workspace in most cases. Only set
# _AZUREML_SINGULARITY_JOB_UAI in 'env' below if auto-detection is ambiguous
# (multiple non-primary identities); run 'amlt run' to see the available list.
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-layerwise-t6-repair-venv
    - /tmp/studentmodeling-layerwise-t6-repair-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-layerwise-t6-repair-venv/bin/python -m pip install -r requirements-feeds.txt

# REQUIRED: code to run. Set local_dir to your code directory — it must
# exist and be non-empty. $CONFIG_DIR = directory of this file; the default
# $CONFIG_DIR/src means: put your code in a 'src' folder next to this file.
code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

# REQUIRED: Jobs to run. SKU examples: C1 (1 CPU), G1 (1 GPU), G4 (4 GPUs), G8-V100 (8 V100s)
# Commands run from the uploaded code directory (code.local_dir).
# 'command' is a shell script block (|): one line per step, e.g. python train.py --lr 0.01
# Write outputs to $AMLT_OUTPUT_DIR for retrieval with 'amlt results'.
# Use $$VAR to pass env vars literally ($VAR is interpolated at submission time).
jobs:
  - name: layerwise-eedi-open-t3-t6-repair-balanced-lr5e7-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: &command |
      set -euo pipefail
      bash scripts/run_layerwise_task_retention_rehearsal.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env: &balanced_lr5e7_env
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-layerwise-t6-repair-venv
        BRANCH: eedi_full_open_t3
        LOSS_PROFILE: state_path
        TRAIN_ENTRYPOINT: scripts/train_recurrent_student_m4_open_t3.py
        SEGMENT_ROWS: '1000'
        LEARNING_RATE: '5e-7'
        EXPECTED_CAUSAL_PAIRS: '50'
        DIAGNOSTIC_START_GLOBAL_POSITION: '17000'
        DIAGNOSTIC_STOP_AFTER_ROUND: '4500'
        MANIFEST: manifests/layerwise_eedi_open_t3_t6_repair_balanced_seed42_v1.json
        MANIFEST_SHA256: 08945e930bc8b9a55e57a41d4656612e3dfce99b8544c88068110a74a1a22da9
        WARM_START_SOURCE_CHECKPOINT_DIR: /mnt/amulet/studentmodeling/diagnostics/layerwise_task_retention_service_recovery/eedi_full_open_t3/state_path/lr2e-6_start12000_stop4250_97bef6748b1fa8d75809e9e01c9b76d57b6534d336b7037217289932a31df393_b926ee1acc6bf8a098693cef8705f88c739be214629dcea723daed6a0827c440_b5e7a5c301280df64083dadf20273902747bcf8ea4e4cdd03de3e49d4e53187a/checkpoint-round-4250
        WARM_START_CHECKPOINT_DIR: /tmp/layerwise-eedi-open-t3-t6-repair-balanced-lr5e7-warm-start
        WARM_START_PRIOR_MANIFEST: manifests/layerwise_task_retention_eedi_full_seed42_v1.json
        WARM_START_EXPECTED_ROUND: '4250'
        WARM_START_EXPECTED_WORLD_SIZE: '4'

  - name: layerwise-eedi-open-t3-t6-repair-balanced-lr1e6-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        <<: *balanced_lr5e7_env
        LEARNING_RATE: '1e-6'
        WARM_START_CHECKPOINT_DIR: /tmp/layerwise-eedi-open-t3-t6-repair-balanced-lr1e6-warm-start

  - name: layerwise-eedi-open-t3-t6-repair-strong-lr5e7-seed42
    sku: 80G4-A100
    process_count_per_node: -1
    mpi: true
    sla_tier: Standard
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 172800
      env:
        <<: *balanced_lr5e7_env
        MANIFEST: manifests/layerwise_eedi_open_t3_t6_repair_strong_seed42_v1.json
        MANIFEST_SHA256: 5bb006010147bd99c0f1615ce0a54c016b8fdd15334b2f8b01a5c679f6443a09
        WARM_START_CHECKPOINT_DIR: /tmp/layerwise-eedi-open-t3-t6-repair-strong-lr5e7-warm-start
