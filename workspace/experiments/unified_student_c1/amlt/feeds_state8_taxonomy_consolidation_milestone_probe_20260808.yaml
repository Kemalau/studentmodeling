# Generated with `amlt template -t Feeds -y`, then specialized for two
# read-only immutable State8 consolidation milestone probes.
description: State8 taxonomy consolidation round-100 strict-state-only T3 and C4 probes

target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
    - python -m venv --system-site-packages /tmp/studentmodeling-state8-consolidation-probe-venv
    - /tmp/studentmodeling-state8-consolidation-probe-venv/bin/python -m pip install --upgrade pip
    - /tmp/studentmodeling-state8-consolidation-probe-venv/bin/python -m pip install -r requirements-feeds.txt

code:
  local_dir: $CONFIG_DIR/..
  ignore: [.git/, .vscode/, amlt/, data/, results/, __pycache__/, '*.pyc']

storage:
  student_store:
    storage_account_name: csnewsandfeeds4150361735
    container_name: amulet
    mount_dir: /mnt/amulet
    is_output: true

jobs:
  - &probe
    name: state8-taxonomy-consolidation-t3heavy-r100-probe
    sku: 80G1-A100
    process_count_per_node: 1
    mpi: false
    sla_tier: Standard
    command: &command |
      set -euo pipefail
      trap 'rc=$$?; printf "FAILED line=%s rc=%s command=%s\n" "$${LINENO}" "$$rc" "$${BASH_COMMAND}" >&2; exit "$$rc"' ERR
      bash scripts/run_state8_taxonomy_consolidation_milestone_probe.sh
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-consolidation-probe-venv
        PROBE_VARIANT: t3heavy
        PROBE_ROUND: '100'

  - <<: *probe
    name: state8-taxonomy-consolidation-t3heavy-diag-r100-probe
    command: *command
    submit_args:
      max_attempts: 2
      max_run_duration_seconds: 21600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
        VENV_ROOT: /tmp/studentmodeling-state8-consolidation-probe-venv
        PROBE_VARIANT: t3heavy_diag
        PROBE_ROUND: '100'
