description: 'Frozen state8 interleaved-retention checkpoint: full 21,676-row T1-T5
  formal evaluation in 16 disjoint shards plus three MalRule C4 seeds and one frozen
  identical-query Eedi C4 panel; evaluation-only, no promotion claim'
target:
  service: manifold
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04:20260615T232545258
  setup:
  - python -m venv --system-site-packages /tmp/studentmodeling-state8-interleaved-full-eval-venv
  - /tmp/studentmodeling-state8-interleaved-full-eval-venv/bin/python -m pip install
    --upgrade pip
  - /tmp/studentmodeling-state8-interleaved-full-eval-venv/bin/python -m pip install
    -r requirements-feeds.txt
code:
  local_dir: $CONFIG_DIR/..
  ignore:
  - .git/
  - .vscode/
  - amlt/
  - data/
  - results/
  - __pycache__/
  - '*.pyc'
jobs:
- name: state8-interleaved-full-formal-shard00
  sku: 80G1-A100
  process_count_per_node: 1
  mpi: false
  sla_tier: Standard
  command: 'set -euo pipefail

    test "$$(sha256sum scripts/run_state8_interleaved_full_formal_shard.sh | cut -d''
    '' -f1)" = 7343ddffe618c341765353701c9472ea316a716d2037cf329c5d7f3f270f9b7e

    bash scripts/run_state8_interleaved_full_formal_shard.sh

    '
  submit_args:
    max_attempts: 2
    max_run_duration_seconds: 259200
    env:
      _AZUREML_SINGULARITY_JOB_UAI: rankfun_aml
      VENV_ROOT: /tmp/studentmodeling-state8-interleaved-full-eval-venv
      STATE8_EVAL_RUN_DIR: /mnt/amulet/studentmodeling/checkpoints/state8_stateonly_repair_seed8401_taskanchor_source_anchor_full_mse1_eedi_same_question_v1_early_label_high_seed8401
